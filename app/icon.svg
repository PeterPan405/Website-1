<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    Favicon: dasselbe Zeichen wie das Signet auf der Website, nur ohne den
    Schriftzug „IMI“ – der ist bei 16 bis 32 Pixel nicht lesbar.

    Die frühere Fassung war ein eigenständig gezeichneter Ring aus vier Bögen
    ohne Köpfe. Sie war gegenüber dem Logo um 45 Grad gedreht, wodurch die Farben
    in anderen Quadranten lagen: Navy saß oben rechts statt oben links, Grün oben
    links statt unten links. Ohne die Köpfe blieb zudem nur ein Ring übrig, in dem
    die Marke nicht wiederzuerkennen war.

    Deshalb jetzt dieselbe Geometrie wie public/logo.svg und
    components/ui/Logo.tsx: Vier Figuren im Ring, jede füllt einen Quadranten,
    die Verbindungen liegen bei 12, 3, 6 und 9 Uhr, die Köpfe auf den Diagonalen
    dazwischen. Oben links Navy, oben rechts Grau, unten rechts Rot, unten links
    Grün.

    Die Köpfe reichen bis Radius 99 und füllen die Zeichenfläche damit fast
    vollständig – in der Browserleiste zählt jeder Pixel. Ändert sich das Logo,
    müssen diese Pfade mitgeführt werden.
  -->
  <g fill="#17296F">
    <path
      d="M 40.45 92.69 A 60 60 0 0 1 92.69 40.45"
      fill="none"
      stroke="#17296F"
      stroke-width="32"
      stroke-linecap="round"
    />
    <circle cx="43.43" cy="43.43" r="19" />
  </g>
  <g fill="#6E6E6E">
    <path
      d="M 107.31 40.45 A 60 60 0 0 1 159.55 92.69"
      fill="none"
      stroke="#6E6E6E"
      stroke-width="32"
      stroke-linecap="round"
    />
    <circle cx="156.57" cy="43.43" r="19" />
  </g>
  <g fill="#8B2225">
    <path
      d="M 159.55 107.31 A 60 60 0 0 1 107.31 159.55"
      fill="none"
      stroke="#8B2225"
      stroke-width="32"
      stroke-linecap="round"
    />
    <circle cx="156.57" cy="156.57" r="19" />
  </g>
  <g fill="#205437">
    <path
      d="M 92.69 159.55 A 60 60 0 0 1 40.45 107.31"
      fill="none"
      stroke="#205437"
      stroke-width="32"
      stroke-linecap="round"
    />
    <circle cx="43.43" cy="156.57" r="19" />
  </g>
</svg>
