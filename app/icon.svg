<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    Favicon: der Ring in vier Farben, ohne Köpfe und ohne Schriftzug.

    Bewusst stärker reduziert als das Signet auf der Website. Bei 16 bis 32 Pixel
    fallen die Köpfe der vier Figuren zu Punkten zusammen und machen die Form
    unruhig, statt sie zu erklären. Übrig bleibt, was in dieser Größe überhaupt
    erkennbar ist: ein Ring aus vier deutlich getrennten Farbbögen.

    Der Ring ist dafür dicker als im Volllogo (38 statt 24) und füllt die
    Zeichenfläche zu 85 Prozent statt zu 77 – ohne die Köpfe braucht es außen
    keinen Platz mehr, und in der Browserleiste zählt jeder Pixel. Die Lücken
    sind mit 10 Grad kleiner gehalten, damit sie den Ring bei 16 Pixel nicht
    auftrennen.
  -->
  <g fill="none" stroke-width="38" stroke-linecap="round">
    <path d="M 100 34 A 66 66 0 0 1 165 88.54" stroke="#17296F" />
    <path d="M 166 100 A 66 66 0 0 1 111.46 165" stroke="#6E6E6E" />
    <path d="M 100 166 A 66 66 0 0 1 35 111.46" stroke="#8B2225" />
    <path d="M 34 100 A 66 66 0 0 1 88.54 35" stroke="#205437" />
  </g>
</svg>
