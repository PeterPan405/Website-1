<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="IM Invests">
  <title>IM Invests</title>
  <!--
    Vier Figuren im Ring, dazu der Wortbestandteil IMI in der Mitte.

    Je Figur ein Kopfkreis und ein dicker Bogen als Körper, der im Uhrzeigersinn
    bis zum Kopf der nächsten Figur läuft – dadurch schließt sich der Ring.

    Nachbau des Logos als Vektor, bewusst reduziert: Die Puzzle-Verzahnung des
    Originals ergibt in dieser Größe kein erkennbares Motiv. Liegt die
    Originaldatei vor, kann sie diese Datei ersetzen – im Quellcode hängt nichts
    an den konkreten Pfaden. Die Farben stehen zusätzlich als Design-Tokens in
    app/globals.css.
  -->
  <g fill="#17296F">
    <path
      d="M 100 44 A 56 56 0 0 1 152.62 80.85"
      fill="none"
      stroke="#17296F"
      stroke-width="24"
      stroke-linecap="round"
    />
    <circle cx="100" cy="23" r="20" />
  </g>
  <g fill="#6E6E6E">
    <path
      d="M 156 100 A 56 56 0 0 1 119.15 152.62"
      fill="none"
      stroke="#6E6E6E"
      stroke-width="24"
      stroke-linecap="round"
    />
    <circle cx="177" cy="100" r="20" />
  </g>
  <g fill="#8B2225">
    <path
      d="M 100 156 A 56 56 0 0 1 47.38 119.15"
      fill="none"
      stroke="#8B2225"
      stroke-width="24"
      stroke-linecap="round"
    />
    <circle cx="100" cy="177" r="20" />
  </g>
  <g fill="#205437">
    <path
      d="M 44 100 A 56 56 0 0 1 80.85 47.38"
      fill="none"
      stroke="#205437"
      stroke-width="24"
      stroke-linecap="round"
    />
    <circle cx="23" cy="100" r="20" />
  </g>
  <!-- Innendurchmesser des Rings: 88 Einheiten. Der Schriftzug bleibt darunter. -->
  <text
    x="100"
    y="112"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="1"
    fill="#6E6E6E"
  >
    IMI
  </text>
</svg>
