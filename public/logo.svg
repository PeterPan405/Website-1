<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="IM Invests">
  <title>IM Invests</title>
  <!--
    Vier Figuren im Ring, dazu der Wortbestandteil IMI in der Mitte.

    Je Figur ein Viertelbogen als Körper und ein Kopfkreis, der mittig über dem
    eigenen Körper auf der Diagonale sitzt und in ihn hineinreicht. Gleiche Farbe
    und Überlappung lassen beide zu einer Form verschmelzen.

    Aufteilung wie im Original: Jede Figur füllt einen Quadranten, die
    Verbindungen liegen bei 12, 3, 6 und 9 Uhr, die Köpfe auf den Diagonalen.
    Oben links Navy, oben rechts Grau, unten rechts Rot, unten links Grün.

    Nachbau als Vektor, bewusst ohne die Puzzle-Verzahnung des Originals – die
    ergibt in den hier verwendeten Größen kein erkennbares Motiv. Liegt die
    Originaldatei vor, kann sie diese Datei ersetzen: Im Quellcode hängt nichts
    an den konkreten Pfaden. Die Farben stehen zusätzlich als Design-Tokens in
    app/globals.css.
  -->
  <g fill="#17296F">
    <path
      d="M 40.45 92.69 A 60 60 0 0 1 92.69 40.45"
      fill="none"
      stroke="#17296F"
      stroke-width="32"
      stroke-linecap="round"
    />
    <circle cx="43.43" cy="43.43" r="19" />
  </g>
  <g fill="#6E6E6E">
    <path
      d="M 107.31 40.45 A 60 60 0 0 1 159.55 92.69"
      fill="none"
      stroke="#6E6E6E"
      stroke-width="32"
      stroke-linecap="round"
    />
    <circle cx="156.57" cy="43.43" r="19" />
  </g>
  <g fill="#8B2225">
    <path
      d="M 159.55 107.31 A 60 60 0 0 1 107.31 159.55"
      fill="none"
      stroke="#8B2225"
      stroke-width="32"
      stroke-linecap="round"
    />
    <circle cx="156.57" cy="156.57" r="19" />
  </g>
  <g fill="#205437">
    <path
      d="M 92.69 159.55 A 60 60 0 0 1 40.45 107.31"
      fill="none"
      stroke="#205437"
      stroke-width="32"
      stroke-linecap="round"
    />
    <circle cx="43.43" cy="156.57" r="19" />
  </g>
  <!-- Innendurchmesser des Rings: 88 Einheiten. Der Schriftzug bleibt darunter. -->
  <text
    x="100"
    y="112"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="1"
    fill="#6E6E6E"
  >
    IMI
  </text>
</svg>
