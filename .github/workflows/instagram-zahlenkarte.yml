name: Instagram-Zahlenkarte

# Veröffentlicht die Zahlenkarte des Tages – ein einzelnes Bild.
#
# **Nur nach Freigabe, und frühestens um 16 Uhr.** Anordnung des Betreibers
# vom 15.10.2026: Die Themen werden abgesprochen, der Entwurf kommt in den
# Chat, und erst nach seinem „passt" geht er hinaus. Am selben Tag ging die
# erste Karte nach dem „passt" um 08:59 Uhr hinaus; seine Antwort: „der
# Beitrag des Tages kommt immer erst um 16 Uhr". Seitdem sind Freigabe und
# Veröffentlichung getrennt (`lib/zahlenkarten-wecker.ts`):
#
#   - Die **Freigabe** ist ein Datum an der Karte (`freigabe` in
#     `data/instagram-zahlenkarten.ts`), eingetragen nach dem „passt" und mit
#     dem Bau auf der Website (Zeile 2 von `/instagram/zahlenkarte.txt`).
#   - **Angestoßen** wird dieser Workflow vom Dauerlauf
#     (`kurse-dauerlauf.yml`), der ab 16 Uhr alle zehn Minuten fragt –
#     geplante Läufe sind eine Bitte. Die zwei Crons sind Rückfall: 14:07 UTC
#     ist 16:07 im Sommer, 15:07 UTC ist 16:07 im Winter; der jeweils andere
#     hält am Riegel „vor 16 Uhr" bzw. „steht schon im Kanal" und schickt
#     nichts. Dadurch muss die Zeitumstellung hier nichts nachziehen.
#
# Ein Start von Hand vor 16 Uhr schickt nichts. Die Riegel stehen im Skript
# (`scripts/instagram-zahlenkarte.ts`): 16 Uhr vorbei, Freigabe heute,
# Website zeigt die Karte von heute, Bild antwortet als JPEG, diese Karte
# steht noch nicht im Kanal.

on:
  workflow_dispatch:
  schedule:
    - cron: '7 14 * * *'
    - cron: '7 15 * * *'

concurrency:
  group: instagram-zahlenkarte
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Zahlenkarte veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          NEXT_PUBLIC_SITE_URL: https://iminvests.de
        run: node --experimental-strip-types scripts/instagram-zahlenkarte.ts

      # Dieselbe Karte auf X (Betreiber, 17.10.2026) – erst, wenn X scharf
      # gestellt ist. Die Riegel dort sind dieselben: Freigabe heute, 16 Uhr
      # vorbei, heute noch nicht geteilt.
      - name: X-Beitrag anstoßen
        if: always() && vars.X_AKTIV == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run x-beitrag.yml --repo "${{ github.repository }}" --ref main \
            -f art=zahlenkarte -f scharf=auto \
            || echo "::warning::Der X-Lauf ließ sich nicht anstoßen – der Rückfall um 15:19 UTC greift."
