name: Podcastfolge erzeugen

# Baut täglich die Folge des Tages: Sprechtext, Stimme, MP3, Video,
# Kapitelmarken – und veröffentlicht sie in den eigenen Feed und zu YouTube.
#
# ## Warum drei Stufen und nicht ein Lauf
#
# Weil ein Läufer die Stimme nicht schafft. Am 8. August 2026 gemessen:
# Echtzeitfaktor 0,13, daraus gerechnet 38 Minuten für fünf Minuten Sprache.
# Der erste echte Lauf brauchte **über 57** und lief in die Frist – jedes
# Stück kostet eigenen Vorlauf, den eine Messung an einem einzigen Stück
# nicht zeigt.
#
#   1. `text`          – Sprechtext, Titel, Beschreibung, Kapitel
#   2. `sprechen`      – vier Läufer sprechen gleichzeitig je ein Viertel
#   3. `veroeffentlichen` – zusammenfügen, Video, Feed, Server, YouTube
#
# Das kostet nicht mehr Läuferzeit als vorher – dieselbe Rechenarbeit,
# nur nebeneinander statt nacheinander –, und es passt in die Frist.
#
# ## Zwei Wege zur Stimme, in dieser Rangfolge
#
# 1. **Die eigene Stimme**, geklont aus `assets/stimme-referenz.wav` und
#    ihrem Wortlaut daneben. Kostet nichts, klingt nach dem Betreiber.
# 2. **ElevenLabs als Rückfall** – nur, wenn Weg 1 scheitert, und nur mit
#    hinterlegten Secrets.
#
# Scheitern beide, endet der Lauf nach dem Text: Der liegt als Artefakt
# bereit. Eine fehlende Einstellung ist ein Zustand, kein Fehler.
#
# ## Zeitplan
#
# **02:53 UTC, jeden Tag – 4:53 Uhr deutscher Zeit.**
#
# Die Zusage lautet 6:00 Uhr deutscher Zeit, und zwar für die Folge genauso
# wie für die Nachrichten. Rückwärts gerechnet mit den gemessenen Zeiten:
# Text 1 Minute, Stimme rund 25 (vier Läufer gleichzeitig), Video und
# Upload 5, Paketbau samt Übertragung 6 – macht gut 37 Minuten. Start
# 04:53, fertig gegen 05:36 deutscher Zeit, rund 25 Minuten Reserve.
#
# Bis zum 8. August 2026 stand hier 04:53 **UTC**, also 6:53 Uhr deutscher
# Zeit. Online wäre die Folge damit gegen halb acht gewesen – fast zwei
# Stunden nach der Zusage. Neben „Frist 04:00 UTC" sah „04:53" harmlos aus;
# genau deshalb steht in AGENTS.md die deutsche Zeit jetzt vorn.
#
# Der Termin liegt **hinter** dem dritten Anlauf des Nachrichtenlaufs
# (04:47): Die Folge vertont die Tagesausgabe, und ohne sie hat sie nichts
# zu sprechen.
#
# Krumme Minute, wie überall hier: Volle und halbe Stunden werden von
# GitHub am ehesten verworfen. Und weil geplante Läufe regelmäßig ganz
# ausfallen, stößt `kurse.yml` den Lauf an, wenn er heute nicht stattfand.

on:
  schedule:
    # **Jeden Tag.** Seit dem 9. August 2026 erscheint die Folge sieben Tage
    # die Woche – Anordnung des Betreibers.
    #
    # Vorher stand hier `1-5` und daneben ein zweiter Eintrag für Sonntage,
    # den ein Riegel über `data/podcast-probetage.txt` gewöhnlich sofort
    # wieder abbrach. Beides ist weg: Ein Wochenende, an dem nichts
    # erscheint, gibt es nicht mehr, und damit auch keinen Probetag, der
    # eine Ausnahme davon wäre.
    #
    # Der Nachrichtenlauf lief ohnehin schon täglich – die Tagesausgabe, die
    # hier vertont wird, ist also auch am Samstag da.
    # **Nur noch Rückfall.** Seit dem 11. August 2026 stößt
    # `nachrichten.yml` die Folge an, sobald die Tagesausgabe steht – der
    # Podcast vertont sie, und vorher hat er nichts zu sprechen. Ein fester
    # Termin war deshalb immer nur eine Schätzung, wann die Ausgabe fertig
    # sein könnte, und am 11. August ging sie um 74 Minuten daneben.
    #
    # Die beiden Termine hier greifen, wenn der Anstoß ausbleibt: 03:53 und
    # 04:33 deutscher Zeit. Der spätere ist der letzte, der die Frist um
    # 6:00 noch hält – 37 Minuten braucht die Folge.
    - cron: '53 1 * * *'
    - cron: '33 2 * * *'
  workflow_dispatch:
    inputs:
      zugang_pruefen:
        description: 'Nur die Zugänge prüfen, keine Folge bauen'
        type: boolean
        default: false
      nur_proben:
        description: 'Bauen und vertonen, aber nichts veröffentlichen'
        type: boolean
        default: false
      nochmal:
        description: 'Auch bauen, wenn die Folge des Tages schon steht'
        type: boolean
        default: false
      stichtag:
        description: 'Tagesausgabe eines anderen Tages (JJJJ-MM-TT)'
        type: string
        default: ''

concurrency:
  group: podcast-erzeugen
  cancel-in-progress: false

jobs:
  # ====================================================================
  # 1. Der Text. Schnell, und ohne ihn hat der Rest nichts zu tun.
  # ====================================================================
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      erscheint: ${{ steps.tag.outputs.erscheint }}
      veroeffentlichen: ${{ steps.tag.outputs.veroeffentlichen }}
      # Welcher Tag gemeint ist – gebraucht vom Riegel vor dem Upload.
      stichtag: ${{ steps.tag.outputs.stichtag }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      # **Jeder Tag ist ein Erscheinungstag.** Übrig bleibt hier deshalb nur
      # noch eine Frage – die nach dem doppelten Upload.
      - name: Steht die Folge des Tages schon?
        id: tag
        run: |
          heute=$(date -u +%Y-%m-%d)

          # Steht die Folge des Tages schon im Feed?
          #
          # Der Fehler, aus dem diese Prüfung entstanden ist, ist am
          # 9. August 2026 passiert: Der Sonntags-Cron wurde nicht
          # verworfen, sondern **72 Minuten zu spät** ausgeführt – um
          # 04:05 UTC. Da hatte ein Handstart um 03:04 die Folge längst
          # gebaut und hochgeladen. Ergebnis: zwei Videos desselben Tages
          # auf demselben Kanal. Im Repository fiel es nicht auf, weil der
          # zweite Lauf den Eintrag im Feed überschrieb – dort stand danach
          # genau eine Folge. Nur YouTube hatte sie doppelt.
          #
          # Der Feed ist die richtige Stelle: Er ist die Liste dessen, was
          # veröffentlicht wurde, und wer eine Folge hochlädt, trägt sie
          # dort ein. `nachrichten.yml` prüft seit dem 5. August genauso,
          # ob die Ausgabe schon steht; hier fehlte es schlicht.
          stichtag="${{ inputs.stichtag }}"
          [ -n "$stichtag" ] || stichtag="$heute"

          # **Gefragt wird `origin/main` von jetzt, nicht der eigene Checkout.**
          #
          # Genau daran ist der Riegel am 10. August 2026 vorbeigelaufen, und
          # zwar um dreißig Sekunden:
          #
          #     04:15:44  Lauf 1 startet (Anstoß aus kurse.yml)
          #     04:18:59  Lauf 2 startet (der verspätete Cron) und wird von
          #               `concurrency` in die Warteschlange gestellt
          #     04:31:04  Lauf 1 trägt die Folge auf main ein
          #     04:31:34  Lauf 2 läuft an und fragt hier – und sagt „nein"
          #     04:45:11  Lauf 2 lädt ein zweites Video hoch
          #
          # Die Sperre hat funktioniert; Lauf 2 hat zwölf Minuten gewartet.
          # Nur half das nichts: `actions/checkout` holt den Stand, der beim
          # **Auslösen** galt (hier 04:18:59), und in dem stand die Folge
          # naturgemäß noch nicht. Ein Riegel, der eine Datei aus der
          # Vergangenheit liest, ist keiner.
          #
          # Dieselbe Lehre wie beim Nachrichtenlauf und beim Wächter: Wer
          # fragt, ob etwas schon passiert ist, fragt die Gegenwart.
          git fetch origin main --depth 1 -q || true
          feed="${RUNNER_TEMP:-/tmp}/feed-stand.json"
          git show origin/main:data/podcast-eigener-feed.json > "$feed" 2>/dev/null \
            || cp data/podcast-eigener-feed.json "$feed"

          schon=nein
          if node -e '
                const feed = require(process.argv[1])
                process.exit(feed.folgen.some((f) => f.datum === process.argv[2]) ? 0 : 1)
              ' "$feed" "$stichtag" 2>/dev/null; then
            schon=ja
          fi

          if [ "${{ inputs.zugang_pruefen }}" = "true" ]; then
            echo "erscheint=nein" >> "$GITHUB_OUTPUT"
            echo "Zugangsprobe angefordert – es wird keine Folge gebaut."
          elif [ "$schon" = "ja" ] && [ "${{ inputs.nochmal }}" != "true" ] \
               && [ "${{ inputs.nur_proben }}" != "true" ]; then
            # Kein roter Lauf: Dass die Folge schon steht, ist ein Zustand,
            # kein Fehler – genau der, den ein verspäteter Zeitplan täglich
            # erzeugen kann. Wer sie ersetzen will, startet mit `nochmal`.
            echo "erscheint=nein" >> "$GITHUB_OUTPUT"
            echo "Für den $stichtag steht bereits eine Folge im Feed."
            echo "Ein zweiter Lauf würde ein zweites Video hochladen – Ende hier."
          else
            echo "erscheint=ja" >> "$GITHUB_OUTPUT"
            if [ "$schon" = "ja" ]; then
              echo "Achtung: Für den $stichtag steht schon eine Folge – sie wird ersetzt."
            fi
          fi

          echo "stichtag=$stichtag" >> "$GITHUB_OUTPUT"

          # Eine Probe darf nichts veröffentlichen. `nur_proben` ist der
          # ausdrückliche Haken dafür – und seit dem Wechsel auf täglich der
          # einzige Grund, eine Folge zu bauen und nicht zu senden.
          if [ "${{ inputs.nur_proben }}" = "true" ]; then
            echo "veroeffentlichen=nein" >> "$GITHUB_OUTPUT"
            echo "Probelauf – es wird nichts veröffentlicht."
          else
            echo "veroeffentlichen=ja" >> "$GITHUB_OUTPUT"
          fi

      # Die Zugangsprobe läuft ohne Folge: Sie fragt bei YouTube nur den
      # Kanalnamen ab und beweist damit, dass Schlüssel und Token stimmen.
      # Ohne sie stellte sich das erst am ersten echten Morgen heraus – und
      # dann fehlte die Folge.
      - name: Zugänge prüfen
        if: inputs.zugang_pruefen
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Ohne diese Zeile prüfte die Probe alles außer der Playlist – und
          # gerade die fällt beim echten Upload nicht auf, weil das
          # Einsortieren dort bewusst nur eine Warnung ist.
          YT_PLAYLIST_ID: ${{ vars.YT_PLAYLIST_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_SHOW_ID: ${{ vars.SPOTIFY_SHOW_ID }}
        run: |
          npm run youtube
          echo "---"
          # Zählt die Folgen, für die Spotify eine Adresse liefert. Ohne
          # Zugangsdaten sagt der Lauf das und endet mit null – dann steht
          # auf der Website bei jeder Folge nur der YouTube-Verweis.
          npm run spotifylinks
          echo "---"
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            echo "[stimme] Schlüssel hinterlegt."
          else
            echo "[stimme] Kein ELEVENLABS_API_KEY – ohne ihn entsteht kein Audio."
          fi

      - name: Sprechtext, Titel und Beschreibung erzeugen
        if: steps.tag.outputs.erscheint == 'ja'
        env:
          STICHTAG: ${{ inputs.stichtag }}
        run: npm run folge

      - name: Text weiterreichen
        if: steps.tag.outputs.erscheint == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: folge-text
          path: podcast-folge/
          retention-days: 1

  # ====================================================================
  # 2. Die Stimme. Vier Läufer, jeder spricht jedes vierte Stück.
  #
  # Reihum statt blockweise: Die Stücke sind unterschiedlich lang, und so
  # verteilt sich die Rechenzeit gleichmäßiger. Jedes Stück kommt als
  # eigene Datei mit seiner Nummer heraus – das Zusammenfügen ist dann ein
  # Sortieren nach Dateinamen und sonst nichts.
  # ====================================================================
  sprechen:
    needs: text
    if: needs.text.outputs.erscheint == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # Kein `fail-fast`: Fällt ein Läufer aus, sollen die anderen ihre
      # Stücke trotzdem fertig sprechen. Ob es reicht, entscheidet der
      # Schritt danach – der merkt eine Lücke und sagt es.
      fail-fast: false
      matrix:
        teil: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: folge-text
          path: podcast-folge/

      # Über ein Gigabyte Modelldateien. Ohne Zwischenspeicher lädt jeder
      # Läufer sie jeden Morgen neu.
      - name: Zwischenspeicher für das Sprachmodell
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen-tts-0.6B

      # torch und torchaudio müssen aus **derselben** Quelle kommen. qwen-tts
      # zieht sich sonst die Grafikkarten-Fassung von torchaudio nach, und
      # deren C++-Teil lässt sich neben dem CPU-torch nicht laden:
      #
      #     OSError: Could not load this library: …/_torchaudio.abi3.so
      #
      # Deshalb beide zuletzt noch einmal aus der CPU-Quelle erzwingen.
      - name: Sprachmodell einrichten
        run: |
          python -m pip install --upgrade pip
          pip install "transformers<=4.57.6" soundfile librosa numpy qwen-tts
          pip install --force-reinstall \
            --index-url https://download.pytorch.org/whl/cpu torch torchaudio

      # ------------------------------------------------------------------
      # Prüft die Prüfung, bevor gesprochen wird.
      #
      # `brauchbar` in `sprechstimme.py` sah bis zum 10. August 2026 aus, als
      # tue sie ihre Arbeit. Sie lief bei jedem Stück mit, schrieb nie eine
      # Warnung – und ließ dabei zweimal eine Störung durch, die der Betreiber
      # beim Hören sofort bemerkte.
      #
      # Eine Absicherung, die nie anschlägt, sieht genauso aus wie eine, die
      # nichts zu beanstanden findet. Der Selbsttest legt ihr deshalb Fälle
      # vor, die sie beanstanden **muss** – darunter genau die Störung von
      # jenem Tag. Er braucht nur numpy und läuft in unter einer Sekunde.
      - name: Tonprüfung selbst prüfen
        run: python scripts/sprechstimme.py --selbsttest

      - name: Sprechen
        env:
          TEIL: ${{ matrix.teil }}
          TEILE: '4'
        run: python scripts/stimme-erzeugen.py

      - uses: actions/upload-artifact@v4
        with:
          name: stimme-${{ matrix.teil }}
          path: podcast-folge/stueck-*.wav
          retention-days: 1
          if-no-files-found: error

  # ====================================================================
  # 3. Zusammenfügen und veröffentlichen.
  #
  # `always()`, damit ein ausgefallener Sprechläufer nicht den ganzen Weg
  # beendet: Fehlt ein Stück, sagt das Zusammenfügen es und der Rückfall
  # auf die Schnittstelle greift.
  # ====================================================================
  veroeffentlichen:
    needs: [text, sprechen]
    if: always() && needs.text.outputs.erscheint == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # write: das Folgenregister data/podcast-eigener-feed.json wird nach
      # jeder veröffentlichten Folge committet – der Feed bleibt damit aus
      # dem Repository reproduzierbar.
      contents: write
      # Zum Anstoßen des Paketbaus über `gh workflow run` – siehe unten.
      actions: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install soundfile numpy

      # ffmpeg liegt **nicht** mehr auf dem Läufer.
      #
      # Am 8. August 2026 sprachen vier Läufer die Folge fehlerfrei – 19
      # Stücke, sechs Minuten, lückenlos – und dann scheiterte alles daran:
      #
      #     FileNotFoundError: [Errno 2] No such file or directory: 'ffmpeg'
      #
      # Frühere Ubuntu-Abbilder brachten es mit, das aktuelle nicht mehr.
      # Der Podcast braucht es an drei Stellen: MP3 aus den Stücken, Video
      # aus Cover und Ton, und `ffprobe` für die Dauer im Feed.
      # ffmpeg liegt seit dem 8. August 2026 nicht mehr auf dem Läufer-Abbild.
      # Ohne ihn entsteht keine MP3 und kein Video – die Folge bliebe eine
      # WAV-Datei im Arbeitsverzeichnis.
      #
      # ## Warum `apt-get update` scheitern darf
      #
      # Der erste Anlauf ist genau daran gescheitert, und **nicht an ffmpeg**:
      #
      #   E: Failed to fetch https://packages.microsoft.com/repos/azure-cli/…
      #      403 Forbidden
      #   ##[error]Process completed with exit code 100.
      #
      # Auf dem Läufer sind fremde Paketquellen eingetragen (Microsofts
      # Azure-CLI-Repo). Antwortet eine davon mit 403, endet `apt-get update`
      # mit Code 100 – und `bash -e` reißt den ganzen Schritt mit, obwohl das
      # Ubuntu-Archiv, aus dem ffmpeg kommt, tadellos erreichbar war.
      #
      # Deshalb ist das Auffrischen der Paketlisten hier ausdrücklich
      # unkritisch. Ob es geklappt hat, entscheidet nicht diese Zeile,
      # sondern die Installation danach: Die muss gelingen, und `ffmpeg
      # -version` beweist es.
      - name: ffmpeg einrichten
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg liegt schon bereit."
            ffmpeg -version | head -1
            exit 0
          fi

          sudo apt-get update -qq \
            || echo "::warning::apt-get update meldet Fehler (fremde Paketquelle) – die Installation wird trotzdem versucht."
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - uses: actions/download-artifact@v4
        with:
          name: folge-text
          path: podcast-folge/

      # Alle vier Stimmartefakte in denselben Ordner. `merge-multiple`
      # legt sie nebeneinander statt in Unterordner – die Nummer im
      # Dateinamen hält sie auseinander.
      - uses: actions/download-artifact@v4
        with:
          pattern: stimme-*
          path: podcast-folge/
          merge-multiple: true

      # `continue-on-error`, weil danach der Rückfall kommt. Ein Fehlschlag
      # hier ist im Protokoll sichtbar, beendet den Lauf aber nicht – sonst
      # gäbe es an einem schlechten Morgen gar keine Folge.
      - name: Stücke zur Folge zusammenfügen
        continue-on-error: true
        run: python scripts/stimme-zusammenfuegen.py

      # Weg 2: die Schnittstelle. Nur, wenn Weg 1 nichts hinterlassen hat –
      # gefragt wird nach der Datei, nicht nach dem Ergebnis des Schritts:
      # Was zählt, ist die Aufnahme, nicht wer sie gemacht hat.
      - name: Vertonen über die Schnittstelle (Rückfall)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          if [ -f podcast-folge/folge.mp3 ]; then
            echo "Die eigene Stimme hat die Folge gesprochen – kein Rückfall nötig."
            exit 0
          fi
          echo "::warning::Die eigene Stimme hat nichts geliefert – Rückfall auf die Schnittstelle."
          npm run vertonen

      # Video und Kapitelmarken entstehen nur, wenn eine Aufnahme da ist.
      # Der ffmpeg-Aufruf stammt aus der erprobten Arbeitsanweisung:
      # -map verhindert, dass ein eingebettetes Coverbild der MP3 zur
      # zweiten Videospur wird; -g 20 bei 10 fps hält das Springen im
      # Player sauber; auf -tune stillimage wird bewusst verzichtet.
      - name: Video bauen und Kapitelzeiten messen
        run: |
          if [ ! -f podcast-folge/folge.mp3 ]; then
            echo "Keine Aufnahme – Text liegt als Artefakt bereit."
            exit 0
          fi

          ffmpeg -y -loglevel error \
            -loop 1 -framerate 10 -i assets/podcast-cover.jpg \
            -i podcast-folge/folge.mp3 \
            -map 0:v:0 -map 1:a:0 \
            -vf "scale=1080:1080,pad=1920:1080:420:0:white,format=yuv420p" \
            -c:v libx264 -preset medium -crf 20 -r 10 -g 20 \
            -c:a aac -b:a 192k -ar 44100 -ac 2 \
            -movflags +faststart -shortest \
            "podcast-folge/video.mp4"

          # Sprechpausen finden und den Kapiteln der Reihe nach zuordnen.
          # Mindestabstand 30 Sekunden, sonst wird zusammengefasst – die
          # Regel, mit der die Marken auf YouTube und Spotify zugleich
          # funktionieren.
          #
          # 0,78 s und nicht 0,6: Seit dem 9. August hängt die Sprechpause am
          # Satzzeichen, damit die Folge weniger metronomisch klingt. Eine
          # Frage bekommt bis zu 0,73 s – mit der alten Schwelle wäre jedes
          # Fragezeichen ein Kapitelanfang geworden. Absatzpausen liegen bei
          # 0,88 bis 1,02 s und damit sicher darüber.
          #
          # Wer die Pausen in `stimme-erzeugen.py` ändert, prüft diese Zahl
          # mit: Sie müssen zwischen der längsten Satzpause und der kürzesten
          # Absatzpause liegen.
          ffmpeg -i podcast-folge/folge.mp3 \
            -af silencedetect=noise=-35dB:d=0.78 -f null - 2>&1 \
            | grep -o 'silence_end: [0-9.]*' | awk '{print $2}' \
            > podcast-folge/pausen.txt

          python3 - <<'ENDE'
          kapitel = [z.strip() for z in open('podcast-folge/kapitel.txt') if z.strip()]
          pausen = [float(z) for z in open('podcast-folge/pausen.txt') if z.strip()]
          zeiten = [0.0]
          for pause in pausen:
              if len(zeiten) >= len(kapitel):
                  break
              if pause - zeiten[-1] >= 30:
                  zeiten.append(pause)
          # Übrige Kapitel ohne eigene Pause an das letzte anhängen
          namen = kapitel[: len(zeiten)]
          if len(kapitel) > len(zeiten):
              namen[-1] = namen[-1] + ' und mehr'
          marken = '\n'.join(
              f'({int(t // 60)}:{int(t % 60):02d}) {n}' for t, n in zip(zeiten, namen)
          )
          text = open('podcast-folge/beschreibung.txt').read()
          open('podcast-folge/beschreibung.txt', 'w').write(
              text.replace('[KAPITEL]', marken)
          )
          print(marken)
          ENDE

      # Der Riegel gegen das doppelte Video sitzt **im Skript**, unmittelbar
      # vor dem Upload – nicht hier oben und nicht im Job davor.
      #
      # Zweimal hintereinander, am 9. und am 10. August 2026, erschienen zwei
      # Videos desselben Tages auf dem Kanal. Beide Male gab es einen Riegel,
      # beide Male fragte er einen Stellvertreter: erst den eigenen Checkout
      # des Feeds, dann `origin/main` beim Auslösen des Laufs. Und am
      # 10. August trat obendrein der Fall ein, gegen den kein Feed-Riegel
      # hilft: Ein Lauf lud hoch, schrieb den Feed – und scheiterte danach am
      # Commit. Auf dem Kanal lag ein Video, im Register stand keins.
      #
      # `PODCAST_STICHTAG` sagt dem Skript, welcher Tag gemeint ist;
      # `PODCAST_NOCHMAL` ist der ausdrückliche Weg, den Riegel zu übergehen,
      # wenn eine Folge wirklich ersetzt werden soll.
      - name: Zu YouTube hochladen
        if: needs.text.outputs.veroeffentlichen == 'ja'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PLAYLIST_ID: ${{ vars.YT_PLAYLIST_ID }}
          PODCAST_STICHTAG: ${{ needs.text.outputs.stichtag }}
          PODCAST_NOCHMAL: ${{ inputs.nochmal }}
        run: npm run youtube

      # ------------------------------------------------------------------
      # Veröffentlichen: MP3 und Feed auf den Server, Video zu YouTube.
      #
      # Die Audiodateien liegen unter ~/podcast-audio, außerhalb des
      # Ordners, den der Paketbau bei jedem Deploy austauscht – sonst wären
      # sie nach dem nächsten Bau weg. In den Webpfad kommt eine Kopie, die
      # auch der Paketbau nach jedem Umhängen neu anlegt.
      - name: Feed und Audio auf den Server
        if: needs.text.outputs.veroeffentlichen == 'ja'
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_PORT: '65002'
          ZIELPFAD: domains/iminvests.de/public_html
          # Für die Adressen der Folgen bei Spotify – siehe weiter unten.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_SHOW_ID: ${{ vars.SPOTIFY_SHOW_ID }}
        run: |
          if [ ! -f podcast-folge/folge.mp3 ]; then
            echo "Keine Aufnahme – nichts zu veröffentlichen."
            exit 0
          fi
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$SSH_KEY" ]; then
            echo "Keine Server-Zugangsdaten – Folge bleibt als Artefakt."
            exit 0
          fi

          dauer=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 podcast-folge/folge.mp3)
          DAUER_SEKUNDEN="$dauer" npm run podcastfeed eintragen

          datum=$(python3 -c "import json;print(json.load(open('podcast-folge/folge.json'))['datum'])")

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # **Ein Anlauf reicht bei diesem Server nicht.** Am 9. August 2026
          # nachgemessen, dreimal derselbe Workflow gegen denselben Host:
          #
          #     11:46  ssh-keyscan scheitert nach 5 s
          #     11:49  ssh-keyscan gelingt
          #     11:53  ssh-keyscan scheitert nach 5 s
          #
          # Dazwischen, um 11:50, lief ein vollständiger Deploy durch – weil
          # `paket-bauen.yml` **fünfmal** anklopft und zwischen den Versuchen
          # wartet. Der Port flattert; wer einmal fragt, bekommt an guten
          # Tagen recht und an anderen nicht.
          #
          # Zwei Fehler steckten in der nackten Form. Der zweite ist der
          # teurere: Der Schritt läuft unter `bash -e`, ein fehlschlagendes
          # `ssh-keyscan` beendet ihn **sofort** – noch vor jeder sorgfältig
          # formulierten Fehlermeldung weiter unten. Der Lauf endete mit
          # „exit code 1" und keinem Wort dazu, warum. `2>/dev/null` tat den
          # Rest und verschluckte auch noch die Begründung.
          echo "— Hostschlüssel holen"
          geholt=nein
          for versuch in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p "$SSH_PORT" -H "$HOST" \
                 >> ~/.ssh/known_hosts 2>/tmp/keyscanfehler; then
              # `ssh-keyscan` liefert auch dann 0, wenn es nichts gefunden
              # hat. Gezählt wird deshalb, was tatsächlich ankam.
              if [ -s ~/.ssh/known_hosts ]; then
                geholt=ja
                echo "  Hostschlüssel hinterlegt (Versuch $versuch)."
                break
              fi
            fi
            echo "  Versuch $versuch ohne Ergebnis:"
            sed 's/^/    /' /tmp/keyscanfehler || true
            [ "$versuch" -lt 5 ] && sleep 10
          done

          if [ "$geholt" = nein ]; then
            echo "::error::Nach fünf Versuchen kein Hostschlüssel – Port $SSH_PORT antwortet nicht."
            echo "  Der Server flattert; ein späterer Lauf hat gute Aussichten."
            exit 1
          fi

          ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy "$USER@$HOST" \
            "mkdir -p ~/podcast-audio"
          scp -P "$SSH_PORT" -i ~/.ssh/id_deploy \
            podcast-folge/folge.mp3 "$USER@$HOST:~/podcast-audio/$datum.mp3"
          scp -P "$SSH_PORT" -i ~/.ssh/id_deploy \
            assets/podcast-cover.jpg "$USER@$HOST:~/podcast-audio/cover.jpg"
          scp -P "$SSH_PORT" -i ~/.ssh/id_deploy \
            podcast-folge/feed.xml "$USER@$HOST:~/podcast-audio/feed.xml"

          # ~/podcast-audio ist der Bestand, der den Deploy überlebt; in den
          # Webpfad kommt eine **Kopie**, kein Symlink.
          ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy "$USER@$HOST" \
            "rm -rf '$ZIELPFAD/podcast-audio' \
             && mkdir -p '$ZIELPFAD/podcast-audio' \
             && cp -a ~/podcast-audio/. '$ZIELPFAD/podcast-audio/' \
             && ls -1 '$ZIELPFAD/podcast-audio' | wc -l"
          rm -f ~/.ssh/id_deploy
          echo "Veröffentlicht: https://iminvests.de/podcast-audio/feed.xml"

          # Die Website mitziehen – im selben Lauf, aus demselben Register.
          #
          # Bis zum 8. August 2026 las `podcast.yml` dafür täglich um 04:41
          # UTC einen Feed über das Netz. Die Folge entsteht um 04:53, zwölf
          # Minuten **später**: Auf der Website stand jeden Morgen die Folge
          # von gestern. Das war kein Fehler im Ablauf, sondern in der
          # Reihenfolge – gefragt wurde, bevor es etwas zu fragen gab.
          # Die Spotify-Adressen der Folgen holen, bevor die Momentaufnahme
          # entsteht – sie stehen in keinem Feed, sondern werden von Spotify
          # beim Einlesen vergeben.
          #
          # Die Folge **dieses** Laufs ist dort naturgemäß noch nicht: Spotify
          # liest den Feed nach eigenem Takt. Sie bekommt ihren Verweis mit dem
          # Lauf am nächsten Morgen; bis dahin steht bei ihr nur YouTube. Ein
          # erfundener Link wäre die schlechtere Antwort.
          #
          # Scheitert der Abruf, bleibt es bei den bekannten Adressen – der
          # Rest der Veröffentlichung hängt nicht daran.
          npm run spotifylinks || echo "::warning::[spotify] Adressen konnten nicht aufgefrischt werden."

          npm run podcast

          # Das Register committen – der Feed bleibt reproduzierbar.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/podcast-eigener-feed.json data/snapshots/podcast.json data/podcast-spotify.json
          if ! git diff --cached --quiet; then
            git commit -m "Podcast: Folge $datum im eigenen Feed und auf der Website"
            gelungen=nein
            for versuch in 1 2 3; do
              if git pull --rebase origin "${{ github.ref_name }}" \
                 && git push origin "${{ github.ref_name }}"; then
                gelungen=ja
                break
              fi
              # Ein abgebrochener Rebase lässt die Arbeitskopie mit ungelösten
              # Konflikten zurück. Ohne Aufräumen scheitert jeder weitere
              # Versuch an „Pulling is not possible because you have unmerged
              # files" – dreimal dieselbe Meldung, und der Lauf sieht aus, als
              # hätte er es ernsthaft noch einmal probiert.
              git rebase --abort 2>/dev/null || true
              sleep $((versuch * 5))
            done

            # **Hier wird es rot, und zwar mit Ansage.**
            #
            # Am 10. August 2026 ist der Push genau hier gescheitert – ein
            # zweiter Lauf desselben Tages, Konflikt im Register – und der
            # Lauf blieb trotzdem grün. Die Schleife lief aus, der nächste
            # Schritt machte weiter, niemand erfuhr etwas.
            #
            # Das Ergebnis war ein Zustand, den man von außen nicht sieht und
            # von innen nicht vermutet: Auf dem Server lag ein `feed.xml`, das
            # auf ein Video zeigte, von dem das Repository nichts wusste –
            # Spotify bekam die eine Folge, die Website die andere.
            #
            # Bis hierher ist die Folge **veröffentlicht**: Video hochgeladen,
            # Feed und Audio auf dem Server. Wenn dann das Register nicht
            # nachkommt, ist das kein „der nächste Lauf trägt es nach",
            # sondern ein Auseinanderlaufen zweier Wahrheiten. Genau dafür
            # ist ein roter Lauf da – siehe die Trennlinie in AGENTS.md.
            if [ "$gelungen" != ja ]; then
              echo "::error::Die Folge ist veröffentlicht, aber das Register ließ sich nicht eintragen."
              echo "  Auf dem Server steht jetzt ein Feed, den main nicht kennt."
              echo "  Nachsehen: Zeigt data/podcast-eigener-feed.json auf dasselbe Video wie"
              echo "  https://iminvests.de/podcast-audio/feed.xml? Wenn nicht, ist eines zu viel –"
              echo "  podcast-zuruecknehmen.yml nimmt es samt Feed zurück."
              exit 1
            fi
          fi

      # Ein Push mit dem GITHUB_TOKEN löst keinen weiteren Workflow aus –
      # GitHub verhindert damit Endlosschleifen, und zwar lautlos. Ohne
      # diesen Anstoß stünde die Folge im Repository und nicht auf der
      # Website, bis irgendwann jemand anders baut. Genau so ist es diesem
      # Projekt mit den Kursen zwei Monate lang ergangen.
      - name: Neubau anstoßen
        if: needs.text.outputs.veroeffentlichen == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f podcast-folge/folge.mp3 ]; then
            echo "Keine Folge veröffentlicht – kein Neubau nötig."
            exit 0
          fi
          gh workflow run paket-bauen.yml \
            --repo "${{ github.repository }}" --ref main \
            && echo "Der Paketbau ist angestoßen."

      # Die Einzelstücke nicht mit anhängen – sie sind Arbeitsmaterial und
      # zusammen größer als die Folge selbst.
      - name: Folge als Artefakt anhängen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcastfolge-${{ github.run_id }}
          path: |
            podcast-folge/
            !podcast-folge/stueck-*.wav
          retention-days: 7
