name: Paket bauen

# Baut die Website und legt sie als fertiges Paket zum Herunterladen ab.
#
# Warum nicht direkt hochladen: Der Hoster hat den FTP-Zugang gesperrt. Nach drei
# vollständigen Uploads mit zusammen rund 4.500 Zugriffen kommt die Verbindung
# zum Port 21 nicht mehr zustande – belegt durch sieben Abfragen mit demselben
# Ergebnis ("Failed to connect ... Timeout was reached"). FTP ist für 1.230
# Einzeldateien das falsche Werkzeug.
#
# Der Upload einer einzelnen Datei über den Dateimanager im Browser funktioniert
# dagegen. Deshalb entsteht hier ein Paket, das genau dafür gedacht ist: einmal
# herunterladen, einmal hochladen, entpacken.
#
# Sobald ein Weg ohne 1.230 Einzelverbindungen zur Verfügung steht – Git-Anbindung
# oder SSH beim Hoster –, kann die Übertragung wieder automatisch laufen.

on:
  # Nach jedem Push auf main, damit immer ein aktuelles Paket bereitliegt.
  push:
    branches: [main]

  # Und auf jedem Pull Request.
  #
  # Bis hierher lief die Prüfung ausschließlich auf `main` – also erst,
  # nachdem ein Fehler bereits eingezogen war. Auf einem Arbeitszweig sind
  # dutzende Commits entstanden, die nie durch diese Kette gelaufen sind;
  # geprüft wurde lokal, und das ist nicht dasselbe. Ein Pull Request kostet
  # nichts extra und verschiebt den Befund vor den Merge.
  pull_request:

  # Täglich um 04:15 UTC, kurz nach der Routine für den Tagesüberblick.
  # Cron rechnet in UTC: 04:15 UTC sind in der Sommerzeit 06:15 Uhr deutscher
  # Zeit, in der Winterzeit 05:15 Uhr.
  schedule:
    - cron: '15 4 * * *'

  workflow_dispatch:

# Ein Lauf je Zweig – ältere werden abgebrochen.
#
# Auf einem Arbeitszweig entstehen Commits im Minutentakt, und jeder startete
# bisher einen vollen Bau, den niemand mehr abbrach: 18 Läufe am Tag, von denen
# die meisten schon veraltet waren, bevor sie fertig wurden. Geprüft werden
# soll der Stand, der am Ende dasteht.
#
# `main` ist ausgenommen: Dort ist jeder Commit ein Stand, der ausgeliefert
# wird, und ein abgebrochener Bau hieße, dass `veroeffentlichen.yml` nicht
# anspringt. Deshalb bekommt jeder Lauf auf main seine eigene Gruppe.
concurrency:
  group: >-
    paket-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'zweig' }}
  cancel-in-progress: true

jobs:
  bauen:
    name: Bauen und prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` statt `npm install`: installiert exakt die Versionen aus der
      # package-lock.json. Ein Build, der sich je nach Tagesform andere Pakete
      # zieht, ist kein reproduzierbarer Build.
      - run: npm ci

      # Die Prüfungen laufen vor dem Build. Fällt eine durch, entsteht kein
      # Paket – dann kann auch niemand versehentlich einen kaputten Stand
      # hochladen.
      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Formatierung
        run: npm run format:check

      - name: Bauen
        run: npm run build
        env:
          # Ohne diese Variable trägt jede Seite die Platzhalter-Domain als
          # canonical-URL. Als Repository-Variable hinterlegt unter
          # Settings > Secrets and variables > Actions > Variables.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      # Prüft das Ergebnis, nicht die Absicht.
      #
      # Der Schritt ist aus Erfahrung entstanden: Ein früherer Lauf hat eine
      # Website ohne Stylesheet ausgeliefert, und niemand hat es vor dem
      # Hochladen bemerkt. Was hier früher als Folge von `test -f`-Aufrufen
      # stand, liegt jetzt in `scripts/paket-pruefen.ts` – dieselben
      # Dateiprüfungen, dazu tote Links, Meta-Längen, Überschriftenstruktur,
      # Alternativtexte und die Deckung mit der Sitemap über alle Seiten.
      #
      # Der Umzug ins Skript hat einen zweiten Grund: So lässt sich dieselbe
      # Prüfung mit `npm run pruefen` auch lokal ausführen, bevor überhaupt
      # ein Commit entsteht.
      - name: Paket prüfen
        run: npm run pruefen

      # Das Paket entsteht nur noch auf Anforderung.
      #
      # Es wiegt 138 MB, und der Tarif enthält 500 MB Actions-Speicher im
      # Monat. Bei einem Paket nach jedem Push, jedem Pull Request und jeder
      # Nacht war der Speicher nach drei Bauläufen zu neunzig Prozent voll –
      # gemeldet am 31. Juli 2026, einen Tag vor dem Zurücksetzen.
      #
      # Gebraucht hat es in dieser Zeit niemand: `veroeffentlichen.yml` lädt
      # das Artefakt nicht herunter, sondern baut selbst neu. Das Paket ist der
      # Weg von Hand für den Fall, dass die Übertragung über SSH nicht geht –
      # und für einen Notweg ist „auf Knopfdruck" die richtige Bedingung.
      #
      # Wer es braucht: Actions → „Paket bauen" → „Run workflow". Der Lauf
      # dauert dieselben paar Minuten wie der automatische.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: website
          path: out
          # Versteckte Dateien werden seit v4.4 standardmäßig ausgeschlossen.
          # Ohne diese Zeile fehlten sie im Paket, obwohl die Prüfung oben
          # durchlief – die misst den Ordner, nicht das Artefakt.
          include-hidden-files: true
          # Sieben Tage statt dreißig: Wer das Paket anfordert, lädt es am
          # selben Tag herunter. Ein Monat Aufbewahrung kostet Speicher für
          # einen Stand, der längst überholt ist.
          retention-days: 7
