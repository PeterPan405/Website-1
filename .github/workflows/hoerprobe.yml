name: Hörprobe der Stimme

# Spricht einen beliebigen Text mit der Stimme aus `assets/stimme-referenz.wav`
# und legt die Aufnahme so ab, dass man sie tatsächlich zu hören bekommt.
#
# ## Warum das ein eigener Lauf ist
#
# „Stimme messen" erzeugt schon eine Probe – aber nur als Artefakt am Lauf,
# und ein Artefakt ist ein ZIP hinter einer Anmeldung. Wer die neue Stimme
# beurteilen soll, will sie abspielen, nicht herunterladen, entpacken und
# suchen. Am 9. August 2026 lag genau deshalb eine fertige Hörprobe
# unbeachtet an einem roten Lauf.
#
# Rot war der Lauf übrigens wegen eines veralteten Urteils: gemessen wurde
# **ein** Läufer, gesprochen wird seit dem 8. August von **vier**. Die Zahl
# stimmte, der Satz daneben nicht.
#
# ## Wohin die Aufnahme kommt – zweimal
#
# 1. **Als Artefakt** am Lauf, sieben Tage lang. Für den Browser.
# 2. **Auf den wurzellosen Zweig `hoerprobe`.** Dieselbe Bauart wie
#    `quellen-heute`: nie gebaut, nie veröffentlicht, jeder Lauf ersetzt ihn
#    vollständig (`push --force`), keine Historie, keine Ansammlung. Eine
#    Sitzung ohne Netzzugang kommt so an die Datei:
#
#        git fetch origin hoerprobe
#        git show origin/hoerprobe:probe.mp3 > probe.mp3
#
#    Das ist der Grund für den Zweig. Der Egress-Proxy dieser Umgebung lässt
#    weder `api.github.com` noch den Artefakt-Speicher durch – `git` ist der
#    einzige Kanal, der trägt.
#
# Eine Million Bytes, einmal je Lauf überschrieben. Das ist Arbeitsmaterial
# außerhalb von `main`, kein Datenbestand.
#
# ## Er läuft nur von Hand
#
# Ein Zeitplan hätte nichts zu melden: Eine Hörprobe braucht man, wenn sich
# die Referenzaufnahme geändert hat – und das tut sie, wenn jemand sie ändert.

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Was gesprochen werden soll (leer = Standardprobe)'
        required: false
        default: ''
      modellgroesse:
        description: 'Modellgröße'
        type: choice
        options: ['0.6B', '1.7B']
        default: '0.6B'

jobs:
  sprechen:
    name: Wie klingt sie?
    runs-on: ubuntu-latest
    # Die Messung vom 9. August: 133 s Rechnen für 32 s Audio, dazu 9 s
    # Modellladen und rund 3 Minuten für die Bibliotheken. Eine Frist, die
    # greift, statt den Läufer bei einem Aufhänger eine Stunde zu blockieren.
    #
    # **30 statt 20 Minuten seit dem 28. September 2026.** An diesem Tag hat
    # die Frist des Jobs eine Probe abgeräumt: Das sechste von acht Stücken
    # hing dreizehneinhalb Minuten, und weil `stimme-messen.py` damals keine
    # Frist je Stück kannte, war auch das gute Audio davor verloren.
    #
    # Die eigentliche Abhilfe steht dort – das Skript spricht jetzt über
    # `sprechstimme.Sprecher`, mit Frist, Teilung und Wiederholung. Nur
    # kostet dieses Sich-Berappeln Zeit: bis zu acht Anläufe zu je sechzig
    # Sekunden für ein kurzes Stück. Zwanzig Minuten wären danach die
    # Grenze, die den guten Tag gerade eben trägt.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zwischenspeicher für das Sprachmodell
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen-tts-${{ inputs.modellgroesse }}

      # torch und torchaudio müssen aus **derselben** Quelle kommen. qwen-tts
      # zieht sich sonst die Grafikkarten-Fassung von torchaudio nach, und
      # deren C++-Teil lässt sich neben dem CPU-torch nicht laden:
      #
      #     OSError: Could not load this library: …/_torchaudio.abi3.so
      - name: Sprachmodell einrichten
        run: |
          python -m pip install --upgrade pip
          pip install "transformers<=4.57.6" soundfile librosa numpy qwen-tts
          pip install --force-reinstall \
            --index-url https://download.pytorch.org/whl/cpu torch torchaudio

      # ffmpeg, und zwar **vor** dem Sprechen.
      #
      # ## Warum dieser Schritt am 28. September 2026 dazukam
      #
      # Weil die Klangkette unten seit ihrem ersten Tag nie gelaufen ist:
      #
      #     FileNotFoundError: [Errno 2] No such file or directory: 'ffmpeg'
      #
      # Dieselbe Falle wie am 8. August 2026 im Podcastlauf – ffmpeg liegt
      # seither nicht mehr auf dem Ubuntu-Abbild. Dort wurde sie behoben, hier
      # nicht: Die Klangkette kam am 9. August dazu, mit einem Kommentar
      # darüber, warum sie unverzichtbar ist, und mit `if: always()`. Das
      # `always()` hat den Fehlschlag jedes Mal überlebt, der Lauf blieb grün
      # bis auf diesen einen roten Schritt, und die WAV lag daneben.
      #
      # **Ein Schritt, der nie gelaufen ist, sieht aus wie ein Schritt.** Wer
      # die Hörprobe abspielen wollte, bekam die Rohaufnahme des Modells statt
      # dessen, was auf Spotify landet – also die falsche Antwort auf die
      # Frage, für die es den Lauf gibt.
      #
      # Vor dem Sprechen, nicht danach: Sechs Minuten rechnen und dann an
      # einer fehlenden Paketinstallation scheitern wäre die teure Reihenfolge.
      #
      # `apt-get update` darf scheitern – auf dem Läufer stehen fremde
      # Paketquellen, und eine davon antwortet gelegentlich mit 403. Ob es
      # geklappt hat, entscheidet `ffmpeg -version`, nicht diese Zeile.
      - name: ffmpeg einrichten
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg liegt schon bereit."
            ffmpeg -version | head -1
            exit 0
          fi

          sudo apt-get update -qq \
            || echo "::warning::apt-get update meldet Fehler (fremde Paketquelle) – die Installation wird trotzdem versucht."
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Sprechen
        env:
          PROBETEXT: ${{ inputs.text }}
        run: python scripts/stimme-messen.py assets/stimme-referenz.wav ${{ inputs.modellgroesse }}

      # **Ohne diesen Schritt hört man das Modell, nicht die Folge.**
      #
      # `stimme-messen.py` gibt die Rohaufnahme aus. Was auf YouTube und
      # Spotify landet, ist die Aufnahme **nach** `klangkette.py`: Grummeln
      # weg, Rauschen gedämpft, der Kasten-Ton bei 350 Hz herausgeschnitten,
      # Präsenz ab 3,5 kHz angehoben, auf −16 LUFS normiert.
      #
      # Eine Hörprobe ohne diese Kette beantwortet die falsche Frage. Beide
      # Fassungen bleiben liegen – der Unterschied zwischen ihnen ist
      # aufschlussreich, wenn wieder jemand „klingt wie aus der Dose" sagt.
      - name: Klangkette anwenden
        if: always()
        run: |
          [ -f probe.wav ] || exit 0
          python - <<'ENDE'
          import sys
          sys.path.insert(0, "scripts")
          from klangkette import zu_mp3
          zu_mp3("probe.wav", "probe.mp3", melde=lambda t: print(f"[klang] {t}", flush=True))
          ENDE

      # `always()`: Auch ein „zu langsam"-Urteil lässt eine hörbare Aufnahme
      # zurück, und genau die ist hier der Zweck. Das Urteil ist Beiwerk.
      - name: Zum Herunterladen anhängen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoerprobe-${{ github.run_id }}
          path: |
            probe.mp3
            probe.wav
            probe.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Auf den Zweig legen
        if: always()
        run: |
          set -e
          [ -f probe.wav ] || { echo "Keine Aufnahme entstanden."; exit 0; }

          # Der Zweig muss **außerhalb** des Arbeitsbaums entstehen: `git
          # checkout --orphan` im selben Verzeichnis würde probe.wav mit dem
          # `rm -rf` gleich wieder wegräumen.
          mkdir -p /tmp/hoerprobe
          for datei in probe.mp3 probe.wav probe.txt; do
            [ -f "$datei" ] && cp "$datei" /tmp/hoerprobe/
          done
          # `set -e` bricht bei einem fehlschlagenden `[ … ] && …` in einer
          # `for`-Schleife nicht ab – nachgeprüft, nicht angenommen. Die
          # Schleife läuft also auch dann durch, wenn die MP3 fehlt.
          true

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git checkout --orphan hoerprobe
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp /tmp/hoerprobe/* .

          git add -A
          git commit -m "Hörprobe $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin hoerprobe

          echo "Liegt bereit:"
          echo "  git fetch origin hoerprobe"
          echo "  git show origin/hoerprobe:probe.mp3 > probe.mp3"
