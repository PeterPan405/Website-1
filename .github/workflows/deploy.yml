name: Bauen und veröffentlichen

# Warum es diesen Workflow überhaupt braucht:
# Auf dem Webspace liegen fertig gebaute Dateien. Eine Änderung im Repository
# ändert die Website deshalb nicht von selbst – erst ein neuer Build und ein
# neuer Upload machen sie sichtbar. Genau das erledigt dieser Ablauf.

on:
  # Nach jedem Push auf main.
  push:
    branches: [main]

  # Täglich um 04:15 UTC. Der Tagesüberblick wird um 04:00 UTC geschrieben;
  # der Abstand gibt dieser Routine Zeit, ihren Commit fertigzustellen.
  # Hinweis: Cron rechnet in UTC. 04:15 UTC sind in der Sommerzeit 06:15 Uhr
  # deutscher Zeit, in der Winterzeit 05:15 Uhr.
  schedule:
    - cron: '15 4 * * *'

  # Von Hand auslösbar – nützlich für den ersten Versuch und zum Nachschieben.
  workflow_dispatch:

# Läuft immer nur ein Deployment gleichzeitig. Ohne das könnten sich ein
# geplanter Lauf und ein Push gegenseitig mitten im Upload überholen und einen
# halb aktualisierten Stand auf dem Server hinterlassen.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Bauen und prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` statt `npm install`: installiert exakt die Versionen aus der
      # package-lock.json. Ein Build, der sich je nach Tagesform andere Pakete
      # zieht, ist kein reproduzierbarer Build.
      - run: npm ci

      # Die Prüfungen laufen vor dem Build. Fällt eine durch, wird nichts
      # hochgeladen – eine kaputte Seite gar nicht erst zu veröffentlichen ist
      # besser, als sie hinterher zurückzurollen.
      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Formatierung
        run: npm run format:check

      - name: Bauen
        run: npm run build
        env:
          # Ohne diese Variable trägt die Website die Platzhalter-Domain als
          # canonical-URL ein. Als Repository-Variable hinterlegen unter
          # Settings > Secrets and variables > Actions > Variables.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      # Prüft das Ergebnis, nicht den Quellcode: Liegen die erwarteten Dateien
      # wirklich im Export? Ein leeres oder halbes out/ hochzuladen würde die
      # Website löschen, statt sie zu aktualisieren.
      - name: Export prüfen
        run: |
          test -f out/index.html || { echo "out/index.html fehlt"; exit 1; }
          test -f out/404.html || { echo "out/404.html fehlt"; exit 1; }
          test -f out/sitemap.xml || { echo "out/sitemap.xml fehlt"; exit 1; }
          test -f out/robots.txt || { echo "out/robots.txt fehlt"; exit 1; }
          test -f out/.htaccess || { echo "out/.htaccess fehlt"; exit 1; }
          seiten=$(find out -name index.html | wc -l)
          echo "Seiten im Export: $seiten"
          if [ "$seiten" -lt 100 ]; then
            echo "Zu wenige Seiten – der Export ist unvollständig."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: out
          retention-days: 7

  deploy:
    name: Zu Hostinger übertragen
    needs: build
    runs-on: ubuntu-latest
    # Ohne hinterlegte Zugangsdaten wird nicht übertragen, statt mit einem
    # Fehler abzubrechen: Der Build oben ist dann trotzdem geprüft, und das
    # Ergebnis liegt als Artefakt zum Herunterladen bereit.
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: out

      - name: Zugangsdaten prüfen
        id: check
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
            echo "Keine FTP-Zugangsdaten hinterlegt – Upload wird übersprungen."
            echo "Die gebaute Website liegt als Artefakt 'website' zum Herunterladen bereit."
          else
            echo "vorhanden=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Per FTP übertragen
        if: steps.check.outputs.vorhanden == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Bei Hostinger ist das Web-Verzeichnis üblicherweise public_html.
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          local-dir: ./out/
          # Überträgt nur geänderte Dateien. Der erste Lauf lädt alles hoch,
          # jeder weitere nur noch die Unterschiede.
          state-name: .ftp-deploy-sync-state.json
