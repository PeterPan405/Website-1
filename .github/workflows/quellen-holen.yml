name: Quellen holen

# Holt Webseiten und schreibt ihren Text ins Protokoll.
#
# ## Warum es diesen Workflow gibt
#
# Die Entwicklungsumgebung dieses Projekts erreicht nur GitHub. Jede
# Nachrichtenquelle – destatis, Eurostat, Bundesbank, jedes Finanzportal – ist
# durch die Egress-Regel gesperrt (CONNECT 403). Für Kurse, Zinsen und ESEF ist
# das seit Langem gelöst: Ein Läufer holt die Daten, ein Skript wertet sie aus.
#
# Für die Nachrichtenredaktion fehlte dieses Gegenstück. Und ohne es bleibt nur
# die Suchmaschine, die Zusammenfassungen liefert statt Seiten – am 31. Juli
# 2026 lieferte sie zum Goldpreis zwei Zahlen, die einander widersprachen. Auf
# so etwas lässt sich kein Artikel bauen; die Anleitung in
# `.claude/skills/newsupdate/SKILL.md` verlangt ausdrücklich eine Quelle, die
# gelesen wurde.
#
# Dieser Workflow schließt die Lücke: Der Läufer holt die angegebenen Adressen,
# entfernt das Markup und schreibt den Text ins Protokoll. Was dort steht, ist
# gelesen – wörtlich, mit Datum und Adresse daneben.
#
# ## Was hier nicht passiert
#
# Nichts wird ins Repository geschrieben. Der Text ist Arbeitsmaterial für einen
# Rechercheschritt, kein Datenbestand – er landet im Protokoll und verfällt mit
# ihm. Fremde Texte gehören nicht in dieses Repository, und die Anleitung sagt
# aus demselben Grund: zusammenfassen, nie spiegeln.
#
# Je Seite werden höchstens `zeichen` Zeichen ausgegeben. Das reicht für
# Kennzahlen, Überschriften und die ersten Absätze – also für das, was geprüft
# werden muss – und bleibt weit von einer Vervielfältigung entfernt.
#
# ## Warum das Ergebnis zusätzlich auf einem Zweig liegt
#
# Weil das Protokoll von der Entwicklungsumgebung dieses Projekts aus teuer zu
# lesen ist: Es kommt nur über die GitHub-Schnittstelle, in einem Rutsch, mit
# allem Beiwerk des Laufs. Am 20. August 2026 hat die Suche nach den
# Meldeterminen der Tokioter Börse mehr Aufwand in das *Lesen* der Protokolle
# gesteckt als in das Abrufen selbst.
#
# `AGENTS.md` schreibt die Lösung längst vor: **Wer einen Lauf baut, dessen
# Ergebnis eine Datei ist, legt sie auf einen wurzellosen Zweig.** Genau das
# passiert jetzt auch hier – lesbar mit
#
#     git show origin/quellen-holen-heute:quellen.txt
#
# Der Zweig ist wurzellos, hat immer genau einen Commit und kommt in `main`
# nie vor. Nichts sammelt sich an.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Adressen, durch Leerzeichen oder Zeilenumbruch getrennt'
        required: true
        type: string
      zeichen:
        description: 'Höchstzahl ausgegebener Zeichen je Seite'
        required: false
        default: '12000'
        type: string
      suche:
        description: 'Nur Zeilen mit diesem Muster zeigen (regulärer Ausdruck)'
        required: false
        default: ''
        type: string
      verweise:
        description: 'Statt Text die Verweise zeigen, die auf dieses Muster passen'
        required: false
        default: ''
        type: string

# Zwei gleichzeitige Läufe stören einander nicht, aber sie machen das Protokoll
# unübersichtlich. Der laufende wird nicht abgebrochen.
concurrency:
  group: quellen-holen
  cancel-in-progress: false

jobs:
  holen:
    name: Seiten abrufen
    runs-on: ubuntu-latest
    permissions:
      # Zum Schreiben des Zweiges `quellen-holen-heute`.
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Amtliche Quellen sind oft PDFs, und die HTML-Seite daneben nennt die
      # Zahl nicht. Beim Basiszins für die Vorabpauschale ist es genau so:
      # Die BMF-Seite trägt Datum und Titel des Schreibens und verlinkt dann
      # „Dokument herunterladen [pdf, 107KB]" – der Wert selbst steht nur
      # dort. Ohne diesen Schritt endet die Prüfung mit „nicht belegbar",
      # obwohl die Quelle offen im Netz liegt.
      #
      # `poppler-utils` bringt `pdftotext` mit, rund zwei Sekunden Installation.
      - name: PDF-Leser bereitstellen
        run: sudo apt-get install -qq -y poppler-utils

      - name: Abrufen und lesbar machen
        env:
          URLS: ${{ inputs.urls }}
          ZEICHEN: ${{ inputs.zeichen }}
          SUCHE: ${{ inputs.suche }}
          VERWEISE: ${{ inputs.verweise }}
        run: |
          python3 - <<'ENDE' | tee quellen.txt
          import html
          import os
          import re
          import subprocess
          import tempfile
          import zipfile
          import urllib.error
          import urllib.parse
          import urllib.request

          grenze = int(os.environ.get("ZEICHEN") or "12000")
          adressen = [a for a in os.environ["URLS"].split() if a.startswith("http")]

          # Ohne `suche` bleibt alles wie bisher: die ersten `zeichen` Zeichen.
          gesucht = (os.environ.get("SUCHE") or "").strip()
          muster = re.compile(gesucht, re.IGNORECASE) if gesucht else None

          # Und ohne `verweise` wird kein einziger Link ausgegeben.
          #
          # ## Warum es diesen Schalter gibt
          #
          # Das Lesbarmachen entfernt jedes Markup – und damit jedes `href`.
          # Für eine Kennzahl auf einer Fondsseite ist das richtig; für die
          # Frage „wo liegt die Datei, auf die diese Seite verweist?" ist es
          # das Gegenteil von hilfreich.
          #
          # Aufgefallen am 20. August 2026 bei der Suche nach Meldeterminen:
          # Die Tokioter Börse führt sichtbar eine Rubrik „Scheduled Dates",
          # und im lesbar gemachten Text stand die Überschrift – aber nicht,
          # wohin sie führt. Ohne diesen Schalter bleibt nur Raten.
          verwiesen = (os.environ.get("VERWEISE") or "").strip()
          verweismuster = re.compile(verwiesen, re.IGNORECASE) if verwiesen else None

          if not adressen:
              raise SystemExit("Keine brauchbare Adresse übergeben.")

          # Ein Browser-Kennzeichen. Viele Redaktionsseiten weisen den
          # Standard-Agenten von urllib ab, und ein 403 wäre hier eine Aussage
          # über das Werkzeug statt über die Quelle.
          KOPF = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/126.0 Safari/537.36"
              ),
              "Accept-Language": "de-DE,de;q=0.9,en;q=0.8",
          }

          def pdf_zu_text(roh: bytes) -> str:
              """Holt den Text aus einem PDF – über `pdftotext`, sonst nichts.

              `-layout` erhält Spalten und Tabellen halbwegs; ein Basiszins
              steht bei der Bundesbank in einer Tabelle, und ohne diesen
              Schalter stünden Zahl und Bezeichnung in verschiedenen Zeilen.
              """
              with tempfile.NamedTemporaryFile(suffix=".pdf") as datei:
                  datei.write(roh)
                  datei.flush()
                  fertig = subprocess.run(
                      ["pdftotext", "-layout", "-enc", "UTF-8", datei.name, "-"],
                      capture_output=True,
                      text=True,
                  )
              if fertig.returncode != 0:
                  return f"[PDF nicht lesbar: {fertig.stderr.strip()[:200]}]"
              return re.sub(r"\n\s*\n\s*", "\n\n", fertig.stdout).strip()

          def tabelle_zu_text(roh: bytes) -> str:
              """Holt die erste Tabelle aus einer XLSX-Datei.

              Eine XLSX ist ein ZIP aus XML-Dateien, und Python bringt beides
              mit – `zipfile` und `re` genügen, eine Fremdbibliothek braucht es
              nicht.

              ## Warum das hier hineingehört

              Amtliche Termin- und Kennzahlenlisten kommen als Tabelle, nicht
              als JSON. Die Tokioter Börse etwa veröffentlicht die geplanten
              Meldetermine aller gelisteten Unternehmen als `kessan06_0807.xlsx`
              und aktualisiert sie börsentäglich. Ohne diesen Zweig sieht man
              von so einer Datei nur, dass sie 200 sagt.

              ## Die Falle: Zellen zeigen nicht ihren Inhalt

              Text steht in XLSX nicht in der Zelle, sondern in einer
              gemeinsamen Zeichenkettentabelle; die Zelle trägt nur deren
              Nummer und das Merkmal `t="s"`. Wer das übersieht, bekommt eine
              Tabelle voller Zahlen, die wie Daten aussehen und Indizes sind.
              """
              try:
                  with tempfile.NamedTemporaryFile(suffix=".xlsx") as datei:
                      datei.write(roh)
                      datei.flush()
                      with zipfile.ZipFile(datei.name) as archiv:
                          namen = archiv.namelist()
                          blatt = next(
                              (n for n in sorted(namen) if n.startswith("xl/worksheets/sheet")),
                              None,
                          )
                          if not blatt:
                              return "[XLSX ohne Arbeitsblatt]"

                          texte = []
                          if "xl/sharedStrings.xml" in namen:
                              roh_texte = archiv.read("xl/sharedStrings.xml").decode(
                                  "utf-8", errors="replace"
                              )
                              for si in re.findall(r"(?s)<si>(.*?)</si>", roh_texte):
                                  stueck = re.findall(r"(?s)<t[^>]*>(.*?)</t>", si)
                                  texte.append(html.unescape("".join(stueck)))

                          inhalt = archiv.read(blatt).decode("utf-8", errors="replace")
              except Exception as fehler:  # noqa: BLE001
                  return f"[XLSX nicht lesbar: {type(fehler).__name__}: {fehler}]"

              zeilen = []
              for roh_zeile in re.findall(r"(?s)<row[^>]*>(.*?)</row>", inhalt):
                  felder = []
                  for zelle in re.findall(r"(?s)<c\b([^>]*)>(.*?)</c>", roh_zeile):
                      merkmale, koerper = zelle
                      wert = re.search(r"(?s)<v>(.*?)</v>", koerper)
                      if 't="s"' in merkmale and wert:
                          nummer = int(wert.group(1))
                          felder.append(texte[nummer] if nummer < len(texte) else "")
                      elif 't="inlineStr"' in merkmale:
                          stueck = re.findall(r"(?s)<t[^>]*>(.*?)</t>", koerper)
                          felder.append(html.unescape("".join(stueck)))
                      else:
                          felder.append(html.unescape(wert.group(1)) if wert else "")
                  if any(f.strip() for f in felder):
                      zeilen.append(" | ".join(felder))

              return "\n".join(zeilen) if zeilen else "[XLSX ohne Zeilen]"

          def zu_text(roh: str) -> str:
              """Markup heraus, Text behalten – ohne Fremdbibliothek."""
              # Skripte und Stile samt Inhalt weg, sonst steht CSS im Protokoll.
              ohne = re.sub(
                  r"(?is)<(script|style|noscript|svg)\b.*?</\1>", " ", roh
              )
              # Blockenden zu Zeilenumbrüchen, damit Absätze erhalten bleiben.
              ohne = re.sub(
                  r"(?i)</(p|div|li|tr|h[1-6]|section|article|br)\s*/?>", "\n", ohne
              )
              ohne = re.sub(r"(?s)<[^>]+>", " ", ohne)
              ohne = html.unescape(ohne)
              # Leerraum zusammenfassen, Leerzeilenketten auf eine kürzen.
              ohne = re.sub(r"[ \t\r\f\v]+", " ", ohne)
              ohne = re.sub(r"\n\s*\n\s*", "\n\n", ohne)
              return ohne.strip()

          for adresse in adressen:
              print("\n" + "=" * 78)
              print(f"QUELLE: {adresse}")
              print("=" * 78)
              try:
                  anfrage = urllib.request.Request(adresse, headers=KOPF)
                  with urllib.request.urlopen(anfrage, timeout=45) as antwort:
                      roh = antwort.read()
                      typ = antwort.headers.get("Content-Type", "?")
                      zeichensatz = antwort.headers.get_content_charset() or "utf-8"
                      print(f"STATUS: {antwort.status}")
                      print(f"TYP:    {typ}")
                      print(f"DATUM:  {antwort.headers.get('Date', '?')}")
                      print(f"STAND:  {antwort.headers.get('Last-Modified', '—')}")
                      print("-" * 78)
                      # Am Inhaltstyp **und** an der Signatur erkannt: Manche
                      # Downloads werden als `application/octet-stream`
                      # ausgeliefert, und `?__blob=publicationFile` am Ende
                      # macht die Endung unbrauchbar.
                      ist_pdf = "pdf" in typ.lower() or roh[:5] == b"%PDF-"
                      # Eine XLSX ist ein ZIP: erkennbar an „PK" und der Endung
                      # oder am Inhaltstyp. Am Inhaltstyp **und** an der
                      # Signatur, aus demselben Grund wie beim PDF: Manche
                      # Server liefern Tabellen als `application/octet-stream`.
                      ist_tabelle = roh[:2] == b"PK" and (
                          adresse.lower().endswith((".xlsx", ".xlsm"))
                          or "spreadsheet" in typ.lower()
                      )
                      if ist_pdf:
                          text = pdf_zu_text(roh)
                      elif ist_tabelle:
                          text = tabelle_zu_text(roh)
                      else:
                          text = roh.decode(zeichensatz, errors="replace")
              except urllib.error.HTTPError as fehler:
                  print(f"STATUS: {fehler.code} – nicht abrufbar")
                  continue
              except Exception as fehler:  # noqa: BLE001
                  print(f"FEHLER: {type(fehler).__name__}: {fehler}")
                  continue

              # Die Verweise vor dem Lesbarmachen – danach gibt es keine mehr.
              #
              # Ausgegeben wird die **absolute** Adresse: Eine Seite verweist
              # meist relativ („/listing/…"), und eine relative Adresse in
              # einem Protokoll ist eine Adresse, die man nicht abrufen kann.
              # `urljoin` löst sie gegen die Seite auf, von der sie stammt.
              #
              # Geprüft wird gegen Ziel **und** Beschriftung. Die Datei, die
              # gesucht wird, heißt oft nichtssagend (`b7gje6000005mkkr.xls`),
              # und dann ist der Linktext das Einzige, woran sie zu erkennen
              # ist.
              if verweismuster is not None and not ist_pdf and not ist_tabelle:
                  gesehen = set()
                  treffer = []
                  for gefunden in re.finditer(
                      r'(?is)<a\b[^>]*?href\s*=\s*["\']([^"\']+)["\'][^>]*>(.*?)</a>',
                      text,
                  ):
                      ziel = urllib.parse.urljoin(adresse, gefunden.group(1).strip())
                      wort = re.sub(r"\s+", " ", zu_text(gefunden.group(2))).strip()
                      if not (verweismuster.search(ziel) or verweismuster.search(wort)):
                          continue
                      if ziel in gesehen:
                          continue
                      gesehen.add(ziel)
                      treffer.append((wort[:70], ziel))

                  if not treffer:
                      print(f"[kein Verweis passt auf {verweismuster.pattern!r}]")
                  else:
                      for wort, ziel in treffer[:60]:
                          print(f"  {wort or '(ohne Text)'}\n    → {ziel}")
                      print(f"\n[{len(treffer)} Verweise gefunden.]")
                  continue

              # JSON, CSV, reiner Text und bereits ausgelesene PDFs bleiben,
              # wie sie sind – nur HTML muss noch vom Markup befreit werden.
              if ist_pdf or ist_tabelle or adresse.endswith((".json", ".txt", ".csv")):
                  lesbar = text
              else:
                  lesbar = zu_text(text)

              # Mit `suche` nur die Fundstellen statt der halben Seite.
              #
              # Der Anlass: Für die laufenden Kosten eines ETF braucht man
              # eine Zeile aus einer Fondsseite von 8.000 Zeichen. Ohne
              # Filter muss man die ganze Seite ausgeben und selbst suchen –
              # bei acht Fonds achtmal. Mit Filter sind es acht Zeilen.
              #
              # Eine Zeile Zusammenhang davor und danach, weil in Tabellen
              # Bezeichnung und Wert gern auf zwei Zeilen stehen.
              if muster:
                  zeilen = lesbar.splitlines()
                  treffer = [i for i, z in enumerate(zeilen) if muster.search(z)]
                  if not treffer:
                      print(f"[keine Zeile passt auf {muster.pattern!r}]")
                      continue
                  gezeigt: set[int] = set()
                  for i in treffer:
                      gezeigt.update(range(max(0, i - 1), min(len(zeilen), i + 2)))
                  vorher = -2
                  for i in sorted(gezeigt):
                      if i > vorher + 1:
                          print("  …")
                      print(f"{i + 1:>5}: {zeilen[i].strip()[:300]}")
                      vorher = i
                  print(f"\n[{len(treffer)} Fundstellen in {len(zeilen)} Zeilen.]")
                  continue

              gekuerzt = lesbar[:grenze]
              print(gekuerzt)
              if len(lesbar) > grenze:
                  print(
                      f"\n[… gekürzt: {len(lesbar) - grenze} weitere Zeichen. "
                      f"Mit größerem Wert für 'zeichen' erneut abrufen.]"
                  )
          ENDE

      - name: Auf den Zweig `quellen-holen-heute` legen
        run: |
          # Dieselbe Bauart wie in `quellen-sammeln.yml`: wurzellos, ohne
          # Historie, immer genau ein Commit.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          inhalt=$(mktemp)
          cp quellen.txt "$inhalt"

          git checkout --orphan quellen-holen-heute
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp "$inhalt" quellen.txt

          git add quellen.txt
          git commit -m "Abruf $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin quellen-holen-heute

          echo "Liegt bereit: git show origin/quellen-holen-heute:quellen.txt"
