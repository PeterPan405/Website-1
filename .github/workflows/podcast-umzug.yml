name: Podcast umziehen

# Holt die bestehenden Folgen vom bisherigen Hoster auf den eigenen Server
# und schreibt den eigenen Feed. Der Schritt **vor** dem Umzug bei Spotify:
# Nach der Umleitung ist der neue Feed die Wahrheit, und was darin fehlt,
# verschwindet für jeden Hörer.
#
# Läuft nur von Hand, und zwar in aller Regel genau einmal.

on:
  workflow_dispatch:
    inputs:
      wirklich_laden:
        description: 'Dateien wirklich holen und hochladen (sonst nur Übersicht)'
        type: boolean
        default: false

jobs:
  umziehen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      - name: Folgen holen
        env:
          PODCAST_RSS_URL: ${{ vars.PODCAST_RSS_URL }}
        run: |
          if [ "${{ inputs.wirklich_laden }}" = "true" ]; then
            npm run uebernehmen -- --laden
          else
            npm run uebernehmen
          fi

      - name: Feed schreiben
        if: inputs.wirklich_laden
        run: npm run podcastfeed schreiben

      - name: Auf den Server
        if: inputs.wirklich_laden
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_PORT: '65002'
          ZIELPFAD: domains/iminvests.de/public_html
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # **Ein Anlauf reicht bei diesem Server nicht.** Am 9. August 2026
          # nachgemessen, dreimal derselbe Workflow gegen denselben Host:
          #
          #     11:46  ssh-keyscan scheitert nach 5 s
          #     11:49  ssh-keyscan gelingt
          #     11:53  ssh-keyscan scheitert nach 5 s
          #
          # Dazwischen, um 11:50, lief ein vollständiger Deploy durch – weil
          # `paket-bauen.yml` **fünfmal** anklopft und zwischen den Versuchen
          # wartet. Der Port flattert; wer einmal fragt, bekommt an guten
          # Tagen recht und an anderen nicht.
          #
          # Zwei Fehler steckten in der nackten Form. Der zweite ist der
          # teurere: Der Schritt läuft unter `bash -e`, ein fehlschlagendes
          # `ssh-keyscan` beendet ihn **sofort** – noch vor jeder sorgfältig
          # formulierten Fehlermeldung weiter unten. Der Lauf endete mit
          # „exit code 1" und keinem Wort dazu, warum. `2>/dev/null` tat den
          # Rest und verschluckte auch noch die Begründung.
          echo "— Hostschlüssel holen"
          geholt=nein
          for versuch in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p "$SSH_PORT" -H "$HOST" \
                 >> ~/.ssh/known_hosts 2>/tmp/keyscanfehler; then
              # `ssh-keyscan` liefert auch dann 0, wenn es nichts gefunden
              # hat. Gezählt wird deshalb, was tatsächlich ankam.
              if [ -s ~/.ssh/known_hosts ]; then
                geholt=ja
                echo "  Hostschlüssel hinterlegt (Versuch $versuch)."
                break
              fi
            fi
            echo "  Versuch $versuch ohne Ergebnis:"
            sed 's/^/    /' /tmp/keyscanfehler || true
            [ "$versuch" -lt 5 ] && sleep 10
          done

          if [ "$geholt" = nein ]; then
            echo "::error::Nach fünf Versuchen kein Hostschlüssel – Port $SSH_PORT antwortet nicht."
            echo "  Der Server flattert; ein späterer Lauf hat gute Aussichten."
            exit 1
          fi

          ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy "$USER@$HOST" \
            "mkdir -p ~/podcast-audio"

          for datei in podcast-archiv/*.mp3; do
            scp -P "$SSH_PORT" -i ~/.ssh/id_deploy \
              "$datei" "$USER@$HOST:~/podcast-audio/$(basename "$datei")"
            echo "  $(basename "$datei") übertragen."
          done

          scp -P "$SSH_PORT" -i ~/.ssh/id_deploy \
            assets/podcast-cover.jpg "$USER@$HOST:~/podcast-audio/cover.jpg"
          scp -P "$SSH_PORT" -i ~/.ssh/id_deploy \
            podcast-folge/feed.xml "$USER@$HOST:~/podcast-audio/feed.xml"

          # ~/podcast-audio ist der Bestand, der den Deploy überlebt; in den
          # Webpfad kommt eine **Kopie**. Ein Symlink wurde zwar gesetzt,
          # aber vom Server nicht verfolgt – 404 neben einer 200.
          ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy "$USER@$HOST" \
            "rm -rf '$ZIELPFAD/podcast-audio' \
             && mkdir -p '$ZIELPFAD/podcast-audio' \
             && cp -a ~/podcast-audio/. '$ZIELPFAD/podcast-audio/' \
             && ls -1 '$ZIELPFAD/podcast-audio' | wc -l"
          rm -f ~/.ssh/id_deploy

          echo ""
          echo "Der eigene Feed steht jetzt unter:"
          echo "  https://iminvests.de/podcast-audio/feed.xml"

      - name: Register committen
        if: inputs.wirklich_laden
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/podcast-eigener-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Podcast: bestehende Folgen in den eigenen Feed übernommen"
            for versuch in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "${{ github.ref_name }}" && break
              sleep $((versuch * 5))
            done
          fi
