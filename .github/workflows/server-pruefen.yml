name: Server ansehen

# Zeigt, wie es auf dem Webspace tatsächlich aussieht.
#
# ## Warum es das gibt
#
# Am 8. August 2026 lagen die Podcastdateien nachweislich unter
# `domains/iminvests.de/public_html/podcast-audio` – der Läufer hat sie
# gezählt, neun Stück. Über HTTP antwortete dieselbe Adresse mit **404**,
# während `version.txt` im selben Ordner mit 200 kam.
#
# Zwei Erklärungen waren plausibel und beide falsch zu raten. Statt einer
# dritten Vermutung fragt dieser Lauf den Server: Wo liegt der Ordner
# wirklich, ist er ein Link, wem gehört er, was steht darin.
#
# Er ändert nichts. Er liest nur.

on:
  workflow_dispatch:
    inputs:
      pfad:
        description: 'Unterordner, den man genauer sehen will'
        type: string
        default: 'podcast-audio'

jobs:
  ansehen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Nachsehen
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_PORT: '65002'
          ZIELPFAD: domains/iminvests.de/public_html
          UNTERORDNER: ${{ inputs.pfad }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # **Ein Anlauf reicht bei diesem Server nicht.** Am 9. August 2026
          # nachgemessen, dreimal derselbe Workflow gegen denselben Host:
          #
          #     11:46  ssh-keyscan scheitert nach 5 s
          #     11:49  ssh-keyscan gelingt
          #     11:53  ssh-keyscan scheitert nach 5 s
          #
          # Dazwischen, um 11:50, lief ein vollständiger Deploy durch – weil
          # `paket-bauen.yml` **fünfmal** anklopft und zwischen den Versuchen
          # wartet. Der Port flattert; wer einmal fragt, bekommt an guten
          # Tagen recht und an anderen nicht.
          #
          # Zwei Fehler steckten in der nackten Form. Der zweite ist der
          # teurere: Der Schritt läuft unter `bash -e`, ein fehlschlagendes
          # `ssh-keyscan` beendet ihn **sofort** – noch vor jeder sorgfältig
          # formulierten Fehlermeldung weiter unten. Der Lauf endete mit
          # „exit code 1" und keinem Wort dazu, warum. `2>/dev/null` tat den
          # Rest und verschluckte auch noch die Begründung.
          echo "— Hostschlüssel holen"
          geholt=nein
          for versuch in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p "$SSH_PORT" -H "$HOST" \
                 >> ~/.ssh/known_hosts 2>/tmp/keyscanfehler; then
              # `ssh-keyscan` liefert auch dann 0, wenn es nichts gefunden
              # hat. Gezählt wird deshalb, was tatsächlich ankam.
              if [ -s ~/.ssh/known_hosts ]; then
                geholt=ja
                echo "  Hostschlüssel hinterlegt (Versuch $versuch)."
                break
              fi
            fi
            echo "  Versuch $versuch ohne Ergebnis:"
            sed 's/^/    /' /tmp/keyscanfehler || true
            [ "$versuch" -lt 5 ] && sleep 10
          done

          if [ "$geholt" = nein ]; then
            echo "::error::Nach fünf Versuchen kein Hostschlüssel – Port $SSH_PORT antwortet nicht."
            echo "  Der Server flattert; ein späterer Lauf hat gute Aussichten."
            exit 1
          fi

          ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy "$USER@$HOST" bash -s <<ENDE
          set -u
          echo "=== Heimatverzeichnis ==="
          pwd
          ls -la ~ | head -30

          echo ""
          echo "=== Wo liegt public_html wirklich? ==="
          ls -ld "$ZIELPFAD" || echo "(gibt es nicht)"
          readlink -f "$ZIELPFAD" || true

          echo ""
          echo "=== Andere Kandidaten für den Webordner ==="
          find ~ -maxdepth 3 -name public_html 2>/dev/null | head -10

          echo ""
          echo "=== Was liegt oben drin? ==="
          ls -la "$ZIELPFAD" | head -25

          echo ""
          echo "=== $UNTERORDNER ==="
          ls -la "$ZIELPFAD/$UNTERORDNER" 2>/dev/null | head -20 || echo "(gibt es nicht)"

          echo ""
          echo "=== Rechte auf dem Weg dorthin ==="
          namei -l "$ZIELPFAD/$UNTERORDNER" 2>/dev/null || \
            stat -c '%A %U:%G %n' "$ZIELPFAD" "$ZIELPFAD/$UNTERORDNER" 2>/dev/null || true

          echo ""
          echo "=== Eigene .htaccess im Unterordner? ==="
          ls -la "$ZIELPFAD/$UNTERORDNER/.htaccess" 2>/dev/null || echo "(keine)"

          echo ""
          echo "=== Wie viel Platz ist noch da? ==="
          # Seit die Lernseiten vertont werden, ist das keine Neugier mehr:
          # 172 Aufnahmen belegen rund 280 MB, und ob die auf ein geteiltes
          # Paket passen, weiß nur der Server. `quota` kennt die Grenze des
          # Tarifs, `df` nur die der Platte darunter – gefragt wird deshalb
          # beides, und was fehlt, fehlt eben.
          quota -s 2>/dev/null || echo "(quota sagt nichts)"
          df -h ~ 2>/dev/null || echo "(df sagt nichts)"

          echo ""
          echo "=== Was belegt der Platz? ==="
          du -sh ~/* 2>/dev/null | sort -h | tail -12
          ENDE

      - name: Aufräumen
        if: always()
        run: rm -f ~/.ssh/id_deploy
