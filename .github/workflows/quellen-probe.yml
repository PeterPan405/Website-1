name: Quellen abklopfen

# Probiert Datenquellen durch und schreibt auf, welche antworten.
#
# Aus der Entwicklungsumgebung sind nur npm und GitHub erreichbar; jeder
# Versuch, eine Schnittstelle anzusprechen, endet dort mit 403 des Proxys. Auf
# einem GitHub-Läufer gibt es diese Einschränkung nicht. Ohne diesen Weg bliebe
# nur Raten.
#
# Der Workflow verändert nichts. Er ist Werkzeug, kein Bestandteil der Website.
#
# ## Bisheriger Stand
#
# - IWF (Schuldenquote): geht, seit ein User-Agent mitgeschickt wird → 191 Länder
# - OECD (Löhne): geht, seit Sprache und Format ausdrücklich gesetzt sind → 38 Länder
# - OECD (Vermögen): erreichbar, 31 Länder, enthält „Net wealth“ und „Median“ –
#   aber in Landeswährung, für den Vergleich fehlt eine Umrechnung
# - Yahoo (Fundamentaldaten): 401 Unauthorized bzw. Invalid Crumb
# - ILO, Our World in Data: keine brauchbare Reihe gefunden
#
# ## Diese Runde
#
# Die Fundamentalkennzahlen. Gesucht wird eine Quelle, die Umsatz, Gewinn,
# Cashflow und Aktienzahl liefert – ohne Anmeldung und ohne Lizenzverstoß.
# Der aussichtsreichste Kandidat ist die Schnittstelle der US-Börsenaufsicht:
# amtlich, gebührenfrei, ausdrücklich zur Nutzung vorgesehen. Ihr Nachteil
# steht schon fest – sie kennt nur Unternehmen, die in den USA bilanzieren.

on:
  workflow_dispatch:

jobs:
  abklopfen:
    name: Kandidaten prüfen
    runs-on: ubuntu-latest
    steps:
      - name: US-Börsenaufsicht (SEC) – Kennzahlen zu einem Unternehmen
        run: |
          # Die SEC verlangt ausdrücklich einen Absender mit Kontaktadresse.
          UA="IM-Invests Datenabruf pm252543@gmail.com"

          echo "── Zuordnung Kürzel → Kennnummer ──"
          curl -sS -A "$UA" --max-time 45 -o /tmp/tickers.json \
            "https://www.sec.gov/files/company_tickers.json"
          echo "Status/Größe: $(stat -c%s /tmp/tickers.json) Bytes"
          python3 - <<'PY'
          import json
          try:
              with open('/tmp/tickers.json') as f:
                  d = json.load(f)
          except Exception as fehler:
              print('  nicht lesbar:', fehler)
              raise SystemExit(0)
          eintraege = list(d.values())
          print(f"  {len(eintraege)} Unternehmen gelistet")
          for e in eintraege[:3]:
              print(f"   {e['ticker']:8} {e['cik_str']:>10}  {e['title'][:60]}")
          PY

          echo ""
          echo "── Kennzahlen zu Apple (CIK 320193) ──"
          curl -sS -A "$UA" --max-time 60 -o /tmp/apple.json \
            "https://data.sec.gov/api/xbrl/companyconcept/CIK0000320193/us-gaap/Revenues.json"
          echo "Größe: $(stat -c%s /tmp/apple.json) Bytes"
          head -c 300 /tmp/apple.json
          echo ""

          echo ""
          echo "── Sammelabruf: Umsatz aller Melder für ein Quartal ──"
          curl -sS -A "$UA" --max-time 90 -o /tmp/frame.json \
            "https://data.sec.gov/api/xbrl/frames/us-gaap/RevenueFromContractWithCustomerExcludingAssessedTax/USD/CY2025Q1.json"
          echo "Größe: $(stat -c%s /tmp/frame.json) Bytes"
          python3 - <<'PY'
          import json
          try:
              with open('/tmp/frame.json') as f:
                  d = json.load(f)
          except Exception as fehler:
              print('  nicht lesbar:', fehler)
              raise SystemExit(0)
          daten = d.get('data', [])
          print(f"  {len(daten)} Unternehmen in einem einzigen Abruf")
          for e in daten[:3]:
              print(f"   {e.get('cik'):>8}  {str(e.get('entityName'))[:40]:40} {e.get('val')}")
          PY

      - name: Gibt es eine Quelle ohne Anmeldung für Nicht-US-Unternehmen?
        run: |
          UA="IM-Invests-Abruf/1.0 (+https://iminvests.de)"
          for eintrag in \
            "Stooq Kursdatei|https://stooq.com/q/d/l/?s=sap.de&i=d" \
            "Frankfurter (nur Devisen)|https://api.frankfurter.app/latest?from=EUR" \
            "Yahoo Chart (was wir nutzen)|https://query1.finance.yahoo.com/v8/finance/chart/SAP.DE?range=5d&interval=1d"
          do
            name="${eintrag%%|*}"; url="${eintrag#*|}"
            code=$(curl -sS -A "$UA" --max-time 30 -o /tmp/a -w '%{http_code}' "$url" || echo 000)
            echo ""
            echo "▶ $name → $code, $(stat -c%s /tmp/a) Bytes"
            head -c 160 /tmp/a | tr '\n' ' '
            echo ""
          done
