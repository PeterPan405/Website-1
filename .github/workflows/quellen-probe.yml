name: Quellen abklopfen

# Probiert Datenquellen durch und schreibt auf, welche antworten.
#
# Aus der Entwicklungsumgebung sind nur npm und GitHub erreichbar; jeder
# Versuch, eine Schnittstelle anzusprechen, endet dort mit 403 des Proxys. Auf
# einem GitHub-Läufer gibt es diese Einschränkung nicht. Ohne diesen Weg bliebe
# nur Raten.
#
# Der Workflow ist Werkzeug, kein Bestandteil der Website.
#
# ## Bisheriger Stand
#
# - IWF (Schuldenquote): geht → 191 Länder, eingebaut
# - OECD (Löhne): geht → 38 Länder, eingebaut
# - OECD (Vermögen): geht → 30 Länder nach Umrechnung, eingebaut
# - SEC (Fundamentaldaten, us-gaap): geht → 170 geführte Kürzel, eingebaut
# - SEC (Quartalstermine, 8-K/2.02): geht, eingebaut
# - SEC (Quartalstermine, 6-K für ausländische Emittenten): **geprüft und
#   verworfen.** Die Dokumentbeschreibung lautet bei SAP, ASML, Novo Nordisk,
#   Shell, Sony und TSMC ausnahmslos „FORM 6-K“. Bei AstraZeneca gibt es
#   Beschreibungen, aber die Treffer auf „results“ sind Ergebnisse klinischer
#   Studien. Ein Filter darauf erzeugte Kalendereinträge, die mit
#   Quartalszahlen nichts zu tun haben.
# - Yahoo (Kennzahlen): 401 Unauthorized
# - Frankfurter (Devisen): 301 auf eine andere Adresse; EZB reicht ohnehin
#
# ## VORÜBERGEHEND: Neuabruf der Quartalstermine
#
# `quartalstermine.yml` liegt noch nicht auf dem Standardzweig und ist deshalb
# für workflow_dispatch nicht registriert. Damit der korrigierte Abruf laufen
# kann – ohne Rohstoffkürzel, mit nachgeladenen Altblöcken und mit
# Wiederholung –, hängt er einmalig hier mit drin. Wird nach dem Lauf wieder
# entfernt; sobald der Zweig auf main ist, übernimmt die eigene Routine.

on:
  workflow_dispatch:

concurrency:
  group: quartalstermine
  cancel-in-progress: false

jobs:
  abrufen:
    name: Quartalstermine neu ableiten
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Quartalstermine abrufen
        run: npm run quartalstermine

      - name: Ergebnis festhalten
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Erst vormerken, dann vergleichen: `git diff` allein sieht eine noch
          # nicht versionierte Datei nicht und meldet „keine Änderung“.
          git add data/snapshots/quartalstermine.json
          if git diff --cached --quiet -- data/snapshots/quartalstermine.json; then
            echo "Keine Änderung – kein Commit."
            exit 0
          fi

          git commit -m "Quartalstermine: Stand $(date -u +%Y-%m-%d)"
          git push origin HEAD:${{ github.ref_name }}
