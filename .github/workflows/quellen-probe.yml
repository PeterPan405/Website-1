name: Quellen abklopfen

# Probiert Datenquellen durch und schreibt auf, welche antworten.
#
# Aus der Entwicklungsumgebung sind nur npm und GitHub erreichbar; jeder
# Versuch, eine Schnittstelle anzusprechen, endet dort mit 403 des Proxys. Auf
# einem GitHub-Läufer gibt es diese Einschränkung nicht. Ohne diesen Weg bliebe
# nur Raten.
#
# Der Workflow ist Werkzeug, kein Bestandteil der Website. Er verändert nichts.
#
# ## Bisheriger Stand
#
# - IWF (Schuldenquote): geht → 191 Länder, eingebaut
# - OECD (Löhne): geht → 38 Länder, eingebaut
# - OECD (Vermögen): geht → 30 Länder nach Umrechnung, eingebaut
# - SEC (Fundamentaldaten, us-gaap): geht → 170 geführte Kürzel, eingebaut
# - SEC (Quartalstermine, 8-K/2.02): geht → 158 Unternehmen, eingebaut
# - Yahoo (Kennzahlen): 401 Unauthorized
# - Frankfurter (Devisen): 301 auf eine andere Adresse; EZB reicht ohnehin
#
# ## Geprüft und verworfen: 6-K für ausländische Emittenten
#
# Der Kalender deckt nur ein knappes Drittel der geführten Aktien ab, weil die
# Pflichtmeldung mit der Punktnummer 2.02 eine US-Besonderheit ist. Naheliegend
# wäre, für ausländische Emittenten das Formular 6-K zu nehmen und die
# Ergebnismeldung an der Dokumentbeschreibung zu erkennen.
#
# Das geht nicht, und zwar nachweislich: Bei SAP, ASML, Novo Nordisk, Shell,
# Sony und TSMC lautet die Beschreibung ausnahmslos „FORM 6-K“ und sonst nichts
# – bei 361 bis 891 Meldungen je Unternehmen. AstraZeneca hat als einziges
# sprechende Beschreibungen, aber die 65 Treffer auf „results“ sind Ergebnisse
# klinischer Studien („SONE-VE IMPROVED SURVIVAL IN GASTRIC CANCERS“). Ein
# Filter darauf erzeugte Kalendereinträge, die mit Quartalszahlen nichts zu tun
# haben.
#
# Die Lücke bleibt deshalb bestehen und steht als solche auf der Kalenderseite.

on:
  workflow_dispatch:

jobs:
  abklopfen:
    name: Kandidaten prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Derzeit steht keine Quelle zur Prüfung an
        run: |
          echo "Dieser Workflow hat keinen offenen Auftrag."
          echo "Er wird beschrieben, sobald eine neue Quelle geprüft werden soll –"
          echo "der Kopf der Datei hält fest, was bisher geprüft wurde und mit"
          echo "welchem Ergebnis."
