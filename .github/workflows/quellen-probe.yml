name: Quellen abklopfen

# Probiert Datenquellen durch und schreibt auf, welche antworten.
#
# Aus der Entwicklungsumgebung sind nur npm und GitHub erreichbar; jeder
# Versuch, eine Schnittstelle anzusprechen, endet dort mit 403 des Proxys. Auf
# einem GitHub-Läufer gibt es diese Einschränkung nicht. Ohne diesen Weg bliebe
# nur Raten.
#
# Der Workflow ist Werkzeug, kein Bestandteil der Website. Er verändert nichts.
#
# ## Bisheriger Stand
#
# - IWF (Schuldenquote): geht → 191 Länder, eingebaut
# - OECD (Löhne): geht → 38 Länder, eingebaut
# - OECD (Vermögen): geht → 30 Länder nach Umrechnung, eingebaut
# - SEC (Fundamentaldaten, us-gaap): geht → 170 geführte Kürzel, eingebaut
# - SEC (Quartalstermine, 8-K/2.02): geht → 158 Unternehmen, eingebaut
# - SEC (6-K für ausländische Emittenten): geprüft, verworfen – die
#   Dokumentbeschreibung lautet ausnahmslos „FORM 6-K“.
# - Yahoo (Kennzahlen, Kalender, quote-Endpunkt): 401. Der Kalender verlangt
#   seit Kurzem einen Crumb, also Cookie und Einmalkennung aus dem Browser.
#   Das ist eine gesetzte Zugangssperre und nichts, was man wegkonfiguriert –
#   dieselbe Entscheidung wie seinerzeit bei Stooq.
# - Financial Modeling Prep: 401, verlangt einen Schlüssel.
# - stockanalysis.com: liefert 200, ist aber eine fremde Website und keine
#   Schnittstelle. Deren Aufbereitung abzugreifen ist etwas anderes als eine
#   Quelle zu nutzen.
# - Frankfurter (Devisen): 301 auf eine andere Adresse; EZB reicht ohnehin
#
# ## Diese Runde: Börse Frankfurt
#
# Als einzige der fünf geprüften Adressen hat `api.boerse-frankfurt.de` mit
# 200 geantwortet – allerdings mit einem leeren Objekt. Das kann zweierlei
# heißen: falscher Pfad oder falscher Parametername. Beides lässt sich
# durchprobieren.
#
# Der Weg wäre der richtige: Deutsche Börse führt die Unternehmenstermine der
# hier gelisteten Gesellschaften selbst, und börsennotierte Gesellschaften sind
# verpflichtet, einen Finanzkalender zu veröffentlichen. Wenn es geht, deckt
# das die deutschen und einen Teil der europäischen Werte ab.

on:
  workflow_dispatch:

jobs:
  abklopfen:
    name: Börse Frankfurt – Unternehmenstermine
    runs-on: ubuntu-latest
    steps:
      - name: Pfade und Parameter durchprobieren
        run: |
          UA="Mozilla/5.0 (compatible; IM-Invests/1.0; +https://iminvests.de)"
          # SAP: DE0007164600, Siemens: DE0007236101
          ISIN=DE0007164600

          probiere() {
            code=$(curl -sS -A "$UA" -H 'Accept: application/json' \
              -H 'Origin: https://www.boerse-frankfurt.de' \
              -H 'Referer: https://www.boerse-frankfurt.de/' \
              --max-time 40 -o /tmp/bf.json -w '%{http_code}' "$1" || echo 000)
            groesse=$(stat -c%s /tmp/bf.json 2>/dev/null || echo 0)
            echo "▶ $code  ${groesse}B  $1"
            if [ "$groesse" -gt 3 ]; then head -c 500 /tmp/bf.json; echo; fi
          }

          for pfad in \
            "data/company_dates?isin=$ISIN" \
            "data/company_dates?isin=$ISIN&limit=25&offset=0" \
            "data/corporate_dates?isin=$ISIN" \
            "data/equity_company_dates?isin=$ISIN" \
            "data/company_information?isin=$ISIN" \
            "data/equity_master_data?isin=$ISIN" \
            "data/price_information?isin=$ISIN&mic=XETR" \
            "search/equity_search"; do
            probiere "https://api.boerse-frankfurt.de/v1/$pfad"
          done

      - name: Gibt es einen offenen Einstiegspunkt?
        run: |
          UA="Mozilla/5.0 (compatible; IM-Invests/1.0; +https://iminvests.de)"
          for url in \
            "https://api.boerse-frankfurt.de/v1/" \
            "https://api.boerse-frankfurt.de/" \
            "https://api.boerse-frankfurt.de/v1/swagger.json" \
            "https://api.boerse-frankfurt.de/v1/openapi.json"; do
            code=$(curl -sS -A "$UA" --max-time 30 -o /tmp/e.json -w '%{http_code}' "$url" || echo 000)
            echo "▶ $code  $(stat -c%s /tmp/e.json 2>/dev/null || echo 0)B  $url"
            head -c 300 /tmp/e.json; echo; echo
          done
