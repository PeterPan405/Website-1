name: Quellen abklopfen

# Probiert Datenquellen durch und schreibt auf, welche antworten.
#
# Aus der Entwicklungsumgebung sind nur npm und GitHub erreichbar; jeder
# Versuch, eine Schnittstelle anzusprechen, endet dort mit 403 des Proxys. Auf
# einem GitHub-Läufer gibt es diese Einschränkung nicht. Ohne diesen Weg bliebe
# nur Raten.
#
# Der Workflow verändert nichts. Er ist Werkzeug, kein Bestandteil der Website.
#
# ## Bisheriger Stand
#
# - IWF (Schuldenquote): geht, seit ein User-Agent mitgeschickt wird → 191 Länder
# - OECD (Löhne): geht, seit Sprache und Format ausdrücklich gesetzt sind → 38 Länder
# - OECD (Vermögen): erreichbar, 31 Länder, enthält „Net wealth“ und „Median“ –
#   aber in Landeswährung, für den Vergleich fehlt eine Umrechnung
# - SEC (Fundamentaldaten): geht über die Jahresrahmen, rund 3.900 vollständige
#   Datensätze; eingebaut und in Betrieb
# - Yahoo (Fundamentaldaten): 401 Unauthorized bzw. Invalid Crumb
# - ILO, Our World in Data: keine brauchbare Reihe gefunden
#
# ## Diese Runde
#
# Das Medianvermögen. Die Datenbank ist erreichbar und enthält den gesuchten
# Wert – offen sind zwei Fragen, die sich nur am echten Datensatz beantworten
# lassen: Wie heißen die Spalten genau, und in welcher Einheit stehen die
# Zahlen? Erst danach lässt sich ein Parser schreiben, der nicht rät.
#
# Zweite Frage: Für die Umrechnung in eine Vergleichswährung braucht es
# historische Wechselkurse zum jeweiligen Erhebungsjahr. Getestet wird, ob die
# Frankfurter-Schnittstelle die liefert.

on:
  workflow_dispatch:

jobs:
  abklopfen:
    name: Kandidaten prüfen
    runs-on: ubuntu-latest
    steps:
      - name: OECD – Aufbau der Vermögensdatenbank
        run: |
          UA="IM-Invests-Laenderabruf/1.0 (+https://iminvests.de)"
          url="https://sdmx.oecd.org/public/rest/data/OECD.WISE.INE,DSD_WEALTH@DF_WEALTH,1.0/?format=csvfilewithlabels"

          curl -sS -L -A "$UA" -H 'Accept-Language: en' --max-time 90 -o /tmp/wealth.csv "$url"
          echo "Zeilen: $(wc -l < /tmp/wealth.csv), Größe: $(stat -c%s /tmp/wealth.csv) Bytes"

          echo ""
          echo "── Kopfzeile, eine Spalte je Zeile mit Nummer ──"
          head -1 /tmp/wealth.csv | tr ',' '\n' | nl

          echo ""
          echo "── Drei vollständige Datenzeilen ──"
          sed -n '2,4p' /tmp/wealth.csv

          echo ""
          echo "── Zeilen, die 'Median' enthalten: wie viele, und wie sehen sie aus? ──"
          grep -c -i 'median' /tmp/wealth.csv || echo 0
          grep -i 'median' /tmp/wealth.csv | head -5

          echo ""
          echo "── Welche Einheiten kommen vor? ──"
          python3 - <<'PY'
          import csv, collections
          with open('/tmp/wealth.csv', newline='', encoding='utf-8') as f:
              zeilen = list(csv.DictReader(f))
          print(f"  {len(zeilen)} Datenzeilen")
          for spalte in ('UNIT_MEASURE', 'Unit of measure', 'MEASURE', 'Measure',
                         'PRICE_BASE', 'Price base', 'TRANSFORMATION', 'Transformation'):
              if zeilen and spalte in zeilen[0]:
                  werte = collections.Counter(z[spalte] for z in zeilen)
                  print(f"  {spalte}: " + ', '.join(f'{k}({v})' for k, v in werte.most_common(12)))
          PY

          echo ""
          echo "── Ein konkreter Medianwert für Deutschland, alle Spalten ──"
          python3 - <<'PY'
          import csv
          with open('/tmp/wealth.csv', newline='', encoding='utf-8') as f:
              for zeile in csv.DictReader(f):
                  treffer = [w for w in zeile.values() if w and 'edian' in str(w)]
                  if treffer and zeile.get('REF_AREA') == 'DEU':
                      for schluessel, wert in zeile.items():
                          if wert:
                              print(f"    {schluessel:28} = {wert}")
                      break
              else:
                  print("    keine Medianzeile für DEU gefunden")
          PY

      - name: Historische Wechselkurse für die Umrechnung
        run: |
          UA="IM-Invests-Laenderabruf/1.0 (+https://iminvests.de)"
          for datum in 2021-12-31 2023-12-29 latest; do
            code=$(curl -sS -A "$UA" --max-time 30 -o /tmp/fx.json -w '%{http_code}' \
              "https://api.frankfurter.app/$datum?from=USD&to=EUR,CHF,GBP,JPY,SEK,KRW" || echo 000)
            echo "▶ $datum → $code"
            head -c 240 /tmp/fx.json
            echo ""
          done

          echo ""
          echo "── Deckt Frankfurter alle nötigen Währungen ab? ──"
          curl -sS -A "$UA" --max-time 30 "https://api.frankfurter.app/currencies" -o /tmp/cur.json
          python3 - <<'PY'
          import json
          waehrungen = json.load(open('/tmp/cur.json'))
          print(f"  {len(waehrungen)} Währungen: " + ' '.join(sorted(waehrungen)))
          gebraucht = ['EUR','CHF','GBP','JPY','KRW','SEK','NOK','DKK','PLN','HUF',
                       'CZK','CAD','AUD','NZD','MXN','ILS','TRY','CLP','COP','ISK']
          fehlt = [w for w in gebraucht if w not in waehrungen]
          print("  fehlt: " + (' '.join(fehlt) if fehlt else "nichts"))
          PY
