name: Quellen abklopfen

# Probiert Datenquellen durch und schreibt auf, welche antworten.
#
# Aus der Entwicklungsumgebung sind nur npm und GitHub erreichbar; jeder
# Versuch, eine Schnittstelle anzusprechen, endet dort mit 403 des Proxys. Auf
# einem GitHub-Läufer gibt es diese Einschränkung nicht. Ohne diesen Weg bliebe
# nur Raten.
#
# Der Workflow ist Werkzeug, kein Bestandteil der Website. Er verändert nichts.
#
# ## Bisheriger Stand
#
# - IWF (Schuldenquote): geht → 191 Länder, eingebaut
# - OECD (Löhne): geht → 38 Länder, eingebaut
# - OECD (Vermögen): geht → 30 Länder nach Umrechnung, eingebaut
# - SEC (Fundamentaldaten, us-gaap): geht → 170 geführte Kürzel, eingebaut
# - SEC (Quartalstermine, 8-K/2.02): geht → 158 Unternehmen, eingebaut
# - SEC (6-K für ausländische Emittenten): geprüft, verworfen – die
#   Dokumentbeschreibung lautet ausnahmslos „FORM 6-K“.
# - Yahoo (Kennzahlen, Kalender, quote-Endpunkt): 401. Der Kalender verlangt
#   seit Kurzem einen Crumb, also Cookie und Einmalkennung aus dem Browser.
#   Das ist eine gesetzte Zugangssperre und nichts, was man wegkonfiguriert –
#   dieselbe Entscheidung wie seinerzeit bei Stooq.
# - Financial Modeling Prep: 401, verlangt einen Schlüssel.
# - stockanalysis.com: liefert 200, ist aber eine fremde Website und keine
#   Schnittstelle. Deren Aufbereitung abzugreifen ist etwas anderes als eine
#   Quelle zu nutzen.
# - Frankfurter (Devisen): 301 auf eine andere Adresse; EZB reicht ohnehin
#
# - Börse Frankfurt: **403, „Invalid CORS request“** auf allen Datenpfaden.
#   Die 200 der ersten Runde kam von einem Auffangpfad und enthielt ein leeres
#   Objekt; dasselbe liefern `/v1/`, `swagger.json` und `openapi.json`. Die
#   Schnittstelle verlangt einen im Browser errechneten Kopfzeilenwert.
#
# ## Ergebnis zu den Quartalsterminen ausserhalb der USA
#
# Sechs Quellen geprüft, keine frei zugängliche gefunden. Das Muster ist
# überall dasselbe: Wer Termine für europäische und asiatische Werte führt,
# verlangt entweder einen Schlüssel oder eine Kennung, die nur ein Browser
# erzeugt.
#
# Damit ist die Frage keine technische mehr, sondern eine Entscheidung: Ein
# kostenloser Zugangsschlüssel bei einem Anbieter, der Europa abdeckt – oder
# die Lücke bleibt und steht wie bisher als solche auf der Kalenderseite.
# Beides ist vertretbar; nur das Nachbauen einer Zugangssperre nicht.
#
# ## Twelve Data: der Endpunkt gibt es, und er liefert
#
# Geprüft mit dem öffentlichen Demo-Schlüssel:
#
# - `/earnings?symbol=AAPL` → **200**, mit echten Meldeterminen samt Schätzung
#   und tatsächlichem Ergebnis je Quartal.
# - `/earnings?symbol=SAP&exchange=XETR` → 403, aber mit dem Hinweis, dass der
#   Demo-Schlüssel nur der ersten Bekanntschaft dient. Keine Aussage über
#   fehlende Abdeckung.
# - `/stocks?symbol=SAP` → **200**, und SAP SE steht mit europäischen
#   Handelsplätzen im Verzeichnis. Der Anbieter kennt die Werte also.
# - Finnhub: 401 ohne Schlüssel, sonst keine Aussage möglich.
#
# Twelve Data ist in diesem Projekt bereits als Kursanbieter vorgesehen
# (`lib/providers/twelvedata.ts`, Secret `TWELVEDATA_API_KEY`). Ein Schlüssel
# würde damit zwei Zwecken dienen: bessere Kurse und die fehlenden
# Meldetermine.
#
# Was ein Schlüssel nicht beantwortet, solange keiner hinterlegt ist: ob der
# kostenlose Tarif den Endpunkt `/earnings` überhaupt freischaltet und wie
# viele Abfragen je Minute er zulässt. Beides zeigt sich beim ersten Lauf.
#
# Nachgesehen am 28. Juli 2026: **kein Schlüssel hinterlegt.** Der zweite Weg
# im Abrufskript ist gebaut und meldet sich nicht, solange das so bleibt.
#
# ### Die Antwort, nachgelesen am 20. August 2026: nein
#
# Der Schlüssel ist inzwischen hinterlegt, und der Endpunkt ist im kostenlosen
# Tarif **nicht** freigeschaltet. Der Anbieter sagt es in jeder einzelnen
# Antwort:
#
#     403 – /earnings is available exclusively with grow or pro or ultra or
#     venture or enterprise plans.
#
# Nicht bei europäischen Kürzeln, nicht bei asiatischen – bei allen, auch bei
# amerikanischen. Der Demo-Schlüssel der ersten Probe konnte `AAPL` abrufen;
# ein echter kostenloser Schlüssel kann es nicht.
#
# **Das stand seit dem ersten Lauf im Protokoll und hat drei Wochen niemand
# gelesen.** Der Lauf war grün, die Zeile war eine Warnung unter 578
# gleichlautenden, und die Zusammenfassung am Ende – „Über Twelve Data ist
# nichts dazugekommen" – stand darunter. In der Zeit hat der nächtliche Lauf
# 75 Minuten am Tag damit verbracht, Absagen einzusammeln.
#
# Seit dem 20. August 2026 bricht der zweite Weg bei dieser Antwort nach der
# ersten Abfrage ab und schreibt eine Warnung, die den Fall benennt
# (`TarifSperre` in `lib/providers/twelvedata-termine.ts`). Der Weg selbst
# bleibt stehen: Er funktioniert an dem Tag, an dem jemand einen Tarif bucht.
#
# Damit ist die Frage endgültig keine technische mehr. Sieben Quellen sind
# geprüft; für Meldetermine außerhalb der USA gibt es keine kostenlose. Es
# bleibt die Wahl zwischen einem kostenpflichtigen Tarif und der Lücke – und
# die Lücke steht seitdem nicht nur auf der Kalenderseite, sondern auf jeder
# betroffenen Aktienseite.
#
# ## Der Satz oben war zu schnell: Alpha Vantage liefert doch
#
# „Sieben Quellen geprüft, keine gefunden" ist eine Aussage über sieben Quellen
# und keine über die Welt. Der Betreiber hat am 20. August 2026 widersprochen –
# und der zweite Durchgang hat noch etwas gefunden:
#
# - `alphavantage.co/query?function=EARNINGS_CALENDAR&horizon=3month` → **200**,
#   ein CSV mit 1.706 Zeilen, 95 KB, **ein Abruf für alle**. Spalten:
#   `symbol,name,reportDate,fiscalDateEnding,estimate,currency,timeOfTheDay`.
#   Es sind **angekündigte** Termine, nicht hochgerechnete, und `timeOfTheDay`
#   sagt `pre-market` oder `post-market`. Eingebaut in
#   `lib/providers/alphavantage-termine.ts`.
# - Yahoo `v10`/`v6`/`v7` quoteSummary: **401**. Der Crumb bleibt Pflicht.
# - Financial Modeling Prep, Finnhub: **401** ohne Schlüssel.
# - Euronext `/en/financial-calendars`: 200, Rubrik vorhanden, Termine erst im
#   Browser gerendert. Der geratene JSON-Pfad: 404.
# - LSE `api.londonstockexchange.com/api/gw/lse/instruments/alldata/AZN`:
#   **200 JSON ohne Schlüssel** – aber nur Stammdaten (ISIN, SEDOL, Segment),
#   keine Termine.
#
# ## Und der naheliegende nächste Versuch, der ebenfalls schon geprüft ist
#
# Der Sammelkalender führt neben den NYSE-Notierungen auch OTC-Zeilen: `SAPGF`,
# `NGGTF`, `VODPF`, `ARHUF`. Daraus entsteht sofort die Idee, für die
# europäischen Werte eine Brücke auf ihr ADR-Kürzel zu bauen – `SIE.DE` →
# `SIEGY`, `ALV.DE` → `ALIZY` und so weiter.
#
# **Nachgemessen am 20. August 2026: Das trägt nicht.** Von 42 abgefragten
# ADR- und OTC-Kürzeln der größten europäischen und japanischen Werte standen
# **drei** im Kalender: `IBDRY` (Iberdrola), `CAJPY` (Canon), `VWAGY`
# (Volkswagen). Nicht enthalten waren unter anderem SIEGY, ALIZY, LVMUY,
# NSRGY, BAYRY, BASFY, MBGYY, IFNNY, DTEGY, MURGY, DANOY, RHHBY, ADDYY,
# SBGSY – und auch die vollwertigen NYSE-Notierungen TM (Toyota), SONY, GSK,
# RIO, DEO, BCS, SNY fehlen, obwohl ihre Meldetermine in das
# Dreimonatsfenster fallen müssten.
#
# Eine Brücke mit fünfzig handgepflegten Kürzeln brächte also drei Treffer und
# siebenundvierzig Einträge, die niemand nachzieht. Nicht bauen.
#
# ## Was daraus für die Abdeckung folgt
#
# Von den 711 Aktien ohne Termin tragen **27** ein US-Kürzel und sind damit
# überhaupt erreichbar: SAP, ASML, TSM, NVO, XOM, STLA, RACE, BABA, UMC, ARM,
# RYAAY, JBS, CHKP, CYBR, NICE, BNTX, SPOT, SE, SQM, YPF, GGAL, BAP, GFI,
# SBSW, ESLT, WIX, MNDY.
#
# Die Obergrenze mit Schlüssel liegt damit bei rund **345 von 1.029** statt
# 318. Die übrigen gut 680 sind reine Heimatnotierungen, und für die ist nach
# neun geprüften Quellen weiterhin keine freie Sammelstelle in Sicht.

#
# ## Die Börsen selbst – erster Durchgang am 20. August 2026
#
# Nachdem die Datenhändler durch waren, sind die Börsen drangekommen. Sie
# führen die Termine amtlich, und mehrere antworten ohne Schlüssel.
#
# - **JPX (Tokio): die Quelle gibt es, auf Japanisch.**
#   `listing/event-schedules/financial-announcement/index.html` führt „Scheduled
#   Dates for Earnings Announcements", und die Seite sagt selbst: „The schedule
#   … will be updated at around 5:00 p.m. each business day." Die englische
#   Fassung verweist für die Liste auf die japanische. Das ist eine tägliche,
#   amtliche, kostenlose Quelle für die japanischen Werte – erreichbar, aber
#   noch nicht ausgelesen.
# - **Euronext:** `/en/ajax/getFactsheetInfoBlock/STOCK/{ISIN}-{MIC}/fs_agenda_block`
#   antwortet mit **200**, der Block kam allerdings leer zurück. Der Pfad
#   stimmt, der Blockname wohl noch nicht.
# - **LSE:** `api.londonstockexchange.com/api/gw/lse/instruments/alldata/{TIDM}`
#   antwortet mit **200 JSON ohne Schlüssel** – Stammdaten, keine Termine.
#   `/news/{TIDM}` gibt es nicht (404).
# - **EODHD:** 403 mit Demo-Schlüssel.
# - **Nasdaq (`api.nasdaq.com/api/company/{X}/financial-calendar`):** 404.
#
# ### Was der Weg über die Börsen kosten würde
#
# Für alle 1.029 Aktien wären es rund zehn getrennte Anbindungen: JPX,
# Euronext, LSE, Deutsche Börse (bereits 403), SIX, Nasdaq Nordic, BME, Borsa
# Italiana, HKEX, KRX, TWSE, NSE, ASX, TSX, B3 – jede mit eigenem Format,
# eigener Sprache, eigenem Kürzelschema, und jede bricht still, wenn die Börse
# ihre Seite umbaut.
#
# Dem gegenüber steht **eine** Anbindung: Der Weg über Twelve Data ist
# fertig gebaut (`lib/providers/twelvedata-termine.ts`) und wartet nur auf
# einen bezahlten Tarif. Der Anbieter führt die europäischen Werte
# nachweislich im Verzeichnis (siehe oben, `/stocks?symbol=SAP`).
#
# Das ist keine technische Frage mehr, sondern die Wahl zwischen Arbeitszeit
# plus Dauerpflege und einem Monatsbetrag.
#
#
# ## Die Börsen, zweiter Durchgang am 20. August 2026
#
# Abgerufen über `quellen-holen.yml`, diesmal mit dem Ergebnis auf dem Zweig
# `quellen-holen-heute` statt nur im Protokoll.
#
# - **JPX (Tokio): angeschlossen.** `lib/providers/jpx-termine.ts`. Die Börse
#   veröffentlicht die geplanten Meldetermine aller gelisteten Unternehmen als
#   XLSX; die Adressen stehen auf der **japanischen** Übersichtsseite, die
#   englische trägt null Verweise. Gemessen: 3.209 Termine, Stand 2026-08-06,
#   Zeitraum 3. Juli bis 17. September, **67 der 72** geführten japanischen
#   Titel darin. Kein Schlüssel, keine Anmeldung, keine Uhrzeit.
# - **TWSE (Taipeh): 200 JSON ohne Schlüssel.** `openapi.twse.com.tw` antwortet
#   offen. `t187ap04_L` ist allerdings die Rubrik „wesentliche Mitteilungen"
#   (Namensänderungen, Nennwertänderungen) und keine Terminliste. Welcher
#   Datensatz die Meldetermine trägt – falls einer –, steht noch aus;
#   `openapi.twse.com.tw/v1/swagger.json` listet sie alle.
# - **HKEX:** `hkexnews.hk` antwortet mit 200, der Inhalt ist eine leere Hülle
#   mit Navigation. Die Suche läuft im Browser nach.
# - **Deutsche Börse Cash Market**, Rubrik „Unternehmenstermine": **200, und
#   im Text steht ausschließlich das Navigationsmenü.** Dieselbe Bauart wie
#   HKEX. Das ist die größte offene Lücke – 90 der 1.029 Titel sind deutsch.
# - **Euronext** `/en/markets/paris/equities/financial-events`: **404.**
# - **ASX** `/asx/v2/statistics/upcomingEvents.do`: **404.**
#
# Vier von sechs Börsen liefern also keine lesbare Liste – aber nicht, weil sie
# etwas verbergen, sondern weil ihre Seiten im Browser zusammengesetzt werden.
# Das ist keine Sperre, sondern eine Bauart, und dahinter liegt jeweils ein
# Aufruf, den man finden kann. Gefunden ist er noch nicht.
#
#
# ## Die Börsen, dritter Durchgang am 20. August 2026
#
# Diesmal nicht die Übersichtsseiten, sondern die Aufrufe dahinter. Ergebnis
# über `quellen-holen-heute` gelesen.
#
# - **SIX (Zürich): offen, vollständig – und ohne Meldetermine.**
#   `six-group.com/fqs/ref.json?select=*&where=ValorSymbol=NESN` antwortet mit
#   200 JSON, ohne Schlüssel, mit einer eigenen Abfragesprache und **334
#   Feldern**. Durchgesehen auf `event`, `report`, `earn`, `result`, `annual`,
#   `agenda`, `calend`, `publi`, `next`, `announ`: Was zurückkommt, sind
#   `CapitalEvent*` (Kapitalmaßnahmen – Splits, Kapitalerhöhungen), ein
#   `HolidayCalendar` und `MarketCodeOfPublication`. **Kein Feld für den
#   nächsten Meldetermin.** Die Schnittstelle ist offen, die Angabe steht nicht
#   drin.
#
#   Für andere Fragen ist sie trotzdem notiert: Stammdaten, Kurse,
#   Indexzugehörigkeiten, ISIN – alles ohne Schlüssel.
# - **LSE:** `api.londonstockexchange.com/.../alldata/AZN` – 200 JSON, reich an
#   Kurs- und Stammdaten (ISIN, SEDOL, Sektor, Börsenwert, 52 Wochen), aber
#   nur `datelastnews` und `subjectnews`: die **letzte** Meldung, kein Termin.
# - **Euronext:** Der Weg über den Faktenblatt-Block ist zu.
#   `/en/ajax/getFactsheetInfoBlock/STOCK/FR0000120271-XPAR/fs_agenda_block`
#   antwortet mit **200 und leerem Rumpf**, ebenso `fs_generalinfo_block`. Die
#   Seite `/en/product/equities/FR0000120271-XPAR/company-events` liefert 200,
#   im Text steht das Navigationsmenü. Zusammengesetzt wird im Browser.
# - **Börse Frankfurt:** `api.boerse-frankfurt.de/v1/data/company_events`
#   **gibt es** – die Adresse antwortet mit 200 und `{}` statt mit 404. Ohne
#   die im Browser errechnete Kennung bleibt sie leer. Das ist eine bewusst
#   gesetzte Sperre, und die wird hier nicht nachgebaut.
#   `boerse-frankfurt.de/aktie/siemens-ag/termine`: 404.
# - **TWSE:** `openapi.twse.com.tw/v1/swagger.json` – 200, rund 300 KB, gut
#   hundert Datensätze in sieben Rubriken. Geprüft ist bisher einer
#   (`t187ap04_L`, „wesentliche Mitteilungen"), und der ist es nicht. Ob einer
#   der übrigen Meldetermine führt, ist **offen** – Taiwan sind rund zehn
#   Titel, deshalb steht es hinten an.
#
# ### Der Stand nach drei Durchgängen
#
# Angeschlossen: SEC (318 US-Titel), Sammelkalender (wartet auf einen
# Schlüssel), JPX (72 japanische Titel, ab der nächsten Berichtssaison).
#
# Offen und ohne gefundenen Weg: Europa. Die Börsen führen die Termine, geben
# sie aber nur an ihre eigene Oberfläche heraus – Euronext, Deutsche Börse und
# HKEX bauen ihre Seiten im Browser zusammen, SIX und die LSE geben alles außer
# dem Termin. **Deutschland ist mit 90 Titeln die größte Lücke.**
#
# Das ist ein Zwischenstand und kein Ergebnis. Was noch nicht versucht wurde:
# die Aufrufe zu finden, die diese Oberflächen selbst benutzen – bei Euronext
# und der Deutschen Börse gibt es sie, sonst stünde auf ihren Seiten nichts.
#
#
# ## Offener Auftrag: Unternehmenszahlen ausserhalb der USA
#
# 172 der 529 Aktien haben Umsatz, Gewinn, Cashflow, Eigenkapital und
# Aktienzahl. Die uebrigen 357 sind fast alle ausserhalb der USA notiert.
#
# Die Annahme dahinter war, dass diese Unternehmen bei der SEC nicht melden.
# Das gilt aber nur fuer die, die keinen Hinterlegungsschein in New York haben.
# Wer einen hat, reicht jaehrlich einen `20-F` ein – Kanadier einen `40-F` –,
# und der liegt im selben XBRL-Format wie ein amerikanischer `10-K`.
#
# `scripts/quellen-probe-fundamentaldaten.ts` gleicht die 357 Namen gegen das
# Kuerzelverzeichnis der SEC ab und prueft jeden Treffer mit einem echten
# Abruf: Welche Groessen liegen vor, in welcher Waehrung, unter welcher
# Rechnungslegung. Das Ergebnis ist eine Vorlage zum Durchsehen, keine Tabelle
# zum Uebernehmen – eine falsche Zuordnung faellt spaeter niemandem auf.
#
# **Ergebnis vom 28. Juli 2026: 114 Fundstellen, davon 81 uebernommen.** Der
# Rest waren Namensverwechslungen (Merck KGaA gegen Merck & Co., Tencent gegen
# Tencent Music, Reliance Industries gegen einen Stahlhaendler in Los Angeles).
# Eingebaut in `scripts/fundamentaldaten-abrufen.ts`; die Abdeckung stieg damit
# von rund 150 auf 216 der 529 Aktien.
#
# ## ESEF: geht, und deckt Europa ab
#
# Fuer die verbliebenen 287 Werte ohne SEC-Meldung wurde `filings.xbrl.org`
# geprueft – das offene Verzeichnis, das XBRL International ueber die
# ESEF-Pflichtmeldungen der EU fuehrt. Seit dem Geschaeftsjahr 2021 muss jeder
# Emittent an einem geregelten EU-Markt seinen Konzernabschluss maschinenlesbar
# abgeben, ausgezeichnet nach `ifrs-full` – derselben Taxonomie, aus der dieses
# Projekt bereits die IFRS-Melder der SEC liest.
#
# **Ergebnis: Das Verzeichnis fuehrt 3.895 Unternehmen, 98 davon lassen sich
# den hier fehlenden Werten zuordnen.** Darunter Airbus, L'Oreal, AXA, BNP
# Paribas, Danone, Kering, Thales, Enel, Intesa Sanpaolo, UniCredit, Oersted,
# Vestas, Atlas Copco, Nordea, Kone, Erste Group und OMV.
#
# Damit ist die Quelle bestaetigt, aber noch nicht eingebaut. Was dafuer fehlt:
# je Unternehmen den Abschluss unter `json_url` holen, die Groessen aus den
# xBRL-JSON-Fakten lesen und die Zuordnung von Hand durchsehen. Die
# Kandidatenliste liegt als Artefakt am Lauf.
#
# Zu erwarten sind etwa 70 bis 80 gesicherte Zuordnungen: In der Liste stehen
# dieselben Arten von Verwechslung wie bei der SEC – Roche traf ROCHE BOBOIS
# (ein Moebelhaus), Nestle die US-Finanzierungstochter, Volvo die davon
# getrennte Volvo Car, SK Hynix die SK Telecom.
#
# ## ESEF, zweite Runde: die Zahlen selbst
#
# Die Sonde `quellen-probe-esef-werte.ts` hat je Kandidat den juengsten
# Abschluss unter `json_url` geholt und die fuenf Groessen ausgelesen.
#
# **Ergebnis vom 29. Juli 2026: 77 der 98 Kandidaten mit Umsatz, Gewinn und
# Eigenkapital – aber nur 11 mit Aktienzahl.** Und ohne die ist der Datensatz
# fuer diese Website wertlos: Marktkapitalisierung, KGV, KUV, KBV und Cashflow
# je Aktie laufen alle ueber sie.
#
# Der Grund: ESEF verlangt die Aktienzahl nicht. `NumberOfSharesOutstanding`
# ist eine Angabe im Anhang, und wer sie auszeichnet, tut das freiwillig.
#
# Der Ausweg steht in IAS 33: Das **Ergebnis je Aktie** ist vorgeschrieben und
# steht in praktisch jedem Abschluss. Jahresueberschuss geteilt durch Ergebnis
# je Aktie ergibt die gewichtete Durchschnittszahl des Jahres – genau die Zahl,
# mit der auch das Ergebnis je Aktie gerechnet wurde, und damit die richtige
# fuer ein KGV. Eingebaut in `scripts/esef-abrufen.ts`.
#
# Die Sonde hat ausserdem die erwarteten Verwechslungen bestaetigt: Nestle traf
# `NESTLE HOLDINGS, INC.` (die US-Finanzierungstochter, 31 statt 91 Mrd.
# Umsatz), Volvo die Volvo Car, SEB den franzoesischen
# Haushaltsgeraetehersteller `SEB SA`, SK Hynix die SK Telecom, Hexagon die
# Hexagon Purus, Sartorius die Sartorius Stedim Biotech, Macquarie Group die
# Macquarie Bank. Alle sieben stehen deshalb nicht in der Zuordnung.
#
# ## ESEF, dritte Runde: die deutsche Luecke
#
# In der Zuordnung in `scripts/esef-abrufen.ts` stand kein einziger
# `.DE`-Ticker, obwohl Allianz, BMW, Siemens und 85 weitere derselben
# ESEF-Pflicht unterliegen.
#
# **Ergebnis vom 31. Juli 2026 mit `quellen-probe-esef-de.ts`: Von den
# gefuehrten Abschluessen traegt kein einziger das Land `DE`.** Die Verteilung
# reicht von FI, SE und IT ueber HR, MT und LT bis CZ mit 29 Abschluessen –
# Deutschland kommt darin nicht vor. Der Grund liegt im Meldeweg: Deutsche
# Emittenten reichen beim Unternehmensregister ein, und dessen Bestand fliesst
# nicht in dieses Verzeichnis.
#
# Die Sonde meldete vier Namenstreffer unter 88 deutschen Aktien ohne Zahlen.
# Drei sind Verwechslungen der bekannten Art und wurden verworfen: Siemens traf
# Siemens Gamesa (die spanische Windkrafttochter von Siemens Energy), Deutsche
# Telekom traf Telekom Austria, Sartorius erneut Sartorius Stedim Biotech.
#
# Der vierte ist echt: **Aroundtown** (`AT1.DE`) ist eine luxemburgische
# Aktiengesellschaft mit Notierung in Frankfurt und reicht deshalb in Luxemburg
# ein. Sie steht jetzt in der Zuordnung – als einziger `.DE`-Ticker.
#
# Damit ist die Luecke geklaert und keine offene Aufgabe mehr: Sie liegt an der
# Quelle. Wer die 87 uebrigen deutschen Werte will, braucht das
# Unternehmensregister, und ob das ohne Anmeldung maschinenlesbar antwortet,
# prueft die Sonde im selben Lauf mit.
#
# ## Ergebnis der Runde ausserhalb von USA und EU
#
# Geprueft am 29. Juli 2026 mit `quellen-probe-asien.ts`. Genau eine Stelle
# antwortet ohne Schluessel und mit brauchbaren Daten:
#
# - **Taiwan (TWSE), `openapi.twse.com.tw`: 200, JSON, vollstaendig.** Drei
#   Tabellen – Erfolgsrechnung, Bilanz, Stammdaten – je Gesellschaft, mit der
#   amtlichen Nummer als Schluessel. Damit braucht es keinen Namensabgleich und
#   keine Zuordnung von Hand: `2330.TW` ist die Gesellschaft 2330. Eingebaut in
#   `scripts/taiwan-abrufen.ts`.
# - **Japan (EDINET) v2: 401**, „invalid subscription key“. v1 unter
#   `disclosure.edinet-fsa.go.jp`: 403. Ein kostenloser Schluessel ist
#   erhaeltlich.
# - **Korea (DART): HTML** statt JSON – die Adresse fuehrt auf die Anmeldeseite
#   des OpenDART-Systems. Ebenfalls Schluessel noetig.
# - **Hongkong (HKEX): HTML**, eine Suchmaske ohne Schnittstelle.
# - **Indien (BSE): 403**, „Access Denied“.
# - **Deutschland: keine Schnittstelle.** Das Unternehmensregister liefert eine
#   Website, der Bundesanzeiger antwortet gar nicht. Das ist die groesste
#   verbliebene Luecke – Allianz, BMW, BASF, Bayer, Telekom – und sie ist von
#   hier aus nicht zu schliessen.
# - **GLEIF: 200, JSON.** Keine Bilanzzahlen, aber die amtlichen
#   Rechtstraegerkennungen. Falls einmal eine Quelle mit LEI statt Namen
#   arbeitet, waere das die Bruecke.
#
# Damit ist die Frage bei Japan und Korea dieselbe wie bei den Quartalsterminen:
# keine technische mehr, sondern eine Entscheidung ueber einen kostenlosen
# Zugangsschluessel.
#
# ## Was auch ESEF nicht abdeckt
#
# Deutsche Werte fehlen fast vollstaendig – Allianz, BMW, BASF, Bayer, die
# Deutsche Telekom stehen nicht im Verzeichnis; ihre Meldungen gehen an den
# Bundesanzeiger und tauchen dort nicht auf. Ausserhalb der EU gilt die Pflicht
# ohnehin nicht: Japan (EDINET), Korea (DART), Indien, Taiwan und Hongkong
# haetten jeweils eine eigene Aufsicht mit eigenem Format und teils
# Registrierungspflicht. Das sind zusammen rund 190 der 529 Aktien.

on:
  workflow_dispatch:
    inputs:
      sonde:
        description: 'Welche Sonde laufen soll'
        type: choice
        default: alle
        options: [alle, sec, asien, nordisch, esef, esef-de]

jobs:
  abklopfen:
    name: Kandidaten prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: SEC nach den fehlenden Unternehmen absuchen
        if: always() && (inputs.sonde == '' || inputs.sonde == 'alle' || inputs.sonde == 'sec')
        run: node --experimental-strip-types scripts/quellen-probe-fundamentaldaten.ts

      # Steht vor den ESEF-Schritten: Diese Sonde dauert Sekunden, jene
      # zusammen zwanzig Minuten – und wer nur das Neue sehen will, wartet
      # sonst umsonst.
      #
      # Was nach SEC und ESEF noch fehlt: Deutschland, Japan, Korea, Taiwan,
      # Hongkong, Indien. Jedes Land mit eigener Aufsicht und eigenem Format.
      - name: Aufsichtsbehörden außerhalb von USA und EU abklopfen
        if: always() && (inputs.sonde == '' || inputs.sonde == 'alle' || inputs.sonde == 'asien')
        run: node --experimental-strip-types scripts/quellen-probe-asien.ts

      # Der offene Rest aus dem ESEF-Abruf: drei nordische Werte, die im
      # Verzeichnis stehen und trotzdem nichts hergeben.
      - name: Nordische Abschlüsse untersuchen
        if: always() && (inputs.sonde == '' || inputs.sonde == 'alle' || inputs.sonde == 'nordisch')
        run: node --experimental-strip-types scripts/quellen-probe-nordisch.ts

      - name: ESEF-Verzeichnis für die europäischen Werte abklopfen
        if: always() && (inputs.sonde == '' || inputs.sonde == 'alle' || inputs.sonde == 'esef')
        run: node --experimental-strip-types scripts/quellen-probe-esef.ts

      # Zweite Runde: nicht nur, ob der Name im Verzeichnis steht, sondern
      # welche Zahlen dahinterstehen. Erst daran lässt sich eine Zuordnung
      # prüfen – ein Namenstreffer allein hat hier schon zweimal danebengelegen.
      - name: ESEF-Abschlüsse auslesen
        if: always() && (inputs.sonde == '' || inputs.sonde == 'alle' || inputs.sonde == 'esef')
        run: node --experimental-strip-types scripts/quellen-probe-esef-werte.ts

      # Dritte Runde: die deutsche Luecke. In der Zuordnung in
      # `scripts/esef-abrufen.ts` steht kein einziger `.DE`-Ticker, obwohl
      # Allianz, BMW, SAP und zwanzig weitere derselben ESEF-Pflicht
      # unterliegen. Die Sonde klaert, ob die Abschluesse im Verzeichnis
      # fehlen oder nur der Namensabgleich sie nicht trifft – ein Unterschied,
      # der sich nicht erraten laesst und ohne den keine Zuordnung entstehen
      # darf.
      - name: Deutsche Abschlüsse im ESEF-Verzeichnis suchen
        if: always() && (inputs.sonde == '' || inputs.sonde == 'alle' || inputs.sonde == 'esef' || inputs.sonde == 'esef-de')
        run: node --experimental-strip-types scripts/quellen-probe-esef-de.ts

      - name: Kandidatenlisten sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kandidaten
          path: |
            sec-kandidaten.json
            esef-kandidaten.json
            esef-kandidaten-de.json
            esef-werte.json
          if-no-files-found: warn
          # Ohne Angabe hebt GitHub neunzig Tage auf. Diese Listen sind
          # Zwischenstände einer Suche und nach einer Woche wertlos.
          retention-days: 7
