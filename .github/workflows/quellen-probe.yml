name: Quellen abklopfen

# Probiert Datenquellen durch und schreibt auf, welche antworten.
#
# Aus der Entwicklungsumgebung sind nur npm und GitHub erreichbar; jeder
# Versuch, eine Schnittstelle anzusprechen, endet dort mit 403 des Proxys. Auf
# einem GitHub-Läufer gibt es diese Einschränkung nicht. Ohne diesen Weg bliebe
# nur Raten.
#
# Der Workflow ist Werkzeug, kein Bestandteil der Website. Er verändert nichts.
#
# ## Bisheriger Stand
#
# - IWF (Schuldenquote): geht → 191 Länder, eingebaut
# - OECD (Löhne): geht → 38 Länder, eingebaut
# - OECD (Vermögen): geht → 30 Länder nach Umrechnung, eingebaut
# - SEC (Fundamentaldaten, us-gaap): geht → 170 geführte Kürzel, eingebaut
# - SEC (Quartalstermine, 8-K/2.02): geht → 158 Unternehmen, eingebaut
# - SEC (6-K für ausländische Emittenten): geprüft, verworfen – die
#   Dokumentbeschreibung lautet ausnahmslos „FORM 6-K“.
# - Yahoo (Kennzahlen, Kalender, quote-Endpunkt): 401. Der Kalender verlangt
#   seit Kurzem einen Crumb, also Cookie und Einmalkennung aus dem Browser.
#   Das ist eine gesetzte Zugangssperre und nichts, was man wegkonfiguriert –
#   dieselbe Entscheidung wie seinerzeit bei Stooq.
# - Financial Modeling Prep: 401, verlangt einen Schlüssel.
# - stockanalysis.com: liefert 200, ist aber eine fremde Website und keine
#   Schnittstelle. Deren Aufbereitung abzugreifen ist etwas anderes als eine
#   Quelle zu nutzen.
# - Frankfurter (Devisen): 301 auf eine andere Adresse; EZB reicht ohnehin
#
# - Börse Frankfurt: **403, „Invalid CORS request“** auf allen Datenpfaden.
#   Die 200 der ersten Runde kam von einem Auffangpfad und enthielt ein leeres
#   Objekt; dasselbe liefern `/v1/`, `swagger.json` und `openapi.json`. Die
#   Schnittstelle verlangt einen im Browser errechneten Kopfzeilenwert.
#
# ## Ergebnis zu den Quartalsterminen ausserhalb der USA
#
# Sechs Quellen geprüft, keine frei zugängliche gefunden. Das Muster ist
# überall dasselbe: Wer Termine für europäische und asiatische Werte führt,
# verlangt entweder einen Schlüssel oder eine Kennung, die nur ein Browser
# erzeugt.
#
# Damit ist die Frage keine technische mehr, sondern eine Entscheidung: Ein
# kostenloser Zugangsschlüssel bei einem Anbieter, der Europa abdeckt – oder
# die Lücke bleibt und steht wie bisher als solche auf der Kalenderseite.
# Beides ist vertretbar; nur das Nachbauen einer Zugangssperre nicht.
#
# ## Twelve Data: der Endpunkt gibt es, und er liefert
#
# Geprüft mit dem öffentlichen Demo-Schlüssel:
#
# - `/earnings?symbol=AAPL` → **200**, mit echten Meldeterminen samt Schätzung
#   und tatsächlichem Ergebnis je Quartal.
# - `/earnings?symbol=SAP&exchange=XETR` → 403, aber mit dem Hinweis, dass der
#   Demo-Schlüssel nur der ersten Bekanntschaft dient. Keine Aussage über
#   fehlende Abdeckung.
# - `/stocks?symbol=SAP` → **200**, und SAP SE steht mit europäischen
#   Handelsplätzen im Verzeichnis. Der Anbieter kennt die Werte also.
# - Finnhub: 401 ohne Schlüssel, sonst keine Aussage möglich.
#
# Twelve Data ist in diesem Projekt bereits als Kursanbieter vorgesehen
# (`lib/providers/twelvedata.ts`, Secret `TWELVEDATA_API_KEY`). Ein Schlüssel
# würde damit zwei Zwecken dienen: bessere Kurse und die fehlenden
# Meldetermine.
#
# Was ein Schlüssel nicht beantwortet, solange keiner hinterlegt ist: ob der
# kostenlose Tarif den Endpunkt `/earnings` überhaupt freischaltet und wie
# viele Abfragen je Minute er zulässt. Beides zeigt sich beim ersten Lauf.

on:
  workflow_dispatch:

jobs:
  abklopfen:
    name: Ist ein Twelve-Data-Schlüssel hinterlegt?
    runs-on: ubuntu-latest
    steps:
      - name: Nachsehen, ohne etwas zu verraten
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          # Ausgegeben wird ausschließlich ja oder nein und die Länge. Ein
          # Protokoll eines Workflows ist öffentlich lesbar; der Schlüssel
          # selbst hat darin nichts zu suchen.
          if [ -n "$TWELVEDATA_API_KEY" ]; then
            echo "Schlüssel hinterlegt: ja (${#TWELVEDATA_API_KEY} Zeichen)"
          else
            echo "Schlüssel hinterlegt: nein"
          fi
