name: Ausgabe-Wächter

# Schlägt Alarm, wenn die Ausgabe des Tages fehlt.
#
# ## Warum es das braucht
#
# Der teuerste Fehler dieses Projekts ist nicht der rote Lauf, sondern der
# stille. Am 4. und 5. August 2026 hat die Nachrichten-Routine um 03:33 UTC
# gefeuert und **nichts** angelegt – ohne Fehler, ohne Mail, ohne Eintrag.
# Aufgefallen ist es beide Male dem Betreiber, Stunden später, weil auf dem
# Telefon die Meldungen von gestern standen.
#
# Nachgezählt am 5. August: Von den fünf Ausgaben zwischen dem 31. Juli und dem
# 4. August kam **keine einzige** aus der Routine. Alle fünf entstanden in einer
# Sitzung von Hand und wurden über einen Pull Request gemergt. Die Automatik
# lief, sie lieferte nur nichts – und niemand erfuhr davon.
#
# Dieser Workflow macht daraus einen roten Lauf. Ein roter Lauf schickt eine
# Mail, und die kommt an: Genau über diesen Kanal hat der Betreiber die
# Paketbau-Fehler bemerkt.
#
# ## Er wacht über beides
#
# Die Zusage lautet 6:00 Uhr deutscher Zeit – für die Nachrichten **und** für
# die Podcastfolge. Also prüft er beides, aber auf verschiedene Weise:
#
#   - **Nachrichten:** ist die Ausgabe da? Um 03:11 UTC muss sie stehen.
#   - **Podcast:** hat heute überhaupt ein Lauf begonnen? Fertig ist die Folge
#     erst gegen 03:36; wer um 03:11 die MP3 verlangt, meldet einen Ausfall,
#     der keiner ist.
#
# Ein *abgebrochener* Lauf meldet sich selbst per Mail. Beide Prüfungen hier
# gelten dem stillen Fall – dem Lauf, den GitHub verworfen hat und über den
# es deshalb nichts zu melden gibt.
#
# ## Was er nicht kann
#
# Er schreibt keine Artikel und vertont nichts. Er sagt nur, dass etwas fehlt –
# früh genug, um den Tag noch zu retten, statt am Abend festzustellen, dass die
# Website seit dem Morgen alt aussieht.

on:
  schedule:
    # 03:11 UTC – **5:11 Uhr deutscher Sommerzeit, also vor der Frist.**
    #
    # Das ist der Sinn der Uhrzeit: Ein Alarm um 6:11 hätte gemeldet, dass
    # die Zusage schon gebrochen ist. Um 5:11 bleiben knapp fünfzig Minuten,
    # um von Hand nachzuziehen.
    #
    # Im Regelfall ist längst alles fertig: Der erste Nachrichtenlauf startet
    # um 01:57 und ist gegen 02:25 durch. Der dritte Anlauf um 02:47 läuft
    # aber nur, wenn die ersten beiden ausfielen – und der kann um 03:11 noch
    # arbeiten. Deshalb fragt dieser Wächter nach, ob gerade ein Lauf im Gange
    # ist, bevor er rot wird: Was noch entsteht, ist kein Ausfall.
    #
    # Dass die Ausgabe ganz **fehlt**, sollte seit `nachrichten-aus-bestand.ts`
    # nicht mehr vorkommen: Der Notbehelf rechnet notfalls eine aus dem eigenen
    # Datenbestand. Genau deshalb reicht „ist sie da?" nicht mehr als Frage –
    # seit dem 9. August prüft dieser Lauf auch, **woher** sie kommt, und wird
    # rot, wenn es der Notbehelf war. Die Begründung steht beim Schritt
    # „Kommt die Ausgabe aus Recherche?".
    #
    # Zur Zeitumstellung: im Winter `11 4`. Die Routine „Zeitumstellung"
    # zieht alle Zeitpläne dieses Projekts gemeinsam um eine Stunde nach.
    - cron: '11 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stichtag JJJJ-MM-TT (leer = heute)'
        required: false
        type: string

concurrency:
  group: ausgabe-waechter
  cancel-in-progress: false

jobs:
  pruefen:
    name: Steht die Ausgabe von heute?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Zum Nachsehen, ob Nachrichten- und Podcastlauf heute stattgefunden
      # haben. Ohne das Recht bliebe nur die Frage „ist das Ergebnis da?" –
      # und nicht die wichtigere: „hat es überhaupt jemand versucht?"
      actions: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Ausgabe im Repository
        id: repo
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag=$(date -u +%Y-%m-%d)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Stichtag: $tag"

          fehlt=""

          # 1. Die Tagesausgabe als Datei.
          if [ -f "data/editions/$tag.ts" ]; then
            echo "  ✓ data/editions/$tag.ts vorhanden"
          else
            fehlt="$fehlt Ausgabendatei"
            echo "  ✗ data/editions/$tag.ts FEHLT"
          fi

          # 2. Eingetragen in das Register – beides, Import und Array.
          kurz="edition$(echo "$tag" | tr -d '-')"
          if grep -q "$kurz" data/editions/index.ts; then
            echo "  ✓ $kurz steht in data/editions/index.ts"
          else
            fehlt="$fehlt Registereintrag"
            echo "  ✗ $kurz fehlt in data/editions/index.ts"
          fi

          # 3. Mindestens ein Artikel mit dem heutigen Erscheinungstag.
          #
          # Die Ausgabe allein reicht nicht: Der Tagesüberblick und die
          # Artikelliste sind zwei Bestände, und schon einmal war nur einer
          # von beiden gepflegt.
          anzahl=$(grep -c "publishedAt: '$tag" data/news.ts || true)
          if [ "$anzahl" -gt 0 ]; then
            echo "  ✓ $anzahl Artikel mit publishedAt vom $tag"
          else
            fehlt="$fehlt Artikel"
            echo "  ✗ kein Artikel mit publishedAt vom $tag"
          fi

          echo "fehlt=$fehlt" >> "$GITHUB_OUTPUT"

      # Läuft gerade noch ein Nachrichtenlauf? Dann ist eine fehlende Ausgabe
      # kein Ausfall, sondern eine Baustelle. Der dritte Anlauf um 02:47 kann
      # um 03:11 durchaus noch arbeiten.
      - name: Ist noch etwas im Gange?
        id: laeuft
        if: inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          offen=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/nachrichten.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length' \
            2>/dev/null || echo 0)
          case "$offen" in ''|*[!0-9]*) offen=0 ;; esac
          echo "Nachrichtenläufe im Gange: $offen"
          echo "offen=$offen" >> "$GITHUB_OUTPUT"

      # Der Podcast. Die Zusage lautet 6:00 Uhr für die Folge genauso wie für
      # die Nachrichten – also muss auch ihr Ausfall auffallen.
      #
      # **Gefragt wird das Register, nicht die Laufliste.** Bis zum 11. August
      # 2026 stand hier „hat heute überhaupt ein Lauf begonnen?" – mit der
      # Begründung, um 03:11 UTC laufe die Folge noch (Start 02:53, fertig
      # gegen 03:36). Seit demselben Tag stößt `nachrichten.yml` sie an,
      # sobald die Ausgabe steht; im Regelfall ist sie gegen 02:00 UTC fertig,
      # gut eine Stunde vor dieser Prüfung.
      #
      # Damit lässt sich das Ergebnis prüfen statt der Absicht – und das ist
      # dieselbe Lehre wie überall sonst hier: Wer wissen will, ob die Folge
      # da ist, fragt das Register, nicht die Laufliste. Ein Lauf, der
      # stattgefunden und nichts hinterlassen hat, ist kein Ergebnis.
      #
      # Ein noch laufender Lauf ist kein Fehler, sondern knapp: Er bekommt
      # eine Notiz und keine Fehlermeldung.
      #
      # **Kein Wochenend-Riegel.** Hier stand einer, und er war seit dem
      # 9. August 2026 falsch: Die Folge erscheint sieben Tage die Woche.
      # Ausgerechnet an den Tagen, an denen am wenigsten sonst läuft, hätte
      # der Wächter geschwiegen.
      - name: Steht die Folge von heute?
        id: podcast
        if: inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heute=$(date -u +%Y-%m-%d)

          # Das Register von **jetzt**, nicht aus dem Checkout: Der Lauf hat
          # womöglich vor zwanzig Minuten eingetragen. Derselbe Fehler hat am
          # 10. August zwei Videos desselben Tages erzeugt.
          git fetch origin main --depth 1 -q 2>/dev/null || true
          if git show origin/main:data/podcast-eigener-feed.json 2>/dev/null \
               | grep -q "\"datum\": \"$heute\""; then
            echo "  ✓ die Folge vom $heute steht im Register"
            exit 0
          fi

          laufend=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/podcast-erzeugen.yml/runs?created=$heute&per_page=30" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length' \
            2>/dev/null || echo "unbekannt")

          # Alles, was keine Zahl ist, heißt „nicht abrufbar". Ein Wächter, der
          # an seiner eigenen Abfrage scheitert, meldet einen Ausfall, den es
          # nicht gibt – und das ist schlimmer als eine ausgelassene Prüfung.
          case "$laufend" in
            ''|*[!0-9]*)
              echo "::notice::Die Laufliste war nicht abrufbar ($laufend) – der Podcast wird diesmal nicht bewertet."
              exit 0
              ;;
          esac

          if [ "$laufend" -gt 0 ]; then
            echo "::notice::Die Folge vom $heute ist noch nicht eingetragen, aber $laufend Lauf/Läufe sind unterwegs."
            echo "  Das ist knapp: Bis zur Frist um 6:00 deutscher Zeit bleiben rund 49 Minuten."
            exit 0
          fi

          echo "  ✗ die Folge vom $heute fehlt im Register, und es läuft nichts mehr"
          echo "fehlt=ja" >> "$GITHUB_OUTPUT"

      # Steht da eine Ausgabe – oder steht da der Notbehelf?
      #
      # Der Anlass ist der 9. August 2026. Die Ausgabe war vollständig, der
      # Wächter wäre grün geblieben, und trotzdem war sie falsch: Sie kam
      # aus `nachrichten-aus-bestand.ts`, weil der Agent an einer zu
      # knappen Zugobergrenze gescheitert war. Auf der Website standen
      # aufbereitete eigene Kurszahlen statt Meldungen. Aufgefallen ist es
      # dem Betreiber, nicht der Technik – zum wiederholten Mal.
      #
      # `nachrichten.yml` schreibt beim Rückfall zwar ein `::warning::`.
      # Eine Warnung in einem grünen Lauf ist aber genau der stille Fehler,
      # den dieser Workflow abschaffen soll: Sie schickt keine Mail.
      #
      # **Woran der Notbehelf zu erkennen ist:** an seinen Quellen. Er kann
      # nur auf den eigenen Bestand verweisen. Nachgezählt über die
      # Ausgaben vom 1. bis 9. August, Anteil der Verweise, die **nicht**
      # auf iminvests.de zeigen:
      #
      #     recherchiert   8/8  4/5  8/8  9/9  8/8  7/7  10/10  7/7
      #     Notbehelf                                          1/6
      #
      # 80 Prozent im dünnsten recherchierten Fall gegen 17 im Notbehelf.
      # Die Hälfte liegt sauber dazwischen und ist deshalb die Grenze.
      - name: Kommt die Ausgabe aus Recherche?
        id: herkunft
        run: |
          tag="${{ steps.repo.outputs.tag }}"
          datei="data/editions/$tag.ts"
          [ -f "$datei" ] || exit 0

          gesamt=$(grep -c "url: '" "$datei" || true)
          [ "$gesamt" -gt 0 ] || exit 0
          extern=$(grep "url: '" "$datei" | grep -vc "iminvests.de" || true)

          echo "  $extern von $gesamt Quellen zeigen nach außen."

          # Ganzzahlig gerechnet: extern * 2 < gesamt heißt „weniger als die
          # Hälfte". Kein `bc` nötig, und keine Rundung, über die man
          # nachdenken muss.
          if [ $((extern * 2)) -lt "$gesamt" ]; then
            echo "notbehelf=ja" >> "$GITHUB_OUTPUT"
            echo "  ✗ Das ist der Notbehelf aus dem eigenen Datenbestand."
          else
            echo "  ✓ Recherchierte Ausgabe."
          fi

      - name: Ausgabe auf der Website
        id: live
        continue-on-error: true
        run: |
          tag="${{ steps.repo.outputs.tag }}"
          URL="https://iminvests.de/news/tag/$tag/"
          UA="Mozilla/5.0 (compatible; IM-Invests-Waechter/1.0)"

          # Der Hoster weist Rechenzentrums-Adressen zeitweise ab. Ein
          # Fehlschlag hier ist deshalb kein Beweis – deshalb
          # `continue-on-error` und ein eigener Ausgabewert.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A "$UA" --max-time 25 "$URL" || echo "000")
          echo "  $URL → $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Ergebnis
        run: |
          tag="${{ steps.repo.outputs.tag }}"
          fehlt="${{ steps.repo.outputs.fehlt }}"
          code="${{ steps.live.outputs.code }}"
          offen="${{ steps.laeuft.outputs.offen }}"
          podcast="${{ steps.podcast.outputs.fehlt }}"
          notbehelf="${{ steps.herkunft.outputs.notbehelf }}"

          schlecht=""

          # Der Notbehelf kippt den Lauf für sich allein. Eine vollständige
          # Ausgabe aus eigenen Kurszahlen ist kein Ersatz für Nachrichten –
          # sie sagt, *dass* sich etwas bewegt hat, nie *warum*. Der
          # Betreiber will Meldungen; dass er stattdessen Zahlen bekommt,
          # muss er am selben Morgen erfahren und nicht beim Lesen.
          if [ "$notbehelf" = "ja" ]; then
            echo "::error::Die Ausgabe vom $tag kommt aus dem eigenen Datenbestand, nicht aus Recherche."
            echo "  Sie ist vollständig und wird ausgeliefert – aber sie enthält"
            echo "  aufbereitete Kurszahlen statt Meldungen und nennt keine Ursachen."
            echo ""
            echo "  Der Weg dahin führt über drei Stufen, und die ersten beiden"
            echo "  haben nicht getragen:"
            echo "    1. Entwurf vom Agenten (nachrichten-agent.yml) – im Abo"
            echo "    2. Modell über die Schnittstelle – braucht ANTHROPIC_API_KEY"
            echo "    3. Bestand – dieser hier"
            echo ""
            echo "  Nachsehen: Actions > 'Nachrichten – Entwurf vom Agenten',"
            echo "  Schritt 'Warum ist der Agent gescheitert?'. Er nennt"
            echo "  Statuscode, Fehlerart und Zahl der Züge."
            echo ""
            schlecht="ja"
          fi

          # Der Podcast kippt den Lauf für sich allein: Ohne Lauf gibt es
          # heute keine Folge, auch wenn die Nachrichten tadellos stehen.
          if [ "$podcast" = "ja" ]; then
            echo "::error::Die Folge von heute steht nicht im Register, und es läuft kein Lauf mehr."
            echo "  Von Hand: Actions > Podcastfolge erzeugen > Run workflow."
            echo "  Gemessen braucht sie rund 37 Minuten von Hand bis online."
            echo ""
            schlecht="ja"
          fi

          if [ -z "$fehlt" ]; then
            echo "Die Ausgabe vom $tag steht im Repository."
            case "$code" in
              # „Nichts zu tun" nur, wenn wirklich nichts zu tun ist. Bei der
              # Probe am 9. August stand der Satz **unter** der Meldung, dass
              # die Ausgabe aus dem Notbehelf kommt – ein Alarm, der sich
              # selbst widerspricht, wird nicht ernst genommen.
              200) if [ -n "$schlecht" ]; then
                     echo "Und sie wird ausgeliefert – siehe die Beanstandung oben."
                   else
                     echo "Und sie wird ausgeliefert. Nichts zu tun."
                   fi ;;
              000) echo "::notice::Die Website war von hier aus nicht erreichbar (der Hoster weist Läufer-Adressen zeitweise ab). Das Repository stimmt." ;;
              *)   echo "::warning::Die Ausgabe steht im Repository, aber $tag antwortet mit $code – vermutlich ist der Paketbau noch nicht durchgelaufen." ;;
            esac
            [ -z "$schlecht" ] || exit 1
            exit 0
          fi

          # Was gerade entsteht, ist kein Ausfall. Ein Warnhinweis genügt –
          # er steht im Protokoll, falls der Lauf danach doch scheitert.
          if [ "${offen:-0}" -gt 0 ]; then
            echo "::warning::Die Ausgabe vom $tag fehlt noch ($fehlt ), aber es läuft gerade ein Nachrichtenlauf. Kein Alarm – in zwanzig Minuten sollte sie stehen."
            [ -z "$schlecht" ] || exit 1
            exit 0
          fi

          echo "::error::Die Ausgabe vom $tag ist unvollständig oder fehlt ganz. Es fehlt:$fehlt"
          echo ""
          echo "Was das heißt: Alle drei Nachrichtenläufe (01:57, 02:17, 02:47 UTC)"
          echo "sind durch und haben kein Ergebnis hinterlassen – und es läuft auch"
          echo "keiner mehr. Auf der Website stehen die Meldungen von gestern."
          echo ""
          echo "Es ist 5:11 Uhr deutscher Zeit. Bis zur Zusage bleiben 49 Minuten."
          echo ""
          echo "Erste Schritte:"
          echo "  1. Hat 'Quellen sammeln' heute einen Lauf? Ohne ihn hat der"
          echo "     Agent keine gelesene Quelle."
          echo "     Von Hand: Actions > Quellen sammeln > Run workflow."
          echo "  2. Steht auf dem Zweig 'quellen-heute' eine Datei von heute?"
          echo "     git show origin/quellen-heute:quellen.txt | head -1"
          echo "  3. 'Nachrichten' von Hand starten. Fehlt Schlüssel oder Quelle,"
          echo "     rechnet er die Ausgabe aus dem eigenen Bestand – schmaler,"
          echo "     aber nie nichts."
          exit 1
