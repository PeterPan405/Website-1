name: Node-Paket bauen

# Erzeugt ein lauffähiges Node-Paket zum Herunterladen und Hochladen über den
# Dateimanager.
#
# Warum dieser Weg: Der statische Export bestand aus rund 1.500 Einzeldateien.
# Deren Übertragung per FTP hat Hostinger nach drei Läufen gesperrt – die
# Verbindung zum Port 21 kommt seither nicht mehr zustande. Der Upload einer
# einzelnen Datei über den Dateimanager im Browser funktioniert dagegen
# nachweislich.
#
# Das Paket enthält alles, was der Server braucht, und ist ohne `npm install`
# startbar – auf Webhosting mit knappem Speicher ist das der entscheidende
# Unterschied.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  paket:
    name: Paket erzeugen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Bauen
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      # Next legt den eigenständigen Server unter .next/standalone ab, kopiert
      # dorthin aber absichtlich nicht die statischen Dateien und den
      # public-Ordner – die müssen daneben liegen, sonst fehlen Stylesheet und
      # Bilder. Genau dieser Schritt wird gern vergessen; das Ergebnis ist eine
      # Seite mit Inhalt, aber ohne Gestaltung.
      - name: Paket zusammenstellen
        run: |
          mkdir -p paket
          cp -r .next/standalone/. paket/
          mkdir -p paket/.next
          cp -r .next/static paket/.next/static
          cp -r public paket/public

          echo "=== Inhalt des Pakets ==="
          ls -la paket/
          echo ""
          echo "server.js vorhanden:  $(test -f paket/server.js && echo ja || echo NEIN)"
          echo "Stylesheets:          $(find paket/.next/static -name '*.css' | wc -l)"
          echo "Dateien insgesamt:    $(find paket -type f | wc -l)"
          echo "Größe:                $(du -sh paket | cut -f1)"

      # Prüft das Ergebnis, nicht die Absicht: Fehlt eines dieser Teile, wäre
      # das Paket unbrauchbar, und der Fehler fiele erst auf dem Server auf.
      - name: Paket prüfen
        run: |
          test -f paket/server.js || { echo "server.js fehlt"; exit 1; }
          test -d paket/.next/static || { echo ".next/static fehlt"; exit 1; }
          test -d paket/node_modules || { echo "node_modules fehlt"; exit 1; }
          css=$(find paket/.next/static -name '*.css' | wc -l)
          if [ "$css" -lt 1 ]; then
            echo "Kein Stylesheet im Paket – die Seite käme ohne Formatierung heraus."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: node-paket
          path: paket
          include-hidden-files: true
          retention-days: 14
