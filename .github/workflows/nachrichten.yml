name: Nachrichten schreiben

# Die Tagesausgabe – auf einem Läufer, nicht in einer Sitzung.
#
# ## Warum dieser Workflow existiert
#
# Weil die Nachrichten-Routine zwischen dem 31. Juli und dem 5. August 2026 an
# **keinem einzigen Tag** eine Ausgabe erzeugt hat. Nachgezählt für jede der
# fünf Ausgaben dieser Woche: Alle entstanden in einer interaktiven Sitzung und
# wurden über einen Pull Request gemergt. Die Automatik feuerte jeden Morgen
# pünktlich um 03:30 UTC, lieferte nichts, und niemand erfuhr davon.
#
# Der Grund liegt außerhalb dieses Repositorys und ließ sich von hier aus nicht
# beheben: Die Sitzung einer Routine bekommt eine feste Werkzeugliste ohne
# `mcp__github__*`, erreicht damit weder eine Nachrichtenseite (Egress-Proxy,
# 403) noch den Läufer, der es könnte – und ihre Protokolle sind nicht
# einsehbar. Was sich nicht diagnostizieren lässt, lässt sich nicht reparieren.
#
# Hier ist alles sichtbar: Der Läufer holt die Quellen, ruft das Modell, prüft
# das Ergebnis gegen dieselben Regeln wie der Build und schreibt die Dateien.
# Jeder Schritt steht im Protokoll, jeder Fehlschlag ist ein roter Lauf, und
# ein roter Lauf schickt eine Mail – über genau diesen Kanal sind die
# Paketbau-Fehler aufgefallen.
#
# ## Was gebraucht wird
#
# Ein Repository-Secret **`ANTHROPIC_API_KEY`**. Ohne ihn bricht der Lauf mit
# einer Meldung ab, die sagt, wo er hingehört. Der Schlüssel gehört nie in
# einen Chat, nie in eine Datei und nie in ein Protokoll – Workflow-Protokolle
# dieses Repositorys sind für jeden lesbar, der Zugriff hat.
#
# ## Was er kostet
#
# Ein Lauf schickt die Quellenübersichten hinein (rund 60.000 Zeichen) und
# bekommt eine Ausgabe heraus. Das sind Cent-Beträge am Tag – die Alternative
# war eine Stunde von Hand, jeden Morgen.

on:
  schedule:
    # 03:30 UTC – 5:30 Uhr deutscher Sommerzeit, die vom Betreiber gesetzte
    # Zeit. Im Winter 04:30 UTC; die Routine „Zeitumstellung" zieht das nach.
    #
    # Der Sammellauf liegt um 03:07 und 03:17 davor, hat also zwei
    # Gelegenheiten gehabt. Braucht dieser Lauf trotzdem eine frische Datei,
    # holt er sie sich unten selbst.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      stichtag:
        description: 'Datum JJJJ-MM-TT (leer = heute)'
        required: false
        type: string
      modell:
        description: 'Modell-Kennung (leer = Voreinstellung)'
        required: false
        type: string

# Zwei Läufe gleichzeitig schrieben zwei Ausgaben zum selben Datum – und das
# bricht den Build ab. Der laufende wird nicht abgebrochen: Er ist womöglich
# schon beim Schreiben.
concurrency:
  group: nachrichten
  cancel-in-progress: false

jobs:
  schreiben:
    name: Ausgabe erzeugen und veröffentlichen
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Zum Anstoßen des Paketbaus am Ende – ein Push mit dem GITHUB_TOKEN
      # löst keinen Workflow aus.
      actions: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Steht die Ausgabe schon?
        id: vorhanden
        run: |
          tag="${{ inputs.stichtag }}"
          [ -n "$tag" ] || tag=$(date -u +%Y-%m-%d)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ -f "data/editions/$tag.ts" ]; then
            echo "schon=ja" >> "$GITHUB_OUTPUT"
            echo "Die Ausgabe vom $tag steht bereits – dieser Lauf hört hier auf."
          else
            echo "schon=nein" >> "$GITHUB_OUTPUT"
            echo "Für den $tag gibt es noch keine Ausgabe."
          fi

      # Die Quellen. Erst der Zweig, den `quellen-sammeln.yml` schreibt; ist er
      # nicht von heute, holt dieser Lauf die Übersichten selbst.
      #
      # Damit hängt die Ausgabe an keiner Vorbedingung mehr. Am 5. August fiel
      # der Sammellauf aus, die Routine sah in eine Datei vom Vortag und legte
      # nichts an – dieser Fall ist hier keiner mehr.
      - name: Quellen besorgen
        if: steps.vorhanden.outputs.schon == 'nein'
        env:
          TAG: ${{ steps.vorhanden.outputs.tag }}
        run: |
          if git fetch origin quellen-heute --depth 1 -q 2>/dev/null; then
            git show origin/quellen-heute:quellen.txt > quellen.txt 2>/dev/null || true
          fi

          if [ -s quellen.txt ] && head -1 quellen.txt | grep -q "$TAG"; then
            echo "Quellendatei vom Sammellauf: $(head -1 quellen.txt)"
          else
            echo "Keine frische Quellendatei – dieser Lauf holt die Übersichten selbst."
            gh workflow run quellen-sammeln.yml --repo "${{ github.repository }}" --ref main || true
            for versuch in 1 2 3 4 5 6; do
              sleep 20
              git fetch origin quellen-heute --depth 1 -q 2>/dev/null || true
              git show origin/quellen-heute:quellen.txt > quellen.txt 2>/dev/null || true
              if [ -s quellen.txt ] && head -1 quellen.txt | grep -q "$TAG"; then break; fi
              echo "  Versuch $versuch: noch nichts."
            done
          fi

          if [ ! -s quellen.txt ] || ! head -1 quellen.txt | grep -q "$TAG"; then
            echo "::error::Es liegt keine Quellendatei von heute vor. Ohne gelesene Quelle wird keine Ausgabe geschrieben."
            exit 1
          fi
          tail -1 quellen.txt

      - name: Ausgabe schreiben
        if: steps.vorhanden.outputs.schon == 'nein'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUELLENDATEI: quellen.txt
          STICHTAG: ${{ steps.vorhanden.outputs.tag }}
          NACHRICHTEN_MODELL: ${{ inputs.modell }}
        run: node --experimental-strip-types scripts/nachrichten-erzeugen.ts

      # Dieselbe Kette wie im Paketbau. Schlägt eine Prüfung fehl, wird nichts
      # veröffentlicht – lieber keine Ausgabe als eine, die den Build bricht.
      - name: Formatieren und prüfen
        if: steps.vorhanden.outputs.schon == 'nein'
        run: |
          npx prettier --write data/ >/dev/null
          npx tsc --noEmit
          npm run lint
          npm test
          npm run build
          npm run pruefen
          npm run format:check
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Auf main veröffentlichen
        if: steps.vorhanden.outputs.schon == 'nein'
        id: veroeffentlichen
        run: |
          rm -f quellen.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Nachrichten: Ausgabe vom ${{ steps.vorhanden.outputs.tag }}"

          for versuch in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then
              echo "vorher=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
              echo "gepusht=ja" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push fehlgeschlagen, Versuch $versuch – neuer Anlauf in $((versuch * 5))s"
            sleep $((versuch * 5))
          done
          echo "::error::Push nach vier Versuchen fehlgeschlagen."
          exit 1

      # Ein Push mit dem GITHUB_TOKEN löst keinen Workflow aus – der Paketbau
      # wird deshalb ausdrücklich angestoßen. Siehe den Kopf von `kurse.yml`.
      - name: Veröffentlichung anstoßen
        if: steps.veroeffentlichen.outputs.gepusht == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run paket-bauen.yml \
            --repo "${{ github.repository }}" --ref main \
            -f vorher="${{ steps.veroeffentlichen.outputs.vorher }}" \
            -f paket=false
          echo "Der Paketbau ist angefordert – die Ausgabe geht damit auf den Webspace."
