name: Nachrichten schreiben

# Die Tagesausgabe – auf einem Läufer, nicht in einer Sitzung.
#
# ## Warum dieser Workflow der Regelweg ist und nicht die Rückfallebene
#
# Bis zum 6. August 2026 stand er hinter der Sitzungs-Routine, um Kosten zu
# sparen. Dann kam die Zusage dazu: **Die Ausgabe steht um 6:00 deutscher
# Zeit auf der Website** – also um 04:00 UTC. Rückwärts gerechnet passt die
# Routine da nicht mehr hinein: Sie braucht 45 bis 70 Minuten, dieser
# Workflow 20.
#
# Alle Zeiten in **deutscher** Zeit – die Zusage ist in deutscher Zeit
# gegeben. Die Crons darunter stehen in UTC.
#
#   02:09 / 02:29  `quellen-sammeln.yml` – die Ticker-Übersichten des Morgens
#   02:33          `nachrichten-agent.yml` liest sie, schreibt den **Entwurf**
#                  und stößt diesen Workflow sofort an
#   03:13          dieser Workflow als Cron, falls der Anstoß ausblieb
#   03:43 / 04:13  zweiter und dritter Anlauf
#   04:47          vierter – der letzte, der 6:00 noch schafft
#   ab 03:00       `kurse.yml` stößt an, falls alle ausfielen
#   05:11          `ausgabe-waechter.yml` – **vor** der Frist
#
# Sobald die Ausgabe steht, stößt der letzte Schritt dieses Workflows den
# Podcast an. Er wartet nicht auf eine eigene Uhr; warum, steht dort.
#
# ## Die Arbeitsteilung, auf die es ankommt
#
# **Die Sitzung schreibt, der Läufer veröffentlicht.**
#
# Aus einer Ticker-Zeile einen Artikel zu machen – den Lehrwinkel wählen,
# selbst formulieren, die Begründung weglassen, die in der Meldung nicht
# steht – ist Spracharbeit. Sie lässt sich nicht rechnen; dafür braucht es
# ein Modell, das die 100.000 Zeichen der Quellendatei liest.
#
# Alles danach ist mechanisch: Längen prüfen, Dateien schreiben, bauen,
# übertragen. Genau das kann ein Läufer besser, und zwar sichtbar – jeder
# Schritt steht im Protokoll.
#
# Bis zum 6. August 2026 sollte die Sitzung beides tun, von der Recherche bis
# zum Push auf main. An sieben Tagen in Folge kam nichts dabei heraus, und wo
# es klemmte, war nicht feststellbar: Sitzungsprotokolle sind nicht einsehbar.
# Jetzt legt sie nur noch eine JSON-Datei auf dem Zweig `nachrichten-entwurf`
# ab. Das ist eine Aufgabe von zwanzig Minuten statt siebzig, und wenn sie
# misslingt, sieht man es hier.
#
# ## Was der Schlüssel daran ändert
#
# Er ist der **zweite** Weg zum selben Ergebnis: Fehlt der Entwurf, liest der
# Läufer die Quellendatei selbst und ruft das Modell über die Schnittstelle
# (rund 0,20 $). Fehlt auch der Schlüssel, entsteht **keine Ausgabe** und der
# Lauf wird rot.
#
# Bis zum 11. August 2026 sprang hier ein Notbehelf aus dem eigenen
# Kursbestand ein. Er ist abgeschafft: Was er lieferte, waren aufbereitete
# eigene Zahlen, und als Nachrichtenseite gelesen war das eine Enttäuschung –
# die obendrein den Ausfall verdeckte. Besser keine Nachrichten als solche.
#
# ## Warum nicht ein Termin genügt
#
# **GitHub verwirft geplante Läufe.** Am 6. August 2026 nachgezählt, über alle
# `schedule`-Termine des Tages: Genau einer wurde ausgeführt – der Kursabruf
# um 04:24. Dieser Workflow hatte an dem Morgen null Läufe, nicht einen
# gescheiterten. Ein einzelner Termin ist damit keine Zusage.
#
# Und die Routine ist auch keine: Sie hat zwischen dem 31. Juli und dem
# 5. August 2026 an **keinem einzigen Tag** eine Ausgabe erzeugt. Nachgezählt für jede der fünf
# Ausgaben dieser Woche: Alle entstanden in einer interaktiven Sitzung und
# wurden über einen Pull Request gemergt. Die Automatik feuerte jeden Morgen
# pünktlich, lieferte nichts, und niemand erfuhr davon.
#
# Ein Teil davon ist inzwischen erklärt und behoben – am 5. August fiel der
# Sammellauf aus, die Routine sah in eine Quellendatei vom Vortag. Der Rest ist
# nicht diagnostizierbar: Die Sitzung einer Routine bekommt eine feste
# Werkzeugliste ohne `mcp__github__*`, und ihre Protokolle sind nicht einsehbar.
#
# Hier dagegen ist alles sichtbar: Der Läufer holt die Quellen, ruft das
# Modell, prüft das Ergebnis gegen dieselben Regeln wie der Build und schreibt
# die Dateien. Jeder Schritt steht im Protokoll, jeder Fehlschlag ist ein roter
# Lauf, und ein roter Lauf schickt eine Mail.
#
# ## Was gebraucht wird
#
# Nichts, was nicht schon da wäre. Das Repository-Secret
# **`ANTHROPIC_API_KEY`** ist eine Verbesserung, keine Bedingung: Ohne ihn
# läuft alles weiter, die Ausgabe wird nur schmaler.
#
# Ist er hinterlegt, gehört er nie in einen Chat, nie in eine Datei und nie in
# ein Protokoll – Workflow-Protokolle sind für jeden lesbar, der Zugriff hat.
#
# ## Was ein Lauf kostet
#
# Ohne Schlüssel: nichts. Mit Schlüssel und nur an den Tagen, an denen die
# Routine ausgefallen ist: rund 22.000 Tokens hinein (die Quellenübersichten),
# rund 14.000 hinaus (acht Artikel plus Ausgabe) – mit Sonnet 5 etwa 0,20 $,
# mit Opus 5 etwa 0,50 $. Voreingestellt ist Sonnet; das Feld `modell` unten
# stellt es je Lauf um. Die tatsächlichen Zahlen stehen nach jedem Aufruf im
# Protokoll – das Skript rechnet sie aus, statt sie schätzen zu lassen.

on:
  schedule:
    # **Vier Anläufe, und keiner davon ist der Regelweg.**
    #
    # Der Regelweg ist der Anstoß aus `nachrichten-agent.yml`, sobald der
    # Entwurf steht – siehe den Kopf. Diese Termine greifen, wenn er
    # ausbleibt.
    #
    # Warum vier: GitHub verwirft geplante Läufe. Am 6. August 2026 wurde von
    # allen Terminen des Tages **genau einer** ausgeführt; am 11. August kamen
    # sie zwei Stunden zu spät. Ein einzelner Termin ist damit keine Zusage.
    #
    # Gerechnet gegen die Frist: Der Lauf braucht 20 Minuten, der Paketbau
    # samt Übertragung 10, die Folge danach 37. Der letzte Start, der 6:00
    # deutscher Zeit noch hält, ist damit 04:47 deutscher Zeit – der vierte
    # Termin.
    #
    # Die zusätzlichen Läufe kosten fast nichts: Steht die Ausgabe schon,
    # hört der Lauf nach vierzig Sekunden auf, ohne das Modell zu fragen.
    #
    # Im Winter eine Stunde später; die Routine „Zeitumstellung" zieht nach.
    - cron: '13 1 * * *'
    - cron: '43 1 * * *'
    - cron: '13 2 * * *'
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      stichtag:
        description: 'Datum JJJJ-MM-TT (leer = heute)'
        required: false
        type: string
      modell:
        description: 'Modell-Kennung (leer = Voreinstellung)'
        required: false
        type: string
      probe:
        description: 'Nur prüfen – Quellen holen, Modell fragen, nichts schreiben'
        required: false
        default: false
        type: boolean

# Zwei Läufe gleichzeitig schrieben zwei Ausgaben zum selben Datum – und das
# bricht den Build ab. Der laufende wird nicht abgebrochen: Er ist womöglich
# schon beim Schreiben.
concurrency:
  group: nachrichten
  cancel-in-progress: false

jobs:
  schreiben:
    name: Ausgabe erzeugen und veröffentlichen
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Zum Anstoßen des Paketbaus am Ende – ein Push mit dem GITHUB_TOKEN
      # löst keinen Workflow aus.
      actions: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Steht die Ausgabe schon?
        id: vorhanden
        run: |
          tag="${{ inputs.stichtag }}"
          [ -n "$tag" ] || tag=$(date -u +%Y-%m-%d)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          echo "ersetzen=nein" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.probe }}" = "true" ]; then
            echo "schon=nein" >> "$GITHUB_OUTPUT"
            echo "Probe – es wird nichts geschrieben, auch wenn die Ausgabe schon steht."
          elif [ -f "data/editions/$tag.ts" ]; then
            # **„Steht schon eine?" reicht als Frage nicht mehr** – seit der
            # Notbehelf aus dem Kursbestand immer eine liefert, muss hier
            # stehen, *was* steht. Am 9. August 2026 kippte die Reihenfolge
            # der verspäteten Läufe: Der Notbehelf kam vor dem Agenten, der
            # Agent legte seinen recherchierten Entwurf daneben, und dieser
            # Riegel ließ ihn liegen. Auf der Website standen den ganzen Tag
            # aufbereitete eigene Zahlen.
            #
            # Herkunft mit demselben Maßstab wie im Wächter: Weniger als die
            # Hälfte externer Quellen heißt Notbehelf.
            datei="data/editions/$tag.ts"
            gesamt=$(grep -c "url: '" "$datei" || true)
            extern=$(grep "url: '" "$datei" | grep -vc "iminvests.de" || true)

            if [ "${gesamt:-0}" -eq 0 ] || [ $((extern * 2)) -ge "$gesamt" ]; then
              echo "schon=ja" >> "$GITHUB_OUTPUT"
              echo "Die Ausgabe vom $tag steht bereits und ist recherchiert – Ende hier."
              echo "Das Modell wird nicht gefragt. Dieser Lauf kostet nichts." \
                >> "$GITHUB_STEP_SUMMARY"
            elif node -e '
                  const feed = require("./data/podcast-eigener-feed.json")
                  process.exit(feed.folgen.some((f) => f.datum === process.argv[1]) ? 0 : 1)
                ' "$tag" 2>/dev/null; then
              # Der Podcast hat den Notbehelf bereits vertont. Jetzt zu
              # ersetzen hieße: Die Website erzählt andere Nachrichten als
              # die Folge des Tages – schlimmer als der Notbehelf selbst.
              echo "schon=ja" >> "$GITHUB_OUTPUT"
              echo "::warning::Für den $tag steht der Notbehelf ($extern von $gesamt Quellen extern),"
              echo "  aber der Podcast hat ihn bereits vertont. Ersetzen würde Website und"
              echo "  Folge auseinanderreißen – es bleibt beim Notbehelf."
            elif git fetch origin nachrichten-entwurf --depth 1 -q 2>/dev/null &&
                 git show origin/nachrichten-entwurf:entwurf.json \
                   > "${RUNNER_TEMP:-/tmp}/entwurf-probe.json" 2>/dev/null &&
                 [ "$(node -e "try{process.stdout.write(String(JSON.parse(require('fs').readFileSync('${RUNNER_TEMP:-/tmp}/entwurf-probe.json','utf8')).stichtag||''))}catch(e){}")" = "$tag" ]; then
              echo "schon=nein" >> "$GITHUB_OUTPUT"
              echo "ersetzen=ja" >> "$GITHUB_OUTPUT"
              echo "Für den $tag steht der Notbehelf ($extern von $gesamt Quellen extern),"
              echo "und ein recherchierter Entwurf von heute liegt bereit."
              echo "Der Notbehelf wird durch die recherchierte Ausgabe ersetzt." \
                >> "$GITHUB_STEP_SUMMARY"
            else
              echo "schon=ja" >> "$GITHUB_OUTPUT"
              echo "::warning::Für den $tag steht der Notbehelf, aber es liegt kein"
              echo "  Entwurf von heute vor – nichts, womit sich Besseres schreiben ließe."
            fi
          else
            echo "schon=nein" >> "$GITHUB_OUTPUT"
            echo "Für den $tag gibt es noch keine Ausgabe."
            echo "Beide kostenlosen Wege haben nichts geliefert – dieser Lauf fragt das Modell." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Die Quellen. Erst der Zweig, den `quellen-sammeln.yml` schreibt; ist er
      # nicht von heute, holt dieser Lauf die Übersichten selbst.
      #
      # Damit hängt die Ausgabe an keiner Vorbedingung mehr. Am 5. August fiel
      # der Sammellauf aus, die Routine sah in eine Datei vom Vortag und legte
      # nichts an – dieser Fall ist hier keiner mehr.
      - name: Quellen besorgen
        id: quellen
        if: steps.vorhanden.outputs.schon == 'nein'
        env:
          TAG: ${{ steps.vorhanden.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git fetch origin quellen-heute --depth 1 -q 2>/dev/null; then
            git show origin/quellen-heute:quellen.txt > quellen.txt 2>/dev/null || true
          fi

          if [ -s quellen.txt ] && head -1 quellen.txt | grep -q "$TAG"; then
            echo "Quellendatei vom Sammellauf: $(head -1 quellen.txt)"
          else
            echo "Keine frische Quellendatei – dieser Lauf holt die Übersichten selbst."
            gh workflow run quellen-sammeln.yml --repo "${{ github.repository }}" --ref main || true
            for versuch in 1 2 3 4 5 6; do
              sleep 20
              git fetch origin quellen-heute --depth 1 -q 2>/dev/null || true
              git show origin/quellen-heute:quellen.txt > quellen.txt 2>/dev/null || true
              if [ -s quellen.txt ] && head -1 quellen.txt | grep -q "$TAG"; then break; fi
              echo "  Versuch $versuch: noch nichts."
            done
          fi

          # Kein Abbruch mehr. Eine fehlende Quellendatei heißt nur, dass das
          # Modell nichts zu lesen hätte – dann rechnet der Lauf die Ausgabe
          # unten aus dem eigenen Bestand. Bis zum 5. August war das ein
          # `exit 1`, und damit hing die ganze Zusage an einem Nebenlauf.
          if [ ! -s quellen.txt ] || ! head -1 quellen.txt | grep -q "$TAG"; then
            echo "::warning::Keine Quellendatei von heute – das Modell hätte nichts zu lesen."
            echo "frisch=nein" >> "$GITHUB_OUTPUT"
            rm -f quellen.txt
          else
            echo "frisch=ja" >> "$GITHUB_OUTPUT"
            tail -1 quellen.txt
          fi

      # **Die Rangfolge der Wege – beste zuerst.**
      #
      #   1. Ein Entwurf auf `nachrichten-entwurf` → eine recherchierte
      #      Ausgabe aus den Ticker-Meldungen des Morgens, geschrieben von der
      #      Routine um 02:27, **kostenlos**. Das ist der Regelfall und das,
      #      was auf dieser Website stehen soll.
      #   2. Kein Entwurf, aber ein `ANTHROPIC_API_KEY` → derselbe Text, nur
      #      auf dem Läufer erzeugt statt in einer Sitzung. Rund 0,20 $.
      #   3. Weder noch → **nichts.** Roter Lauf, keine Ausgabe.
      #
      # Bis zum 11. August 2026 gab es einen dritten Weg: eine Ausgabe aus dem
      # eigenen Kursbestand. Der Betreiber hat ihn abgeschafft – „besser keine
      # Nachrichten als solche Nachrichten". Die Begründung steht unten an der
      # Stelle, an der er stand.
      #
      # Beide Wege laufen durch dieselbe Prüfung in `nachrichten-erzeugen.ts`:
      # Längen, eindeutige Titel, gültige Themen und Symbole. Ein Entwurf, der
      # die Form verfehlt, wird nicht veröffentlicht, sondern fällt auf den
      # nächsten Weg zurück.
      # Der Notbehelf wird **zurückgenommen wie ein Commit**, nicht von Hand
      # zerpflückt. Seine Artikel stehen in drei Dateien (news.ts,
      # Ausgabendatei, Register), und alle drei stammen aus genau einem
      # Commit – `git revert` nimmt sie in einem Zug und vollständig heraus.
      # Ein eigenes Skript, das Artikel aus news.ts herausschneidet, wäre
      # eine zweite Stelle, an der die Struktur der Datei bekannt sein muss.
      #
      # Zwischen dem Notbehelf-Commit und jetzt schreibt nur der Kursabruf
      # auf main, und der fasst news.ts nicht an – der Revert ist konfliktfrei.
      # Falls doch nicht: abbrechen, nichts pushen, der rote Lauf sagt warum.
      - name: Notbehelf zurücknehmen
        if: steps.vorhanden.outputs.ersetzen == 'ja'
        run: |
          tag="${{ steps.vorhanden.outputs.tag }}"

          # checkout holt nur die Spitze; für die Datei-Historie braucht es
          # mehr Tiefe.
          git fetch origin main --deepen=100 -q 2>/dev/null || git fetch --unshallow -q 2>/dev/null || true

          sha=$(git log --diff-filter=A --format=%H -n 1 -- "data/editions/$tag.ts")
          if [ -z "$sha" ]; then
            echo "::error::Der Commit, der die Notbehelf-Ausgabe angelegt hat, ist nicht auffindbar."
            exit 1
          fi
          echo "Notbehelf kam mit $sha – wird zurückgenommen."

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git revert --no-commit "$sha"; then
            git revert --abort || true
            echo "::error::Der Revert läuft in einen Konflikt – es wird nichts ersetzt."
            echo "  Der Notbehelf bleibt stehen; der Wächter meldet ihn als roten Lauf."
            exit 1
          fi

          if [ -f "data/editions/$tag.ts" ]; then
            echo "::error::Nach dem Revert existiert die Ausgabendatei noch – Abbruch."
            exit 1
          fi
          echo "Der Notbehelf ist aus dem Arbeitsstand entfernt; die recherchierte Ausgabe folgt."

      - name: Ausgabe schreiben
        if: steps.vorhanden.outputs.schon == 'nein'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Ein Zwischendienst vor der Anthropic-Schnittstelle, falls einer
          # gewollt ist. Nicht gesetzt heißt: unverändert direkt dorthin.
          #
          # Wer die Variable setzt, gibt einem Dritten den Quelltext der
          # Meldungen und den API-Schlüssel in die Hand – deshalb ein Secret
          # und kein `vars`, deshalb nur `https://`, und deshalb schreibt der
          # Lauf eine Warnzeile, solange sie gesetzt ist.
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          # Zum Nachsehen, ob noch ein Agentenlauf unterwegs ist – siehe die
          # Warteschleife vor Weg 1.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUELLENDATEI: quellen.txt
          STICHTAG: ${{ steps.vorhanden.outputs.tag }}
          NACHRICHTEN_MODELL: ${{ inputs.modell }}
          NUR_PRUEFEN: ${{ inputs.probe && '1' || '' }}
          ERSETZEN: ${{ steps.vorhanden.outputs.ersetzen }}
        run: |
          schreibe() { node --experimental-strip-types scripts/nachrichten-erzeugen.ts; }

          # ---------------------------------------------------------------
          # Weg 1: der Entwurf der Routine.
          #
          # Sie liest dieselbe Quellendatei, schreibt daraus die Artikel als
          # JSON und legt sie auf dem wurzellosen Zweig `nachrichten-entwurf`
          # ab. Mehr nicht – kein Build, keine Prüfkette, kein Push auf main.
          #
          # Diese Arbeitsteilung ist der Kern: Bis zum 6. August 2026 sollte
          # die Sitzung alles machen, von der Recherche bis zum Push, und hat
          # das an sieben Tagen in Folge nicht geschafft. Wo genau, war nicht
          # feststellbar – Sitzungsprotokolle sind nicht einsehbar. Jetzt tut
          # sie nur noch das, was ein Läufer nicht kann: schreiben. Alles
          # Mechanische passiert hier, wo jeder Schritt im Protokoll steht.
          # **Auf den Entwurf wird gewartet, nicht an ihm vorbeigelaufen.**
          #
          # Am 11. August 2026 war die Reihenfolge auf dem Kopf: Der Agent
          # sollte um 01:27 und 01:41 laufen und lief um 03:25 und 03:29 –
          # rund zwei Stunden zu spät, wie GitHub das hier regelmäßig tut.
          # Dieser Lauf war um 02:21 längst durch, fand keinen Entwurf und
          # schrieb den Notbehelf. Erst geschrieben, dann recherchiert.
          #
          # Der Zeitplan allein löst das nicht: Er ist eine Bitte, keine
          # Zusage – das steht seit dem 6. August in AGENTS.md. Was hilft, ist
          # eine Frage, die **wartet**: Ein Entwurf, der in zwanzig Minuten
          # kommt, ist unendlich viel mehr wert als eine Ausgabe, die es
          # sofort gibt und die niemand lesen will.
          #
          # Zwanzig Minuten sind aus dem Fahrplan gerechnet: Der letzte
          # Nachrichtenlauf beginnt um 02:47 UTC, der Podcast um 02:53, und
          # der braucht die Ausgabe. Länger geht nicht, ohne die Zusage von
          # 6:00 Uhr zu gefährden.
          entwurf="${RUNNER_TEMP:-/tmp}/entwurf.json"

          hat_entwurf() {
            git fetch origin nachrichten-entwurf --depth 1 -q 2>/dev/null || return 1
            git show origin/nachrichten-entwurf:entwurf.json > "$entwurf" 2>/dev/null || return 1
            [ -s "$entwurf" ] || return 1
            [ "$(node -e "try{process.stdout.write(String(JSON.parse(require('fs').readFileSync('$entwurf','utf8')).stichtag||''))}catch(e){}")" = "$STICHTAG" ]
          }

          # Nur warten, wenn der Agent überhaupt noch kommen kann. Läuft
          # keiner mehr und ist auch keiner gelaufen, wäre das Warten
          # zwanzig verlorene Minuten.
          if ! hat_entwurf; then
            offen=$(gh run list --repo "${{ github.repository }}" \
                      --workflow nachrichten-agent.yml --limit 5 \
                      --json status --jq '[.[] | select(.status != "completed")] | length' \
                      2>/dev/null || echo 0)
            if [ "${offen:-0}" -gt 0 ]; then
              echo "Ein Agentenlauf ist unterwegs ($offen offen) – es wird bis zu 20 Minuten gewartet."
              for versuch in $(seq 1 20); do
                sleep 60
                if hat_entwurf; then
                  echo "  Nach $versuch Minute(n) ist der Entwurf da."
                  break
                fi
                echo "  Minute $versuch: noch kein Entwurf von heute."
              done
            else
              echo "Kein Agentenlauf unterwegs – es wird nicht gewartet."
            fi
          fi

          if git fetch origin nachrichten-entwurf --depth 1 -q 2>/dev/null &&
             git show origin/nachrichten-entwurf:entwurf.json > "$entwurf" 2>/dev/null &&
             [ -s "$entwurf" ]; then
            # Ist er von heute? Ein Entwurf von gestern ist schlimmer als
            # keiner – er sähe aus wie eine Ausgabe und wäre eine Wiederholung.
            stichtag=$(node -e "try{process.stdout.write(String(JSON.parse(require('fs').readFileSync('$entwurf','utf8')).stichtag||''))}catch(e){}")
            if [ "$stichtag" = "$STICHTAG" ]; then
              echo "Entwurf der Routine gefunden (Stichtag $stichtag)."
              if ANTWORT_DATEI="$entwurf" schreibe; then
                echo "Die Ausgabe kommt aus dem Entwurf der Routine – recherchiert und kostenlos." \
                  >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "::warning::Der Entwurf hat die Prüfung nicht bestanden – weiter mit dem nächsten Weg."
            else
              echo "::warning::Der Entwurf trägt den Stichtag '$stichtag', nicht '$STICHTAG' – er wird nicht verwendet."
            fi
          else
            echo "Kein Entwurf auf 'nachrichten-entwurf'."
          fi

          # Beim Ersetzen gibt es keinen nächsten Weg. Der Riegel oben hat
          # den Notbehelf nur zurückgenommen, **weil** ein Entwurf von heute
          # bereitlag – scheitert der jetzt an der Prüfung, wäre jeder
          # Rückfall absurd: Weg 3 schriebe denselben Notbehelf noch einmal,
          # den wir gerade entfernt haben. Dann lieber ein roter Lauf, der
          # den Notbehelf stehen lässt, wie er war.
          if [ "$ERSETZEN" = "ja" ]; then
            echo "::error::Der Entwurf, der den Notbehelf ersetzen sollte, hat die Prüfung nicht bestanden."
            echo "  Es wird nichts gepusht – der Notbehelf bleibt, der Wächter meldet ihn."
            exit 1
          fi

          # ---------------------------------------------------------------
          # Weg 2: das Modell auf dem Läufer.
          if [ -n "$ANTHROPIC_API_KEY" ] && [ "${{ steps.quellen.outputs.frisch }}" = "ja" ]; then
            if schreibe; then
              echo "Die Ausgabe kommt aus dem Modell." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::Der Modellaufruf ist gescheitert."
          else
            echo "::warning::Kein Entwurf und kein ANTHROPIC_API_KEY – oder keine Quellendatei von heute."
          fi

          # ---------------------------------------------------------------
          # Hier stand Weg 3: die Ausgabe aus dem eigenen Kursbestand.
          #
          # **Er ist weg, auf Anweisung des Betreibers vom 11. August 2026:**
          # „Besser keine Nachrichten als solche Nachrichten."
          #
          # Der Gedanke dahinter war, dass nie „gar nichts" dastehen soll. In
          # der Praxis kam etwas anderes heraus. Am 9. und am 11. August stand
          # der Notbehelf auf der Startseite – „512 Titel im Plus, 501 im
          # Minus", „Realzins bei rund −0,4 Prozentpunkten" –, und am
          # 11. August wäre er beinahe auch noch vertont worden. Das sind
          # aufbereitete eigene Zahlen. Als Nachrichtenseite gelesen sind sie
          # eine Enttäuschung, und sie verdrängen dabei die Meldung, die
          # gefehlt hat.
          #
          # Schlimmer noch: Der Notbehelf **verdeckte den Ausfall**. Eine
          # Ausgabe stand da, der Build lief, die Startseite war voll – und
          # dass die Recherche nicht stattgefunden hatte, stand nur als
          # `::warning::` in einem grünen Lauf. Genau der stille Fehler, gegen
          # den der Rest dieses Repositories anschreibt.
          #
          # Ohne ihn ist der Ausfall laut: kein Eintrag, roter Lauf, Mail.
          # `ausgabe-waechter.yml` schlägt zusätzlich um 03:11 UTC an.
          echo "::error::Weder ein Entwurf des Agenten noch ein Modellaufruf haben eine Ausgabe geliefert."
          echo "  Es wird **nichts** geschrieben. Besser keine Nachrichten als"
          echo "  aufbereitete eigene Kurszahlen, die wie Nachrichten aussehen."
          echo ""
          echo "  Nachsehen: das Protokoll von 'Nachrichten-Agent' (Entwurf?),"
          echo "  der Zweig 'quellen-heute' (Quellen gesammelt?) und ob"
          echo "  ANTHROPIC_API_KEY hinterlegt ist."
          {
            echo "### Keine Ausgabe"
            echo ""
            echo "Weder Entwurf noch Modell haben geliefert. Es wurde nichts"
            echo "geschrieben – der Notbehelf aus dem Kursbestand ist seit dem"
            echo "11. August 2026 abgeschafft."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Dieselbe Kette wie im Paketbau. Schlägt eine Prüfung fehl, wird nichts
      # veröffentlicht – lieber keine Ausgabe als eine, die den Build bricht.
      - name: Formatieren und prüfen
        if: steps.vorhanden.outputs.schon == 'nein' && !inputs.probe
        run: |
          npx prettier --write data/ >/dev/null
          npx tsc --noEmit
          npm run lint
          npm test
          npm run build
          npm run pruefen
          npm run format:check
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Auf main veröffentlichen
        if: steps.vorhanden.outputs.schon == 'nein' && !inputs.probe
        id: veroeffentlichen
        run: |
          rm -f quellen.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if [ "${{ steps.vorhanden.outputs.ersetzen }}" = "ja" ]; then
            # Revert und neue Ausgabe in **einem** Commit: Es gibt keinen
            # Zwischenstand, in dem der Tag ohne Ausgabe dasteht.
            git commit -m "Nachrichten: Ausgabe vom ${{ steps.vorhanden.outputs.tag }} ersetzt den Notbehelf"
          else
            git commit -m "Nachrichten: Ausgabe vom ${{ steps.vorhanden.outputs.tag }}"
          fi

          for versuch in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then
              echo "vorher=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
              echo "gepusht=ja" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push fehlgeschlagen, Versuch $versuch – neuer Anlauf in $((versuch * 5))s"
            sleep $((versuch * 5))
          done
          echo "::error::Push nach vier Versuchen fehlgeschlagen."
          exit 1

      # Ein Push mit dem GITHUB_TOKEN löst keinen Workflow aus – der Paketbau
      # wird deshalb ausdrücklich angestoßen. Siehe den Kopf von `kurse.yml`.
      - name: Veröffentlichung anstoßen
        if: steps.veroeffentlichen.outputs.gepusht == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run paket-bauen.yml \
            --repo "${{ github.repository }}" --ref main \
            -f vorher="${{ steps.veroeffentlichen.outputs.vorher }}" \
            -f paket=false
          echo "Der Paketbau ist angefordert – die Ausgabe geht damit auf den Webspace."

      # ------------------------------------------------------------------
      # Und die Folge des Tages gleich mit.
      #
      # ## Warum der Podcast hier hängt und nicht an einer Uhrzeit
      #
      # Weil er ohnehin auf genau dieses Ereignis wartet: Er vertont die
      # Tagesausgabe, und vorher hat er nichts zu sprechen. Ein eigener Termin
      # ist deshalb bestenfalls eine Schätzung, wann die Ausgabe fertig sein
      # könnte – und schlimmstenfalls das, was am 11. August 2026 passierte:
      #
      #     02:53 UTC   der Podcasttermin
      #     04:07 UTC   ausgeführt, 74 Minuten zu spät
      #     06:20 UTC   die Folge war schließlich oben – 8:20 deutscher Zeit
      #
      # Die Zusage lautet 6:00 Uhr deutscher Zeit. Sie hält nicht, wenn das
      # letzte Glied der Kette auf eine Uhr wartet, die zwei Stunden nachgeht.
      #
      # Angestoßen statt terminiert braucht die Folge ab hier rund 37 Minuten.
      # Selbst wenn dieser Lauf erst um 02:43 UTC zum Zuge käme – dem letzten
      # Cron –, wäre sie um 03:20 UTC online, also 5:20 deutscher Zeit.
      #
      # Doppelt angestoßen schadet nicht: `podcast-erzeugen.yml` fragt als
      # Erstes `origin/main`, ob die Folge des Tages schon im Register steht,
      # und der Upload fragt vorher noch einmal den Kanal selbst.
      - name: Podcastfolge anstoßen
        if: steps.veroeffentlichen.outputs.gepusht == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run podcast-erzeugen.yml \
            --repo "${{ github.repository }}" --ref main \
            && echo "Die Folge des Tages ist angefordert – sie vertont die eben geschriebene Ausgabe." \
            || echo "::warning::Der Podcastlauf ließ sich nicht anstoßen – Cron und kurse.yml greifen."
