name: Weltindex prüfen

# Holt das Factsheet des Indexanbieters und meldet, wenn Ländergewichte,
# Branchengewichte oder die Rangfolge der größten Werte von denen in
# `data/index-zusammensetzung.ts` abweichen.
#
# Die Logik steht in `scripts/weltindex-pruefen.py` und nicht hier: Ein
# Heredoc im Workflow lässt sich nicht prüfen, und in der ersten Fassung
# steckte genau deshalb ein Fehler – ein Ausdruck verlangte zwei Felder auf
# einer Zeile, die Prettier umbricht. Der Wächter hätte jeden Monat gemeldet,
# er könne nichts ablesen.
#
# ## Warum ein Wächter und kein Abruf
#
# Weil die Zahlen einmal im Monat wechseln und in einem PDF stehen. Ein Abruf
# bei jedem Bau wäre Aufwand für einen Wert, der vier Wochen steht – und ein
# Skript, das ein PDF-Layout maschinell ausliest, bricht beim ersten
# Umformatieren still. Ausgelesen wird deshalb von Hand, und dieser Lauf
# sorgt dafür, dass das Von-Hand nicht vergessen wird.
#
# Das ist dieselbe Bauart wie beim Zahlenwächter: Eine gepflegte Datei ist nur
# so gut wie die Meldung, die kommt, wenn sie veraltet.
#
# ## Warum eine Warnung und kein roter Lauf
#
# Die Frage ist nicht „hat sich etwas geändert?", sondern „sieht ein Besucher
# deshalb etwas Falsches?". Ein Ländergewicht, das um ein Zehntel wandert,
# ändert an der Aussage der Seite nichts – „fast drei Viertel Dollar" bleibt
# richtig. Erst ein deutlicher Sprung ist ein Fall zum Nachtragen, und dafür
# ist eine Warnung im Protokoll die richtige Lautstärke.
#
# Bei der **Rangfolge** ist das anders: Sie steht mit Namen auf
# `/maerkte/klumpenrisiko`, und eine vertauschte Rangfolge sieht auf keiner
# Seite falsch aus. Sie wird deshalb ohne Toleranz gemeldet.
#
# Wer die Zahlen nachträgt: `data/index-zusammensetzung.ts`, danach
# `npm run test` – die Prüfungen dort rechnen Summen und Reihenfolgen nach.

on:
  # Am dritten jedes Monats um 04:07 UTC. Das Factsheet zum Monatsende steht
  # erfahrungsgemäß in den ersten Tagen darauf bereit.
  #
  # Krumme Minute mit Absicht: Runde Minuten sind am dichtesten belegt, und
  # GitHub verwirft geplante Läufe ohne Meldung, wenn zu viele zusammenfallen.
  schedule:
    - cron: '7 4 3 * *'
  workflow_dispatch:

concurrency:
  group: weltindex-pruefen
  cancel-in-progress: false

jobs:
  pruefen:
    name: Factsheet gegen die Datei halten
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: PDF-Leser bereitstellen
        run: pip install --quiet pdfminer.six

      # Der Selbsttest läuft vor dem Abruf – dieselbe Reihenfolge wie bei
      # `scripts/sprechstimme.py` in `podcast-erzeugen.yml`. Ein Wächter,
      # dessen Ausdrücke nicht mehr greifen, meldet sonst monatelang „nichts
      # gefunden", und das liest nach dem zweiten Mal niemand mehr.
      #
      # Dieser Schritt bricht **rot** ab: Er prüft nicht die Zahlen, sondern
      # den Wächter selbst.
      - name: Den Wächter selbst prüfen
        run: python3 scripts/weltindex-pruefen.py --selbsttest

      - name: Factsheet holen und vergleichen
        run: python3 scripts/weltindex-pruefen.py
