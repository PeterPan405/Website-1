name: Kurse aktualisieren

# Holt die Tagesschlusskurse und legt sie als Momentaufnahme im Repository ab.
#
# Nach dem Commit stößt dieser Workflow den Neubau **ausdrücklich** an. Das
# ist der Kern und war zwei Monate lang falsch gedacht: Hier stand, der Push
# nach `main` sei zugleich der Auslöser für die Bereitstellung. Er ist es
# nicht.
#
# **Ein Push, der mit dem `GITHUB_TOKEN` gemacht wurde, löst keinen weiteren
# Workflow aus.** GitHub verhindert damit Endlosschleifen, meldet es aber
# nirgends – kein Fehler, kein Hinweis, nur ein Commit auf `main`, hinter dem
# nichts passiert. Nachgezählt am 4. August 2026: Von sechzig Läufen des
# Paketbaus zwischen dem 30. Juli und dem 3. August war **kein einziger**
# durch einen Kurs-Commit ausgelöst; alle zwölf Push-Läufe stammten von einem
# Merge durch den Betreiber. Neun Kurs-Commits vom 3. August (15:12 bis
# 22:43 UTC) haben zusammen keinen einzigen Bau erzeugt.
#
# Nach außen sah das aus wie „die Charts aktualisieren nicht": Die Kurse
# standen im Repository richtig und aktuell, auf der Website aber stand der
# Stand des letzten Merges. Alles dazwischen – Zeitplan, Aufteilung in
# Leitwerte, Preis-Modus – war für die Sichtbarkeit ohne Wirkung.
#
# Ausgenommen von der Sperre sind `workflow_dispatch` und
# `repository_dispatch`. Deshalb startet der letzte Schritt unten den
# Paketbau über die API, statt sich auf den Push zu verlassen.
#
# ## Zeitplan (seit dem 9. August 2026)
#
# | Zeit (UTC)               | Was                                          |
# | ------------------------ | -------------------------------------------- |
# | alle 5 Min. (:04, :09 …) | Leitwerte, nur Preis – **ohne Neubau**       |
# | 08:07, 10:07 … 20:07     | voller Bestand alle zwei Stunden, mit Neubau |
# | 21:47                    | voller Lauf nach dem Schluss in New York     |
# | Wochenende ebenso :04 …  | nur Krypto und Devisen                       |
# | Wochenende alle 6 Std.   | dito, aber mit Neubau                        |
#
# Die Arbeitsteilung dahinter: Die sichtbare **Zahl** erreicht den Leser
# über `kurse-live.json` und den Browser (`KursLive`, fragt jede Minute) –
# dafür braucht es keinen Bau, nur die Fünf-Minuten-Läufe. Das gebaute HTML
# (Charts, Vorschluss als Rechenbasis, Leser ohne JavaScript) zieht mit den
# vollen Läufen nach und ist damit höchstens gut zwei Stunden alt.
#
# Der volle Lauf um 16:07 UTC liegt sicher hinter der EZB, die ihre
# Referenzkurse gegen 16:00 Uhr MEZ veröffentlicht (15:00 UTC im Winter,
# 14:00 im Sommer) – der Zeitplan übersteht die Zeitumstellung unverändert.
#
# Ohne Kursänderung wird nichts committet: An Feiertagen und außerhalb der
# Handelszeiten bleibt es still.

# ## Warum die Minuten so krumm sind
#
# Weil GitHub geplante Läufe verwirft, wenn zu viele gleichzeitig anstehen.
# Der Zeitplan ist eine Bitte, keine Zusage – das steht so in der
# Dokumentation, und am 3. August 2026 hat es dieses Projekt getroffen:
# Der Paketbau (`15 4`) startete um 07:48, dreieinhalb Stunden zu spät, die
# Quellenprobe (`30 5`) und **jeder** Kurslauf des Tages fielen ganz aus.
# Die Charts standen von Freitag bis Montagmittag still, und in den
# Protokollen war nichts zu sehen: Ein verworfener Lauf hinterlässt keinen
# Fehler, nur eine Lücke.
#
# Am dichtesten belegt sind die vollen und halben Stunden – dorthin legt
# alle Welt ihre Zeitpläne. Deshalb stehen die Minuten hier auf krummen
# Werten. Das kostet nichts und ist der einzige Hebel, den man von außen
# hat.
#
# **Wer eine dieser Zeiten ändert, ändert auch die Vergleiche unter
# `NUR_ARTEN` und `NUR_PREIS` weiter unten.** Sie prüfen den Cron-Ausdruck
# als Zeichenkette; ein geänderter Ausdruck ohne angepassten Vergleich
# schaltet stillschweigend den vollen Abruf ein – sieben Minuten statt
# Sekunden, dreißigmal am Tag.

on:
  schedule:
    # Werktags **alle fünf Minuten, rund um die Uhr**: nur die Leitwerte,
    # nur der laufende Preis.
    #
    # Seit dem 9. August 2026 – vorher stündlich zu festen Stunden. Was den
    # dichteren Takt möglich macht, ist die Arbeitsteilung darunter: Dieser
    # Lauf holt ein Dutzend Kurse (Sekunden), legt `kurse-live.json` direkt
    # auf den Server und **stößt keinen Neubau an** – der Browser holt sich
    # die Zahl selbst (`KursLive`). Ein Lauf kostet damit gut eine Minute
    # Läuferzeit und keinerlei Bau.
    #
    # Die alte Stundenliste (1,2,3,6,7,9,…) war die Antwort auf die
    # übersprungene Tokioter Sitzung vom 5. August; „alle Stunden" schließt
    # dieses Loch von selbst. Und dass einzelne Termine verworfen werden,
    # heilt sich hier allein: Der nächste kommt in fünf Minuten.
    #
    # Welche Symbole gemeint sind, steht in `lib/leitwerte.ts`. Die Minuten
    # sind krumm (siehe oben) und meiden die 30er-Marke.
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * 1-5'
    # Werktags **alle zwei Stunden**: der volle Bestand.
    #
    # Die geraden Stunden, damit sich die beiden Läufe nie überschneiden –
    # die Gruppe `kurse` ließe den zweiten sonst warten.
    - cron: '7 8,10,12,14,16,18,20 * * 1-5'
    # Und einmal nach Börsenschluss der volle Lauf.
    #
    # Er schreibt die Historie fort und holt die Dividenden – beides ändert
    # sich einmal je Handelstag, und beides brauchte bis August 2026 trotzdem
    # jeden halbstündlichen Lauf: `range=5y` für tausend Titel, um daraus den
    # laufenden Preis zu lesen. Das war der Grund für sieben Minuten Laufzeit.
    #
    # 21:47 UTC liegt nach dem Schluss in New York (21:00 UTC im Winter,
    # 20:00 im Sommer) und damit nach dem letzten Kurs des Tages.
    - cron: '47 21 * * 1-5'
    # Am Wochenende ebenfalls alle fünf Minuten, aber nur Krypto und Devisen.
    #
    # Aktien und Indizes werden nicht gehandelt – ein Abruf liefert für sie
    # denselben Freitagsschluss. Bitcoin, Ethereum und XRP laufen dagegen
    # weiter, und dass Krypto an 365 Tagen handelt, erklärt diese Website an
    # anderer Stelle ausdrücklich. Bis hierher stand am Wochenende trotzdem
    # der Freitagskurs. Die Beschränkung macht aus sieben Minuten und tausend
    # Anfragen ein paar Sekunden und eine Handvoll.
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * 6,0'
    # Dazu am Wochenende alle sechs Stunden derselbe Abruf mit Neubau:
    # Ohne ihn stünde das **gebaute** HTML (Stand-Zeile, Vorschluss als
    # Rechenbasis) bis Montag auf dem Freitagsstand. Der Browser wäre
    # aktuell, die Seite ohne JavaScript nicht.
    - cron: '9 */6 * * 6,0'
  # Von Hand auslösbar – zum Prüfen und für den allerersten Lauf.
  workflow_dispatch:
    inputs:
      nur_preis:
        description: 'Nur den laufenden Preis holen – schnell, ohne Historie'
        type: boolean
        default: false

# Nur ein Lauf gleichzeitig: Zwei Läufe würden auf denselben Zweig schreiben.
concurrency:
  group: kurse
  cancel-in-progress: false

jobs:
  abrufen:
    runs-on: ubuntu-latest
    permissions:
      # Zum Committen der Momentaufnahme.
      contents: write
      # Zum Anstoßen des Paketbaus über `gh workflow run` – siehe letzter
      # Schritt. Ohne dieses Recht antwortet die API mit 403.
      actions: write

    steps:
      - uses: actions/checkout@v5
        with:
          # Der Zweig, auf dem der Lauf gestartet wurde. Beim Zeitplan ist das
          # der Standardzweig; von Hand gestartet der jeweils gemeinte – sonst
          # liesse sich ein Abruf auf einem Arbeitszweig nicht ausprobieren.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Bewusst ohne `npm ci`: Das Skript braucht keine Abhängigkeit, nur Node.
      # Ein Installationslauf wäre hier reine Wartezeit.
      - name: Kurse abrufen
        # Der Schluessel ist optional. Ohne ihn laeuft der Abruf ueber Yahoo,
        # das keine Registrierung verlangt. Ist er als Repository-Secret
        # hinterlegt, wird Twelve Data bevorzugt.
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          # Am Wochenende nur, was am Wochenende handelt. `github.event.schedule`
          # enthält den Ausdruck, der den Lauf ausgelöst hat – bei einem Start
          # von Hand ist er leer, dann wird alles geholt.
          NUR_ARTEN: ${{ (github.event.schedule == '4,9,14,19,24,29,34,39,44,49,54,59 * * * 6,0' || github.event.schedule == '9 */6 * * 6,0') && 'crypto,fx' || '' }}
          # Nur der laufende Preis – gesetzt vom halbstündlichen Lauf **und vom
          # Wochenendlauf**.
          #
          # Dann fragt der Abruf `range=1d` statt `range=5y` und schreibt
          # ausschließlich `kurse-aktuell.json`. Bei einem Start von Hand ist
          # `github.event.schedule` leer, dann läuft der volle Abruf – das ist
          # die richtige Voreinstellung für „ich will nachsehen, ob es geht“.
          #
          # Der Wochenendlauf stand hier bis zum 3. August 2026 **nicht** – und
          # genau daran ist er gescheitert: Als voller Lauf holte er die Reihe
          # bevorzugt über Twelve Data, und dieser Weg liefert bewusst keinen
          # laufenden Kurs (`latest: null` in `kurse-abrufen.ts`). Der Stand
          # fiel auf den alten zurück, der Commit-Schritt sah „keine Änderung“,
          # und Bitcoin stand das ganze Wochenende auf dem Freitags- bzw.
          # Samstagswert – alle acht Sonntagsläufe grün, keiner mit Wirkung.
          # Der Preis-Modus schreibt den laufenden Kurs nachweislich (alle
          # fünf Minuten). Die Krypto-Tageskerzen von Samstag und Sonntag
          # holt der volle Lauf am Montag um 21:45 nach – `range=5y` bringt
          # alle abgeschlossenen Tage mit.
          NUR_PREIS: ${{ (github.event.schedule == '4,9,14,19,24,29,34,39,44,49,54,59 * * * 1-5' || github.event.schedule == '7 8,10,12,14,16,18,20 * * 1-5' || github.event.schedule == '4,9,14,19,24,29,34,39,44,49,54,59 * * * 6,0' || github.event.schedule == '9 */6 * * 6,0' || inputs.nur_preis) && '1' || '' }}
          # Der Stundenlauf holt nur die Leitwerte – siehe `lib/leitwerte.ts`.
          # Alles andere behält seinen Stand und zieht zwei Stunden später nach.
          NUR_LEITWERTE: ${{ github.event.schedule == '4,9,14,19,24,29,34,39,44,49,54,59 * * * 1-5' && '1' || '' }}
        run: npm run kurse

      - name: Momentaufnahme committen
        id: commit
        run: |
          # Alle Dateien, die der Abruf schreibt: aktuelle Kurse, Historie,
          # Dividenden. Meist ändert sich nur die erste – sie trägt den
          # laufenden Preis, die Historie wächst einmal je Handelstag.
          #
          # Die Dividendendatei kam später dazu, und der erste Lauf danach ist
          # genau daran gescheitert: Der Commit nahm nur die Kursdatei, die
          # geänderte Dividendendatei blieb ungestaged – und `git pull
          # --rebase` bricht mit „You have unstaged changes“ ab. Ein Abruf,
          # der sieben Minuten läuft und dann nichts ablegt.
          #
          # Deshalb steht die Liste an einer Stelle und wird an beiden
          # Stellen benutzt: bei der Prüfung auf Änderungen und beim Staging.
          dateien="data/snapshots/kurse-aktuell.json data/snapshots/markets.json data/snapshots/dividenden.json data/snapshots/marktbreite.json data/snapshots/kursausfaelle.json"

          if git diff --quiet -- $dateien; then
            echo "Keine Änderung – kein Commit, keine Bereitstellung."
            echo "gepusht=nein" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $dateien
          git commit -m "Kurse: Stand $(date -u +%Y-%m-%d)"

          # Zwischen Prüfung und Push kann jemand anders gepusht haben.
          # Rebase statt Merge, damit die Historie eine Linie bleibt.
          zweig="${{ github.ref_name }}"
          for versuch in 1 2 3; do
            if git pull --rebase origin "$zweig" && git push origin "$zweig"; then
              echo "gepusht=ja" >> "$GITHUB_OUTPUT"
              # Der Stand **vor** diesem Commit – nach dem Rebase, also der
              # tatsächliche Vorgänger. Der Paketbau vergleicht dagegen und
              # erkennt daran, dass nur Momentaufnahmen betroffen sind; ohne
              # diese Angabe liefe er in die volle Prüfkette und kostete gut
              # zwei Minuten mehr je Lauf.
              echo "vorher=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push fehlgeschlagen, Versuch $versuch – neuer Anlauf in $((versuch * 5))s"
            sleep $((versuch * 5))
          done
          echo "gepusht=nein" >> "$GITHUB_OUTPUT"
          echo "Push nach drei Versuchen fehlgeschlagen."
          exit 1

      # Den Neubau anstoßen – der Punkt, an dem die Kurse überhaupt erst
      # sichtbar werden.
      #
      # `workflow_dispatch` ist zusammen mit `repository_dispatch` der
      # einzige Weg, der dem `GITHUB_TOKEN` offensteht (siehe Kopf dieser
      # Datei). Ein Push tut es nachweislich nicht.
      #
      # `paket=false`: Der Paketbau hängt das fertige Verzeichnis nur bei
      # einem Start von Hand als Artefakt an. Es wiegt 138 MB, enthalten sind
      # 500 MB Actions-Speicher im Monat – bei fünfzehn Kursläufen am Tag
      # wäre das Kontingent vor dem Mittagessen voll.
      # ------------------------------------------------------------------
      # Die Kurse ohne Bau auf den Server.
      #
      # Das ist der eigentliche Gewinn: Bis August 2026 hieß jede
      # Kursänderung „1.524 Seiten neu bauen und übertragen", rund dreizehn
      # Minuten – für eine Zahl in einer Kopfzeile. `kurse-live.json` wiegt
      # 63 KB und ist in Sekunden oben.
      #
      # Der Browser liest sie und ersetzt damit den gebauten Kurs. Das HTML
      # behält seinen eigenen, damit die Seite ohne JavaScript vollständig
      # bleibt und Suchmaschinen eine Zahl sehen.
      #
      # Der Bau danach bleibt trotzdem – er trägt Reihen, Kennzahlen und
      # alles Übrige. Nur ist er jetzt eine Frage von Stunden, nicht von
      # Minuten.
      - name: Kurse auf den Server
        if: always() && github.ref_name == 'main'
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_PORT: '65002'
          ZIELPFAD: domains/iminvests.de/public_html
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$SSH_KEY" ]; then
            echo "Keine Server-Zugangsdaten – die Kurse warten auf den nächsten Bau."
            exit 0
          fi
          npm run kurselive

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # **Ein Anlauf reicht bei diesem Server nicht.** Am 9. August 2026
          # nachgemessen, dreimal derselbe Workflow gegen denselben Host:
          #
          #     11:46  ssh-keyscan scheitert nach 5 s
          #     11:49  ssh-keyscan gelingt
          #     11:53  ssh-keyscan scheitert nach 5 s
          #
          # Dazwischen, um 11:50, lief ein vollständiger Deploy durch – weil
          # `paket-bauen.yml` **fünfmal** anklopft und zwischen den Versuchen
          # wartet. Der Port flattert; wer einmal fragt, bekommt an guten
          # Tagen recht und an anderen nicht.
          #
          # Zwei Fehler steckten in der nackten Form. Der zweite ist der
          # teurere: Der Schritt läuft unter `bash -e`, ein fehlschlagendes
          # `ssh-keyscan` beendet ihn **sofort** – noch vor jeder sorgfältig
          # formulierten Fehlermeldung weiter unten. Der Lauf endete mit
          # „exit code 1" und keinem Wort dazu, warum. `2>/dev/null` tat den
          # Rest und verschluckte auch noch die Begründung.
          echo "— Hostschlüssel holen"
          geholt=nein
          for versuch in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p "$SSH_PORT" -H "$HOST" \
                 >> ~/.ssh/known_hosts 2>/tmp/keyscanfehler; then
              # `ssh-keyscan` liefert auch dann 0, wenn es nichts gefunden
              # hat. Gezählt wird deshalb, was tatsächlich ankam.
              if [ -s ~/.ssh/known_hosts ]; then
                geholt=ja
                echo "  Hostschlüssel hinterlegt (Versuch $versuch)."
                break
              fi
            fi
            echo "  Versuch $versuch ohne Ergebnis:"
            sed 's/^/    /' /tmp/keyscanfehler || true
            [ "$versuch" -lt 5 ] && sleep 10
          done

          # **Eine misslungene Übertragung ist hier keine Meldung wert.**
          #
          # Am 9. August 2026 hat der Betreiber gemeldet, dass ihn die
          # Fehlermails erschlagen. Von diesem Workflow kamen fünf an einem
          # Tag, alle an dieser Stelle, alle mit demselben Ausgang: Der Port
          # antwortete ein paar Minuten nicht und danach wieder.
          #
          # Was dieser Schritt überträgt, ist der laufende Preis für den
          # Browser. Fällt er einmal aus, sieht ein Besucher die Zahl aus
          # dem gebauten HTML – ein paar Minuten älter, sonst nichts. Und
          # der nächste Lauf kommt in wenigen Minuten; dieser Workflow läuft
          # rund siebzehnmal am Tag.
          #
          # Ein roter Lauf ist in diesem Projekt das Mittel, mit dem sich
          # ein Ausfall bemerkbar macht. Setzt man es für etwas ein, das
          # sich von selbst erledigt, ist es hinterher für den Ernstfall
          # verbraucht: Wer täglich fünf Mails bekommt, liest die sechste
          # nicht mehr. Der Ernstfall – die Website ist weg oder ihr Stand
          # veraltet – steht in den beiden Schritten darunter.
          if [ "$geholt" = nein ]; then
            echo "::warning::Nach fünf Versuchen kein Hostschlüssel – Port $SSH_PORT antwortet nicht."
            echo "  Der Server flattert; der nächste Lauf trägt die Kurse nach."
            rm -f ~/.ssh/id_deploy
            exit 0
          fi

          # Erst daneben legen, dann umbenennen: Ein Umbenennen ist für den
          # Webserver ein Augenblick, ein Hochladen dauert. Ohne diesen
          # Zwischenschritt könnte jemand die Datei halb geschrieben lesen.
          if scp -P "$SSH_PORT" -i ~/.ssh/id_deploy \
               public/kurse-live.json "$USER@$HOST:$ZIELPFAD/kurse-live.json.neu" &&
             ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy "$USER@$HOST" \
               "mv '$ZIELPFAD/kurse-live.json.neu' '$ZIELPFAD/kurse-live.json'"; then
            echo "Kurse übertragen: https://iminvests.de/kurse-live.json"
          else
            echo "::warning::Die Übertragung ist abgebrochen – der nächste Lauf trägt sie nach."
          fi
          rm -f ~/.ssh/id_deploy

      # ------------------------------------------------------------------
      # Steht die Website überhaupt noch?
      #
      # ## Woher das kommt
      #
      # Am 8. August 2026 war der Webordner plötzlich leer – bis auf eine
      # `.htaccess`, die nicht unsere war (6.147 statt 5.687 Byte). Der
      # Zeitpunkt lässt sich auf zwei Minuten eingrenzen: Um 18:54:14 lag
      # `kurse-live.json` nachweislich dort, um 18:56 war der Ordner leer.
      # In dem Fenster hat kein Lauf von uns den Server angefasst.
      #
      # Die Ursache lag also außerhalb, und dagegen hilft kein Vorbeugen.
      # Was hilft: den Ausfall nicht stehen lassen. Aufgefallen ist er dem
      # Betreiber, nicht der Technik – und da war die Website längst weg.
      #
      # ## Warum hier und nicht in einem eigenen Zeitplan
      #
      # Aus derselben Überlegung, aus der der Nachrichtenlauf hier hängt:
      # Geplante Läufe werden in diesem Projekt regelmäßig verworfen. Dieser
      # Workflow läuft fünfzehn- bis zwanzigmal am Tag; dass **alle**
      # ausfallen, ist ungleich unwahrscheinlicher. Damit steht eine leere
      # Website höchstens eine halbe Stunde statt bis zum nächsten Morgen.
      #
      # Ein Abruf kostet eine Sekunde. Der Neubau wird nur angefordert,
      # wenn die Startseite wirklich fehlt – und `paket-bauen.yml` prüft
      # ohnehin selbst, bevor es überträgt.
      # ## Warum drei Versuche, eine Zeitgrenze und ein roter Lauf
      #
      # Am 9. August 2026 war der Server des Hosters von 05:45 bis 07:14 UTC
      # nicht erreichbar – weder über 443 noch über den SSH-Port. Diese
      # Prüfung hat es bemerkt und den Neubau angefordert, genau wie
      # vorgesehen. Und trotzdem hätte niemand davon erfahren, wenn nicht
      # im selben Lauf zufällig auch die Kursübertragung an demselben
      # Server gescheitert wäre: **Eine Warnung in einem grünen Lauf
      # schickt keine Mail.** Derselbe stille Fehler wie beim
      # Nachrichten-Notbehelf, nur an anderer Stelle.
      #
      # Drei Dinge daraus:
      #
      # 1. **`--max-time`.** Der Abruf hing an dem Morgen 132 Sekunden.
      #    Ohne Grenze wartet `curl` auf ein Zeitlimit des Systems, und der
      #    Lauf steht derweil.
      # 2. **Fünf Versuche über vier Minuten.** Eine einzelne
      #    Zeitüberschreitung ist ein Zucken, kein Ausfall.
      #
      #    Drei Versuche in gut einer Minute waren zu wenig. Am 9. August
      #    2026 um 22:05 meldete diese Prüfung dreimal `000` und färbte den
      #    Lauf rot – zwei Minuten später lief ein vollständiger Paketbau
      #    gegen denselben Server durch. Die Website war nie weg; sie war
      #    zwei Minuten lang nicht erreichbar.
      #
      #    Vier Minuten sind der Abstand, den dieser Hoster braucht, um sich
      #    zu fangen (nachgemessen an dem Tag). Wer länger ausfällt, fällt
      #    wirklich aus – und diese Prüfung läuft rund siebzehnmal am Tag,
      #    verpasst also nichts.
      # 3. **Roter Lauf.** Dass die eigene Website nicht antwortet, ist der
      #    lauteste Fall, den es hier gibt. `kurse.yml` läuft rund
      #    siebzehnmal am Tag – ein anhaltender Ausfall meldet sich damit
      #    etwa stündlich, und er hört von selbst auf, sobald die Seite
      #    wieder steht.
      #
      # Nebenbei: Der frühere Ausdruck `$(curl … || echo 000)` ergab im
      # Fehlerfall `000000`, weil `-w '%{http_code}'` schon selbst `000`
      # ausgibt. Im Protokoll stand dann „antwortet mit 000000".
      - name: Steht die Website noch?
        if: always() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=000
          for versuch in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              -A 'iminvests-watchdog' https://iminvests.de/ 2>/dev/null || true)
            case "$code" in ''|*[!0-9]*) code=000 ;; esac
            [ "$code" = "200" ] && break
            echo "  Versuch $versuch: $code"
            [ "$versuch" -lt 5 ] && sleep 45
          done

          if [ "$code" = "200" ]; then
            echo "Startseite: 200 – die Website steht."
            exit 0
          fi

          echo "::error::Die Startseite antwortet fünfmal über vier Minuten nicht mit 200, zuletzt $code."
          echo "  Entweder ist der Webordner leer oder der Server ist gestört."
          echo "  Ein Neubau wird angefordert; er legt alles wieder ab –"
          echo "  gegen einen Ausfall beim Hoster hilft er allerdings nicht."
          echo ""
          echo "  Nachsehen: hPanel > Websites, und ob Port 65002 antwortet."
          echo "  Hält es an, ist es eine Störung des Hosters und keine unsere."
          gh workflow run paket-bauen.yml \
            --repo "${{ github.repository }}" --ref main -f paket=false
          exit 1

      # ------------------------------------------------------------------
      # Ist der Stand auf dem Server noch aktuell?
      #
      # ## Warum es diesen Schritt gibt
      #
      # Er ist das Gegengewicht dazu, dass eine misslungene Übertragung seit
      # dem 9. August 2026 nur noch eine Warnung ist – hier und in
      # `paket-bauen.yml`. Das war nötig, weil der Port dieses Hosters
      # flattert und jeder Fehlversuch eine Mail kostete; aber gemildert
      # gehört das Geräusch, nicht die Aufsicht.
      #
      # Denn die Beruhigung stimmt nur, solange sie stimmt: „Der nächste Lauf
      # trägt es nach" ist richtig, wenn ein Lauf ausfällt, und falsch, wenn
      # der Server tagelang niemanden heranlässt. Der Unterschied ist von
      # außen ablesbar, und zwar an genau einer Zahl – dem Bauzeitpunkt in
      # `version.txt`, den jeder Bau mitschreibt.
      #
      # ## Warum zehn und achtzehn Stunden
      #
      # Nicht gegriffen, sondern aus dem Fahrplan gerechnet. Der letzte Bau
      # des Abends und der nächtliche Bau um 05:41 UTC liegen im
      # ungünstigsten Fall gut acht Stunden auseinander; eine Grenze darunter
      # schlüge jede Nacht an und wäre nach einer Woche Rauschen. Zehn
      # Stunden lassen diese Lücke zu und melden alles darüber. Achtzehn
      # heißt: Es ist nicht nur ein Bau ausgefallen, sondern der ganze
      # Vormittag samt Nachrichtenausgabe – und dann muss eine Mail kommen.
      #
      # Antwortet `version.txt` gar nicht, sagt dieser Schritt nichts: Ob die
      # Website steht, hat der Schritt darüber schon beantwortet, und zweimal
      # dieselbe Meldung ist eine zu viel.
      - name: Ist der Stand auf dem Server noch aktuell?
        if: always() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stand=$(curl -s --max-time 20 -A 'iminvests-watchdog' \
            https://iminvests.de/version.txt 2>/dev/null \
            | grep -oE '^gebaut: +.*' | sed 's/^gebaut: *//; s/ UTC$//' || true)

          if [ -z "$stand" ]; then
            echo "version.txt nennt keinen Bauzeitpunkt – hier ist nichts zu entscheiden."
            exit 0
          fi

          gebaut=$(date -u -d "$stand UTC" +%s 2>/dev/null || echo 0)
          if [ "$gebaut" -eq 0 ]; then
            echo "Der Bauzeitpunkt '$stand' ist nicht lesbar."
            exit 0
          fi

          alter=$(( ( $(date -u +%s) - gebaut ) / 3600 ))
          echo "Der Stand auf dem Server ist vom $stand UTC – $alter Stunden alt."

          # Läuft schon einer? Dann nicht noch einen anfordern.
          #
          # Ohne diese Frage stößt jeder Lauf einen Bau an, solange der Stand
          # alt ist – und `paket-bauen.yml` reiht Läufe auf `main`, statt sie
          # abzubrechen. Zwanzig gereihte Bauten zu je acht Minuten wären
          # genau die Überlastung, gegen die der Rest dieser Datei anschreibt.
          offen=$(gh run list --repo "${{ github.repository }}" \
                    --workflow paket-bauen.yml --limit 5 \
                    --json status --jq '[.[] | select(.status != "completed")] | length' \
                    2>/dev/null || echo 1)

          anstossen() {
            if [ "${offen:-1}" -gt 0 ]; then
              echo "  Ein Bau ist bereits unterwegs ($offen offen) – kein weiterer Anstoß."
            else
              gh workflow run paket-bauen.yml \
                --repo "${{ github.repository }}" --ref main -f paket=false
            fi
          }

          if [ "$alter" -ge 18 ]; then
            echo "::error::Seit $alter Stunden ist kein Bau mehr auf dem Server angekommen."
            echo "  So lange hält keine normale Lücke im Fahrplan. Entweder lässt der"
            echo "  Server seit dem Vorabend niemanden heran, oder der Paketbau scheitert"
            echo "  vor der Übertragung. Beides steht im Protokoll von 'Paket bauen'."
            anstossen
            exit 1
          fi

          if [ "$alter" -ge 10 ]; then
            echo "::warning::Der Stand auf dem Server ist $alter Stunden alt – ein Bau wird angestoßen."
            anstossen
          else
            echo "Im Rahmen."
          fi

      # **Nicht nach jedem Fünf-Minuten-Lauf.** Ein Neubau kostet gemessen
      # 13 Minuten; bei fast 300 Preis-Läufen am Tag wäre das genau die
      # Überlastung, an der der alte Halbstundentakt gestorben ist (GitHub
      # verwarf die Läufe, siehe Kopf). Die Preis-Läufe brauchen ihn auch
      # nicht: Ihre Zahl erreicht den Leser über `kurse-live.json` und den
      # Browser. Gebaut wird nach den vollen Läufen (alle zwei Stunden und
      # 21:47) – das gebaute HTML ist damit höchstens gut zwei Stunden alt,
      # die sichtbare Zahl höchstens rund sechs Minuten.
      - name: Neubau anstoßen
        if: >-
          steps.commit.outputs.gepusht == 'ja' &&
          github.event.schedule != '4,9,14,19,24,29,34,39,44,49,54,59 * * * 1-5' &&
          github.event.schedule != '4,9,14,19,24,29,34,39,44,49,54,59 * * * 6,0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run paket-bauen.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f vorher="${{ steps.commit.outputs.vorher }}" \
            -f paket=false
          echo "Paketbau für ${{ github.ref_name }} angefordert."

      # ------------------------------------------------------------------
      # Die Nachrichtenausgabe anstoßen, falls sie fehlt.
      #
      # ## Warum ausgerechnet hier
      #
      # Weil dieser Workflow der einzige ist, der zuverlässig läuft.
      #
      # Nachgezählt am 6. August 2026: Von allen geplanten Läufen des Tages
      # hat GitHub **genau einen** ausgeführt – den Kursabruf um 04:24. Die
      # Quellenprobe (03:03), das Quellensammeln (03:07 und 03:17), der
      # Nachrichtenlauf (04:47), der Wächter und der Paketbau wurden ersatzlos
      # verworfen. Am Vortag liefen sie, aber rund zweidreiviertel Stunden zu
      # spät: 03:03 wurde 05:49, 03:07 wurde 05:59, 05:09 wurde 07:45.
      #
      # `schedule` ist damit für die Zusage „die Nachrichten stehen morgens"
      # unbrauchbar. `kurse.yml` dagegen feuert fünfzehn- bis zwanzigmal am
      # Tag; dass **alle** verworfen werden, ist deutlich unwahrscheinlicher
      # als dass ein einzelner Termin ausfällt.
      #
      # Also die Abhängigkeit umdrehen: Nicht die Uhr startet den
      # Nachrichtenlauf, sondern der erste Kursabruf des Tages, der feststellt,
      # dass die Ausgabe fehlt.
      #
      # ## Warum das nichts kostet
      #
      # `nachrichten.yml` prüft als Erstes, ob die Ausgabe schon steht, und
      # hört dann nach vierzig Sekunden auf, ohne das Modell zu fragen. Ein
      # überflüssiger Anstoß ist damit eine knappe Minute Läuferzeit, kein
      # Geld und keine zweite Ausgabe.
      - name: Nachrichtenausgabe anstoßen, falls sie fehlt
        # `always()`, weil auch ein Lauf ohne Kursänderung diese Prüfung
        # machen soll – „nichts hat sich bewegt" heißt nicht „die Nachrichten
        # stehen".
        if: always() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ab 02:00 UTC – 4:00 Uhr deutscher Zeit. Früher nicht, weil die
          # Quellen erst um 01:13 und 01:23 gesammelt werden und der eigene
          # Nachrichtenlauf um 01:57 beginnt; zwei Wege, die gleichzeitig
          # schreiben, erzeugen zwei Ausgaben zum selben Datum, und das
          # bricht den Build ab.
          #
          # Später auch nicht: Die Ausgabe soll um **6:00 Uhr deutscher
          # Zeit** stehen (04:00 UTC), der Lauf braucht dafür zwanzig
          # Minuten plus Paketbau, und der Podcast setzt danach noch einmal
          # eine gute halbe Stunde drauf.
          stunde=$(date -u +%H)
          if [ "$stunde" -lt 02 ]; then
            echo "Es ist erst $stunde Uhr UTC – vor 02:00 wird nichts angestoßen."
            exit 0
          fi

          heute=$(date -u +%Y-%m-%d)
          git fetch origin main --depth 1 -q
          if git cat-file -e "origin/main:data/editions/$heute.ts" 2>/dev/null; then
            # **„Steht bereits" genügt nicht mehr** – der Notbehelf aus dem
            # Kursbestand liefert immer eine Ausgabe. Steht eine, entscheidet
            # ihre Herkunft (Maßstab wie im Wächter: weniger als die Hälfte
            # externer Quellen heißt Notbehelf), ob sich ein weiterer Anstoß
            # lohnt: `nachrichten.yml` ersetzt einen Notbehelf durch den
            # recherchierten Entwurf, solange der Podcast ihn nicht vertont
            # hat. Diese Kette hier ist der Grund, warum das nicht am
            # einzigen 02:47-Termin hängt.
            datei="${RUNNER_TEMP:-/tmp}/ausgabe-heute.ts"
            git show "origin/main:data/editions/$heute.ts" > "$datei"
            gesamt=$(grep -c "url: '" "$datei" || true)
            extern=$(grep "url: '" "$datei" | grep -vc "iminvests.de" || true)

            if [ "${gesamt:-0}" -eq 0 ] || [ $((extern * 2)) -ge "$gesamt" ]; then
              echo "Die Ausgabe vom $heute steht bereits und ist recherchiert."
              exit 0
            fi

            # Vertont? Dann ist der Zug abgefahren – Website und Folge
            # müssen dasselbe erzählen.
            feed="${RUNNER_TEMP:-/tmp}/feed-heute.json"
            git show "origin/main:data/podcast-eigener-feed.json" > "$feed" 2>/dev/null || echo '{"folgen":[]}' > "$feed"
            if node -e '
                  const feed = require(process.argv[1])
                  process.exit((feed.folgen||[]).some((f) => f.datum === process.argv[2]) ? 0 : 1)
                ' "$feed" "$heute" 2>/dev/null; then
              echo "Für den $heute steht der Notbehelf, aber der Podcast hat ihn vertont – kein Ersetzen mehr."
              exit 0
            fi

            # Gibt es überhaupt einen Entwurf von heute? Ohne ihn würde der
            # angestoßene Lauf sofort wieder aufhören.
            entwurf="${RUNNER_TEMP:-/tmp}/entwurf-heute.json"
            if ! git fetch origin nachrichten-entwurf --depth 1 -q 2>/dev/null ||
               ! git show origin/nachrichten-entwurf:entwurf.json > "$entwurf" 2>/dev/null ||
               [ "$(node -e "try{process.stdout.write(String(JSON.parse(require('fs').readFileSync('$entwurf','utf8')).stichtag||''))}catch(e){}")" != "$heute" ]; then
              echo "Für den $heute steht der Notbehelf, aber kein Entwurf von heute – nichts anzustoßen."
              exit 0
            fi

            echo "::warning::Für den $heute steht der Notbehelf ($extern von $gesamt Quellen extern),"
            echo "  und ein recherchierter Entwurf liegt bereit – der Nachrichtenlauf wird zum Ersetzen angestoßen."
          else
            echo "::warning::Für den $heute fehlt die Ausgabe."
          fi

          # Läuft oder wartet schon einer? Dann nicht noch einen anfordern.
          offen=$(gh run list --repo "${{ github.repository }}" \
                    --workflow nachrichten.yml --limit 5 \
                    --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          if [ "${offen:-0}" -gt 0 ]; then
            echo "Ein Nachrichtenlauf ist bereits unterwegs ($offen offen)."
            exit 0
          fi

          # Ob die Ausgabe fehlt oder nur der Notbehelf steht, hat der Block
          # oben bereits gemeldet – hier zählt nur noch der Anstoß selbst.
          echo "::warning::Der Nachrichtenlauf wird angestoßen."
          gh workflow run nachrichten.yml \
            --repo "${{ github.repository }}" --ref main

      # Dieselbe Umkehrung für die Podcastfolge.
      #
      # `podcast-erzeugen.yml` hängt an einem einzigen `schedule`-Termin
      # (04:53 UTC). Nach allem, was in diesem Repository nachgezählt wurde,
      # ist das keine Zusage: Am 6. August 2026 wurde von allen geplanten
      # Läufen des Tages genau **einer** ausgeführt. Ein verworfener Termin
      # heißt dann: an diesem Tag erscheint keine Folge, und niemand erfährt
      # davon.
      #
      # ## Warum hier nach dem Lauf gefragt wird und nicht nach der Folge
      #
      # Naheliegend wäre, im Folgenregister nachzusehen, ob der heutige Tag
      # drinsteht. Das wäre falsch: Fehlt die Vertonung, endet der Lauf
      # ordnungsgemäß ohne Registereintrag – und diese Bedingung wäre dann
      # den ganzen Tag erfüllt. Bei einem Kursabruf alle zwei Stunden wären
      # das acht angestoßene Läufe am Tag. Gefragt wird deshalb, ob der Lauf
      # heute überhaupt **stattgefunden** hat.
      - name: Podcastfolge anstoßen, falls der Termin ausgefallen ist
        if: always() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          heute=$(date -u +%Y-%m-%d)

          # Kein Wochenend-Riegel mehr: Seit dem 9. August 2026 erscheint die
          # Folge sieben Tage die Woche. Damit fällt auch die Probetagsliste
          # weg, die hier den Samstag und Sonntag geregelt hat.

          # Nach dem eigenen Termin (02:53 UTC), sonst käme man ihm zuvor.
          stunde=$(date -u +%H)
          if [ "$stunde" -lt 03 ]; then
            echo "Es ist erst $stunde Uhr UTC – der eigene Termin hat noch Zeit."
            exit 0
          fi

          # Ohne Tagesausgabe gibt es nichts zu vertonen; der Schritt darüber
          # kümmert sich darum.
          heute=$(date -u +%Y-%m-%d)
          git fetch origin main --depth 1 -q
          if ! git cat-file -e "origin/main:data/editions/$heute.ts" 2>/dev/null; then
            echo "Für den $heute fehlt noch die Ausgabe – ohne sie keine Folge."
            exit 0
          fi

          heutige=$(gh run list --repo "${{ github.repository }}" \
                      --workflow podcast-erzeugen.yml --limit 20 \
                      --json createdAt \
                      --jq "[.[] | select(.createdAt | startswith(\"$heute\"))] | length" \
                      2>/dev/null || echo 1)
          if [ "${heutige:-1}" -gt 0 ]; then
            echo "Der Podcastlauf hat heute schon stattgefunden ($heutige)."
            exit 0
          fi

          echo "::warning::Der Podcasttermin ist heute ausgefallen – der Lauf wird angestoßen."
          gh workflow run podcast-erzeugen.yml \
            --repo "${{ github.repository }}" --ref main

      # ------------------------------------------------------------------
      # Läuft der Dauerlauf noch?
      #
      # ## Warum es diesen Schritt gibt
      #
      # Weil der Fünf-Minuten-Zeitplan über diesem Job eine Fiktion ist.
      # Nachgezählt am 10. August 2026 über die 22 Stunden davor: 29 statt
      # 264 Läufe, mittlerer Abstand 36,7 Minuten, größter 144,6. Nur elf
      # Prozent der Abstände lagen unter sechs Minuten.
      #
      # Die Zusage „höchstens sechs Minuten alt" hält deshalb seither
      # `kurse-dauerlauf.yml` – ein Läufer, der fünfeinhalb Stunden läuft
      # und seinen Takt selbst zählt, statt ihn sich von GitHub zuteilen zu
      # lassen. Er startet am Ende seinen eigenen Nachfolger.
      #
      # Diese Kette hat genau eine Schwachstelle: Reißt sie, startet nichts
      # mehr. Also fragt der Workflow nach, der nachweislich feuert – dieser
      # hier, fünfzehn- bis zwanzigmal am Tag. Dieselbe Umkehrung wie beim
      # Nachrichtenlauf und beim Podcast darüber.
      #
      # ## Warum nach einem Fehlschlag eine Stunde gewartet wird
      #
      # Ein Dauerlauf, der sofort scheitert – falscher Zugang, Yahoo
      # gesperrt –, würde sonst bei jedem Kurslauf neu gestartet und
      # scheiterte jedes Mal wieder: zwanzig rote Läufe und zwanzig Mails
      # am Tag für einen einzigen Defekt. Eine Stunde Abstand macht daraus
      # eine Mail je Stunde. Laut genug, um aufzufallen, leise genug, um
      # gelesen zu werden.
      - name: Läuft der Kurs-Dauerlauf noch?
        if: always() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          laeuft=$(gh run list --repo "${{ github.repository }}" \
                     --workflow kurse-dauerlauf.yml --limit 5 \
                     --json status --jq '[.[] | select(.status != "completed")] | length' \
                     2>/dev/null || echo fehler)

          if [ "$laeuft" = fehler ]; then
            echo "Die Laufliste war nicht abrufbar – hier ist nichts zu entscheiden."
            exit 0
          fi

          if [ "$laeuft" -gt 0 ]; then
            echo "Der Dauerlauf läuft ($laeuft offen) – die Kurse sind höchstens drei Minuten alt."
            exit 0
          fi

          # Wann endete der letzte, und wie? Ein frischer Fehlschlag heißt
          # warten, nicht nachschieben (siehe oben).
          letzter=$(gh run list --repo "${{ github.repository }}" \
                      --workflow kurse-dauerlauf.yml --limit 1 \
                      --json conclusion,updatedAt --jq '.[0] | "\(.conclusion) \(.updatedAt)"' \
                      2>/dev/null || echo "unbekannt -")
          ausgang=${letzter%% *}
          endete=${letzter##* }

          if [ "$ausgang" = failure ]; then
            seit=$(( ( $(date -u +%s) - $(date -u -d "$endete" +%s 2>/dev/null || echo 0) ) / 60 ))
            if [ "$seit" -ge 0 ] && [ "$seit" -lt 60 ]; then
              echo "::warning::Der letzte Dauerlauf ist vor $seit Minuten gescheitert."
              echo "  Kein neuer Anstoß vor Ablauf einer Stunde – sonst gäbe es zwanzig"
              echo "  gleichlautende Fehlermails am Tag. Die Ursache steht im Protokoll"
              echo "  von 'Kurse im Dauerlauf'."
              exit 0
            fi
          fi

          echo "::warning::Es läuft kein Dauerlauf (letzter: $ausgang, $endete) – er wird gestartet."
          echo "  Bis er steht, sind die Kurse so alt, wie dieser Zeitplan sie lässt."
          gh workflow run kurse-dauerlauf.yml \
            --repo "${{ github.repository }}" --ref main
