name: Kurse aktualisieren

# Holt die Tagesschlusskurse und legt sie als Momentaufnahme im Repository ab.
#
# Der Push nach `main` ist zugleich der Auslöser für die Bereitstellung bei
# Hostinger – ein anderer Weg auf den Webspace existiert nicht. Deshalb ist
# dieser Workflow nicht nur Datenpflege, sondern der eigentliche Takt, in dem
# die Website neu gebaut wird.
#
# Zeitplan: werktags stündlich von 07:00 bis 16:00 UTC – das sind 09:00 bis
# 18:00 deutscher Sommerzeit und deckt den deutschen Handelstag ab. Zehn Läufe,
# also ist ein angezeigter Kurs höchstens eine Stunde alt.
#
# Der letzte Lauf um 16:00 UTC liegt zugleich sicher hinter der EZB, die ihre
# Referenzkurse gegen 16:00 Uhr MEZ veröffentlicht – 15:00 UTC im Winter, 14:00
# UTC im Sommer. Damit muss der Zeitplan zur Zeitumstellung nicht angefasst
# werden.
#
# Nicht jeder Lauf führt zu einer Bereitstellung: Ohne Kursänderung wird nichts
# committet. Ausserhalb der Handelszeiten – Feiertage, Betriebsruhe – bleibt es
# deshalb still.

on:
  schedule:
    - cron: '0 7-16 * * 1-5'
  # Von Hand auslösbar – zum Prüfen und für den allerersten Lauf.
  workflow_dispatch:

# Nur ein Lauf gleichzeitig: Zwei Läufe würden auf denselben Zweig schreiben.
concurrency:
  group: kurse
  cancel-in-progress: false

jobs:
  abrufen:
    runs-on: ubuntu-latest
    permissions:
      # Zum Committen der Momentaufnahme.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Bewusst ohne `npm ci`: Das Skript braucht keine Abhängigkeit, nur Node.
      # Ein Installationslauf wäre hier reine Wartezeit.
      - name: Kurse abrufen
        # Der Schluessel ist optional. Ohne ihn laeuft der Abruf ueber Yahoo,
        # das keine Registrierung verlangt. Ist er als Repository-Secret
        # hinterlegt, wird Twelve Data bevorzugt.
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: npm run kurse

      - name: Momentaufnahme committen
        run: |
          if git diff --quiet -- data/snapshots/markets.json; then
            echo "Keine Änderung – kein Commit, keine Bereitstellung."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/markets.json
          git commit -m "Kurse: Stand $(date -u +%Y-%m-%d)"

          # Zwischen Prüfung und Push kann jemand anders gepusht haben.
          # Rebase statt Merge, damit die Historie eine Linie bleibt.
          for versuch in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push fehlgeschlagen, Versuch $versuch – neuer Anlauf in $((versuch * 5))s"
            sleep $((versuch * 5))
          done
          echo "Push nach drei Versuchen fehlgeschlagen."
          exit 1
