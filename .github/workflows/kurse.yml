name: Kurse aktualisieren

# Holt die Tagesschlusskurse und legt sie als Momentaufnahme im Repository ab.
#
# Der Push nach `main` ist zugleich der Auslöser für die Bereitstellung bei
# Hostinger – ein anderer Weg auf den Webspace existiert nicht. Deshalb ist
# dieser Workflow nicht nur Datenpflege, sondern der eigentliche Takt, in dem
# die Website neu gebaut wird.
#
# ## Zeitplan
#
# Werktags alle **30 Minuten** von 07:00 bis 20:30 UTC – 28 Läufe. Ein
# angezeigter Kurs ist damit höchstens eine halbe Stunde alt.
#
# Das Fenster deckt beide Handelstage ab, die für diesen Katalog zählen:
#
# - **Europa** von 09:00 bis 17:30 deutscher Zeit, also 07:00 bis 15:30 UTC im
#   Sommer.
# - **USA** von 15:30 bis 22:00 deutscher Zeit, also 13:30 bis 20:00 UTC im
#   Sommer. Das ist der wichtigere Teil: Die Mehrzahl der hier geführten
#   Aktien notiert in New York.
#
# Bis hierher endete der Zeitplan um 16:00 UTC und verpasste damit die
# gesamte zweite Hälfte des US-Handels – einschließlich des Schlusskurses.
# Wer abends auf die Seite sah, bekam für eine amerikanische Aktie einen
# Stand vom frühen Nachmittag, ohne dass etwas darauf hinwies.
#
# Der Lauf um 15:30 UTC liegt zugleich sicher hinter der EZB, die ihre
# Referenzkurse gegen 16:00 Uhr MEZ veröffentlicht – 15:00 UTC im Winter,
# 14:00 UTC im Sommer. Damit muss der Zeitplan zur Zeitumstellung nicht
# angefasst werden.
#
# ## Was der Takt kostet
#
# Jeder Lauf mit geänderten Kursen erzeugt einen Commit auf `main`, und der
# stößt Paketbau und Bereitstellung an. Halbstündlich über vierzehn Stunden
# sind das an einem Handelstag bis zu 28 Bereitstellungen statt bisher zehn.
# Das ist der Preis für aktuelle Kurse auf einer statisch gebauten Seite –
# und der Grund, warum ohne Kursänderung nichts committet wird: An
# Feiertagen und ausserhalb der Handelszeiten bleibt es still.

on:
  schedule:
    - cron: '0,30 7-20 * * 1-5'
  # Von Hand auslösbar – zum Prüfen und für den allerersten Lauf.
  workflow_dispatch:

# Nur ein Lauf gleichzeitig: Zwei Läufe würden auf denselben Zweig schreiben.
concurrency:
  group: kurse
  cancel-in-progress: false

jobs:
  abrufen:
    runs-on: ubuntu-latest
    permissions:
      # Zum Committen der Momentaufnahme.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Der Zweig, auf dem der Lauf gestartet wurde. Beim Zeitplan ist das
          # der Standardzweig; von Hand gestartet der jeweils gemeinte – sonst
          # liesse sich ein Abruf auf einem Arbeitszweig nicht ausprobieren.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Bewusst ohne `npm ci`: Das Skript braucht keine Abhängigkeit, nur Node.
      # Ein Installationslauf wäre hier reine Wartezeit.
      - name: Kurse abrufen
        # Der Schluessel ist optional. Ohne ihn laeuft der Abruf ueber Yahoo,
        # das keine Registrierung verlangt. Ist er als Repository-Secret
        # hinterlegt, wird Twelve Data bevorzugt.
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: npm run kurse

      - name: Momentaufnahme committen
        run: |
          # Beide Dateien, die der Abruf schreibt: Kurse und Dividenden.
          #
          # Die zweite kam später dazu, und der erste Lauf danach ist genau
          # daran gescheitert: Der Commit nahm nur die Kursdatei, die
          # geänderte Dividendendatei blieb ungestaged – und `git pull
          # --rebase` bricht mit „You have unstaged changes“ ab. Ein Abruf,
          # der sieben Minuten läuft und dann nichts ablegt.
          #
          # Deshalb steht die Liste an einer Stelle und wird an beiden
          # Stellen benutzt: bei der Prüfung auf Änderungen und beim Staging.
          dateien="data/snapshots/markets.json data/snapshots/dividenden.json"

          if git diff --quiet -- $dateien; then
            echo "Keine Änderung – kein Commit, keine Bereitstellung."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $dateien
          git commit -m "Kurse: Stand $(date -u +%Y-%m-%d)"

          # Zwischen Prüfung und Push kann jemand anders gepusht haben.
          # Rebase statt Merge, damit die Historie eine Linie bleibt.
          zweig="${{ github.ref_name }}"
          for versuch in 1 2 3; do
            git pull --rebase origin "$zweig" && git push origin "$zweig" && exit 0
            echo "Push fehlgeschlagen, Versuch $versuch – neuer Anlauf in $((versuch * 5))s"
            sleep $((versuch * 5))
          done
          echo "Push nach drei Versuchen fehlgeschlagen."
          exit 1
