name: Website prüfen

# Ruft die veröffentlichte Website von außen ab und schreibt das Ergebnis ins Log.
#
# Warum über GitHub: Aus der Entwicklungsumgebung ist die Seite nicht erreichbar,
# und der Hoster weist Abrufe von dort mit 403 ab. Der GitHub-Runner kommt über
# HTTPS problemlos hin – gesperrt war nur der FTP-Port 21.
#
# Der Workflow verändert nichts und braucht keine Zugangsdaten.

on:
  schedule:
    # Täglich um 06:30 UTC – nach dem nächtlichen Bau um 04:15 und vor dem
    # ersten Kursabruf des Tages um 07:00.
    #
    # Bis Juli 2026 lief dieser Workflow nur von Hand, und damit fiel ein
    # Ausfall erst auf, wenn jemand nachsah. Genau das ist passiert: Ein
    # Kursabruf scheiterte still am Commit, sieben Minuten Laufzeit ohne
    # Ergebnis – gefunden nicht von der Website, sondern beim Nachfragen.
    #
    # Der Lauf verändert nichts. Er ruft die veröffentlichte Seite ab und
    # schlägt an, wenn sie nicht antwortet oder ihre Daten veraltet sind.
    - cron: '34 6 * * *'
  workflow_dispatch:
    inputs:
      hosts:
        description: 'Zu prüfende Namen, durch Leerzeichen getrennt'
        required: false
        default: 'iminvests.de www.iminvests.de'

jobs:
  pruefen:
    name: Seite abrufen
    runs-on: ubuntu-latest
    steps:
      # Chrome hat gemeldet: „Diese Website unterstützt keine sichere
      # Verbindung“. Diese Meldung erscheint, wenn der Browser die Adresse auf
      # HTTPS hochstufen will und die Gegenstelle auf Port 443 nicht oder mit
      # einem unbrauchbaren Zertifikat antwortet. Ob das an der Domain, am
      # www-Namen oder am Zertifikat liegt, lässt sich nur von außen
      # feststellen – und nur mit den Einzelheiten kann man es abstellen.
      #
      # Geprüft wird beides, Domain mit und ohne www: Ein Zertifikat, das nur
      # einen der beiden Namen abdeckt, ist die häufigste Ursache.
      #
      # Die Namen sind einstellbar, weil die zweite häufige Ursache eine ganz
      # andere Adresse ist: eine alte Schreibweise, eine Nebendomain, ein
      # Tippfehler im Lesezeichen. Für die gilt das Zertifikat der Hauptdomain
      # nicht, und der Browser meldet genau dann, was hier gemeldet wurde.
      - name: Sichere Verbindung prüfen
        env:
          HOSTS: ${{ inputs.hosts || 'iminvests.de www.iminvests.de' }}
        run: |
          for HOST in $HOSTS; do
            echo "═══════════════════════════════════════ $HOST"

            echo "— Namensauflösung"
            getent ahostsv4 "$HOST" | awk '{print "  " $1}' | sort -u || echo "  (kein A-Eintrag)"

            echo "— Port 443 offen?"
            if timeout 10 bash -c "true > /dev/tcp/$HOST/443" 2>/dev/null; then
              echo "  ja"
            else
              echo "  NEIN – auf Port 443 antwortet nichts. Genau das zeigt der Browser an."
            fi

            echo "— Zertifikat"
            if timeout 15 openssl s_client -connect "$HOST:443" -servername "$HOST" \
                 <<<'Q' 2>/dev/null | openssl x509 -noout \
                 -subject -issuer -dates -ext subjectAltName 2>/dev/null | sed 's/^/  /'; then
              :
            else
              echo "  kein Zertifikat abrufbar – es ist keines installiert oder der Handschlag scheitert."
            fi

            echo "— Abruf über HTTPS"
            curl -sSI --max-time 25 "https://$HOST/" \
              -o /dev/null -w '  Status: %{http_code}  Zertifikatsprüfung: %{ssl_verify_result} (0 = in Ordnung)\n' \
              || echo "  HTTPS-Abruf fehlgeschlagen"

            echo "— Abruf über HTTP und Weiterleitung"
            curl -sSI --max-time 25 "http://$HOST/" \
              -o /dev/null -w '  Status: %{http_code}  Weiterleitung: %{redirect_url}\n' \
              || echo "  HTTP-Abruf fehlgeschlagen"

            # Ab hier die Fragen, die nur ein einzelner Rechner stellt.
            #
            # Wenn eine Seite überall funktioniert und auf genau einem Rechner
            # nicht, gibt es zwei Ursachen, die am Server liegen und behoben
            # werden können – alle übrigen liegen im Netz davor:
            #
            # 1. Eine unvollständige Kette. Sendet der Server nur sein eigenes
            #    Zertifikat und nicht das Zwischenzertifikat darüber, gelingt
            #    der Handschlag überall, wo dieses Zwischenzertifikat schon
            #    einmal gesehen und behalten wurde – und scheitert auf einem
            #    frisch aufgesetzten oder abgeschotteten Rechner, der es nicht
            #    nachladen darf. Genau dieses Muster: „nur auf diesem PC“.
            #
            # 2. Nur TLS 1.3. Firmen-Firewalls, die den Verkehr aufbrechen,
            #    sprechen teils nur TLS 1.2. Bietet der Server das nicht an,
            #    bricht die Verbindung genau hinter so einer Firewall ab.
            echo "— Zertifikatskette"
            KETTE=$(timeout 15 openssl s_client -connect "$HOST:443" -servername "$HOST" \
              -showcerts <<<'Q' 2>/dev/null | grep -c 'BEGIN CERTIFICATE' || echo 0)
            echo "  Vom Server gesendete Zertifikate: $KETTE"
            if [ "$KETTE" -le 1 ]; then
              echo "  ACHTUNG: nur das eigene Zertifikat. Das Zwischenzertifikat fehlt –"
              echo "  auf Rechnern ohne zwischengespeicherte Kette scheitert der Handschlag."
            else
              echo "  Kette vollständig ausgeliefert."
            fi
            timeout 15 openssl s_client -connect "$HOST:443" -servername "$HOST" \
              <<<'Q' 2>/dev/null | grep -E 'Verify return code|Verification' \
              | sed 's/^/  /' || true

            echo "— Angebotene TLS-Fassungen"
            for FASSUNG in tls1_2 tls1_3; do
              if timeout 12 openssl s_client "-$FASSUNG" -connect "$HOST:443" \
                   -servername "$HOST" <<<'Q' >/dev/null 2>&1; then
                echo "  $FASSUNG: ja"
              else
                echo "  $FASSUNG: NEIN"
              fi
            done
            echo ""
          done

      - name: Startseite und Stylesheet prüfen
        run: |
          URL="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          if [ -z "$URL" ]; then URL="https://iminvests.de"; fi
          echo "Geprüfte Adresse: $URL"

          # Mit Browser-Kennung, weil viele Hoster unbekannte Abrufer abweisen.
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          echo ""
          echo "=== Startseite ==="
          curl -sS --max-time 30 -A "$UA" -o seite.html -D kopf.txt -w \
            'Status: %{http_code}\nTyp:    %{content_type}\nGröße:  %{size_download} Bytes\n' \
            "$URL/" || echo "(Abruf fehlgeschlagen)"

          echo ""
          echo "=== Antwort-Kopfzeilen ==="
          grep -iE '^(HTTP/|server|content-type|x-|location)' kopf.txt || true

          echo ""
          echo "=== Was steht in der Seite? ==="
          if [ -f seite.html ]; then
            echo "Titel:  $(grep -o '<title>[^<]*' seite.html | head -1 | sed 's/<title>//')"
            echo "Marke:  $(grep -c 'IM Invests' seite.html) Treffer 'IM Invests'"
            echo "Alt:    $(grep -c 'Finanzkompass' seite.html) Treffer 'Finanzkompass'"
            echo "Erste 300 Zeichen:"
            head -c 300 seite.html
            echo ""
          fi

          echo ""
          echo "=== Stylesheet ==="
          CSS=$(grep -o '/_next/static/[^"]*\.css' seite.html 2>/dev/null | head -1)
          if [ -z "$CSS" ]; then
            echo "In der Seite ist kein Stylesheet verlinkt – dann ist das HTML selbst veraltet."
          else
            echo "Verlinkt: $CSS"
            curl -sS --max-time 20 -A "$UA" -o /dev/null -w \
              'Status: %{http_code}\nTyp:    %{content_type}\nGröße:  %{size_download} Bytes\n' \
              "$URL$CSS" || echo "(Abruf fehlgeschlagen)"
          fi

          echo ""
          echo "=== Inhalt des Stylesheets ==="
          if [ -n "$CSS" ]; then
            curl -sS --max-time 20 -A "$UA" -o stil.css "$URL$CSS" || true
            echo "Regeln mit .fk-: $(grep -c -o '\.fk-' stil.css || echo 0)"
            echo "Erste 200 Zeichen:"
            head -c 200 stil.css
            echo ""
          fi

          echo ""
          echo "=== Alte Stylesheet-Adresse ==="
          # Die Adresse aus dem Browser des Nutzers, als die Seite unformatiert
          # aussah. Antwortet sie mit 404, während die oben verlinkte Adresse
          # 200 liefert, dann zeigt der Browser eine zwischengespeicherte,
          # veraltete Seite – und der Server ist in Ordnung.
          printf '%-48s ' "/_next/static/chunks/22vr61z768k05.css"
          curl -sS --max-time 20 -A "$UA" -o /dev/null -w '%{http_code}\n' \
            "$URL/_next/static/chunks/22vr61z768k05.css" || echo "Fehler"

          echo ""
          echo "=== Frische der Daten ==="
          # Der Zeitstempel des Kursabrufs steht maschinenlesbar in
          # /version.txt – dieselbe Datei, die auch Commit und Bauzeit trägt.
          # Auf der Marktseite steht er als deutscher Satz; den aus HTML zu
          # klauben wäre der falsche Weg für eine Prüfung.
          #
          # Warum das hier steht: Ein Kursabruf ist schon einmal still am
          # Commit gescheitert – sieben Minuten Laufzeit, kein Ergebnis, und
          # die Website zeigte weiter alte Zahlen. Aufgefallen ist es beim
          # Nachfragen, nicht durch eine Prüfung.
          stand=$(curl -sS --max-time 20 -A "$UA" "$URL/version.txt" \
            | grep -oE '^kurse: *[^ ]+' | awk '{print $2}')
          if [ -n "$stand" ] && [ "$stand" != "unbekannt" ]; then
            echo "Kursabruf zuletzt: $stand"
            alter=$(( ( $(date -u +%s) - $(date -u -d "$stand" +%s) ) / 3600 ))
            echo "Alter: $alter Stunden"
            # Dreißig Stunden lassen ein Wochenende und einen Feiertag zu; alles
            # darüber heißt, dass mehrere Läufe ausgefallen sind.
            if [ "$alter" -gt 30 ]; then
              echo "::warning::Der Kursstand ist $alter Stunden alt – der Abruf liefert nicht mehr."
            else
              echo "Im Rahmen."
            fi
          else
            echo "::warning::In /version.txt steht kein Kursstand – läuft dort noch eine alte Fassung?"
          fi

          echo ""
          echo "=== Weitere Seiten ==="
          # Die Liste enthält bewusst auch die jeweils neuesten Inhalte: Nur so
          # zeigt der Abruf, ob der Hoster den aktuellen Stand ausliefert oder
          # noch den vorigen. Eine Startseite mit 200 beweist das nicht.
          for p in /news/ /news/tag/ /news/tag/2026-07-30/ \
                   /maerkte/naspers/ /maerkte/saudi-aramco/ /maerkte/walt-disney/ \
                   /akademie/anlegerverhalten/ /lernen/geldsystem/ \
                   /rechner/vermoegensuebersicht/ \
                   /lernen/aktie/beginner/ /rechner/ /staatsverschuldung/ /sitemap.xml; do
            printf '%-32s ' "$p"
            curl -sS --max-time 20 -A "$UA" -o /dev/null -w '%{http_code}\n' "$URL$p" || echo "Fehler"
          done
