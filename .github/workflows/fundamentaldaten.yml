name: Fundamentaldaten aktualisieren

# Holt Umsatz, Gewinn, Cashflow, Eigenkapital und Aktienzahl bei der
# US-Börsenaufsicht.
#
# Zeitplan: am fünften jeden Monats. Die Zahlen ändern sich nur mit den
# Quartalsberichten, also viermal im Jahr – monatlich fängt jede Meldesaison
# sicher ein und kostet zwölf Läufe.
#
# Warum nicht im Kursabruf mit: Kurse kommen halbstündlich, diese Zahlen viermal
# jährlich. Sie im selben Lauf zu holen hieße, zweiundvierzig Mal am Tag zwanzig
# große Dateien herunterzuladen, in denen sich nichts geändert hat.

on:
  schedule:
    # Samstags früh, wöchentlich statt monatlich.
    #
    # Monatlich am Fünften klang sparsam und war es auch – nur kommen die
    # Meldungen nicht monatlich, sondern in Wellen: Ende Januar, April, Juli
    # und Oktober legen innerhalb weniger Tage hunderte Unternehmen ihre
    # Zahlen vor. Wer dann am Fünften abruft, zeigt vier Wochen lang die
    # vorletzten Zahlen. Samstag, weil der Lauf mit dem ESEF-Teil zehn
    # Minuten dauert und am Wochenende niemandem in die Quere kommt.
    - cron: '0 6 * * 6'
  workflow_dispatch:
    inputs:
      quellen:
        description: 'Welche Quellen abrufen'
        type: choice
        default: alle
        options: [alle, sec, esef, taiwan]

concurrency:
  group: fundamentaldaten
  cancel-in-progress: false

jobs:
  abrufen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Die Auswahl gibt es, weil der ESEF-Schritt allein zwanzig Minuten
      # dauert: Er blättert das gesamte Verzeichnis durch. Wer nur eine
      # Zahlenreihe nachziehen will, soll dafür nicht den ganzen Lauf abwarten.
      #
      # Ohne Auswahl – also beim monatlichen Lauf – läuft alles.
      - name: Fundamentaldaten abrufen
        if: inputs.quellen == '' || inputs.quellen == 'alle' || inputs.quellen == 'sec'
        run: npm run fundamentaldaten

      # Zweiter Weg für die Werte ohne US-Notierung: die ESEF-Pflichtmeldungen
      # der EU. Läuft danach und ergänzt nur, was die SEC nicht abdeckt.
      - name: ESEF-Meldungen ergänzen
        if: inputs.quellen == '' || inputs.quellen == 'alle' || inputs.quellen == 'esef'
        run: npm run esef

      # Dritter Weg: die Börse Taipeh. Die einzige Aufsichtsstelle ausserhalb
      # von USA und EU, die ohne Schlüssel antwortet.
      - name: Börse Taipeh ergänzen
        if: inputs.quellen == '' || inputs.quellen == 'alle' || inputs.quellen == 'taiwan'
        run: npm run taiwan

      - name: Momentaufnahme committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Erst vormerken, dann vergleichen. `git diff` allein sieht eine noch
          # nicht versionierte Datei nicht und meldet „keine Änderung“ – genau
          # daran ist der erste erfolgreiche Lauf gescheitert.
          git add data/snapshots/fundamentaldaten.json
          if git diff --cached --quiet -- data/snapshots/fundamentaldaten.json; then
            echo "Keine Änderung – kein Commit."
            exit 0
          fi

          git commit -m "Fundamentaldaten: Stand $(date -u +%Y-%m-%d)"

          zweig="${{ github.ref_name }}"
          for versuch in 1 2 3; do
            git pull --rebase origin "$zweig" && git push origin "$zweig" && exit 0
            echo "Push fehlgeschlagen, Versuch $versuch"
            sleep $((versuch * 5))
          done
          exit 1
