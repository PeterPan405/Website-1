name: Instagram-Beitrag

# Veröffentlicht das Karussell der Tagesausgabe bei @im_invests.
#
# ## Wo er in der Kette hängt – und warum nicht früher
#
# Angestoßen vom **letzten Schritt in `paket-bauen.yml`**, nachdem das Paket
# übertragen und von außen nachgeprüft wurde.
#
# Der Kopf dieser Datei nannte bis zum 29. August 2026 `nachrichten.yml` als
# Ziel – dorthin, wo auch der Podcast hängt. Das wäre zu früh gewesen, und
# zwar auf die unangenehme Art:
#
# Meta holt die Bilder **selbst** von `iminvests.de/instagram/1.jpg`. Diese
# Adresse antwortet jeden Tag, auch bevor der neue Stand übertragen ist – dann
# eben mit der Kachel von gestern. `nachrichten.yml` endet, während der
# Paketbau noch läuft. Ein Anstoß von dort hätte an vielen Tagen die
# Schlagzeilen von gestern gepostet, ohne dass ein Lauf rot geworden wäre.
#
# Der Podcast darf früher hängen, weil er die Ausgabe aus dem Repository liest.
# Dieser Lauf liest sie vom Webspace. Das ist der ganze Unterschied.
#
# **Kein eigener Cron als Regelweg:** Geplante Läufe werden hier regelmäßig
# verworfen. Der Rückfalltermin unten ist genau das – ein Rückfall –, und beide
# Wege dürfen sich überschneiden, dafür gibt es die Riegel.
#
# ## Zwei Riegel im Skript, keiner davon in diesem Workflow
#
# `scripts/instagram-veroeffentlichen.ts` prüft vor dem ersten Behälter:
#
#   1. Trägt die Beschriftung auf der Website den heutigen Tag? Wenn nicht,
#      ist die Übertragung noch nicht durch – Ende, ohne roten Lauf.
#   2. Steht im Kanal schon ein Beitrag von heute? Gefragt wird **Instagram
#      selbst**, nicht eine Datei im Repository. Ein Riegel ist so gut wie die
#      Quelle, die er fragt.
#
# Beide enden mit Code 0. Ein Beitrag, der ausbleibt, weil er schon draußen
# ist, ist kein Fehlschlag – und eine Mail an jedem richtigen Tag liest nach
# zwei Wochen niemand mehr.
#
# ## Der dritte Riegel: die Sperre des Tages
#
# Am 20. September 2026 lief dieser Workflow fünfmal – 00:58, 04:52, 07:55,
# 08:55, 09:42 – und bekam jedes Mal `400: Queue is full`. Im Protokoll stand
# jedes Mal der Satz „Nicht noch einmal anstoßen: Jeder Anstoß legt einen
# weiteren Eintrag in dieselbe volle Warteschlange." Er stand da und band
# niemanden, weil er an einen Menschen gerichtet war.
#
# Ein Satz im Protokoll ist keine Regel. Deshalb hinterlässt ein Lauf, dem der
# Dienst die volle Warteschlange meldet, jetzt eine Marke auf dem wurzellosen
# Zweig `instagram-sperre`, und jeder weitere Lauf desselben Tages sieht sie
# und schickt nichts. Am nächsten Tag läuft es ohne Zutun wieder an.
#
# **Nur diese eine Sorte Fehler sperrt.** Alles andere trägt der nächste Lauf
# nach; das ist die Regel des Hauses. Die volle Warteschlange ist die
# Ausnahme, weil der nächste Versuch dort nicht folgenlos ist, sondern
# schadet. Die Entscheidung selbst liegt in `lib/instagram-sperre.ts`, damit
# sie ohne Netz und ohne Dienst prüfbar ist.

on:
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: 'Wirklich veröffentlichen? (leer = nur Trockenlauf)'
        type: boolean
        default: false

  # Der Rückfall, falls der Anstoß aus dem Paketbau ausbleibt: 04:52 deutscher
  # Zeit. Krumme Minute, weil runde am dichtesten belegt sind.
  #
  # Spät genug, dass die Übertragung durch ist (der Paketbau der Nacht endet
  # gegen 03:30 UTC), früh genug für den Morgen. Greift der Anstoß wie
  # vorgesehen, findet dieser Lauf den Beitrag von heute bereits im Kanal und
  # hört nach ein paar Sekunden auf.
  schedule:
    - cron: '52 2 * * *'

# Anstoß und Rückfalltermin können sich am selben Tag treffen. Der laufende
# wird **nicht** abgebrochen: Er ist womöglich schon beim Hochladen, und ein
# halb angelegtes Karussell kostet Kontingent, ohne etwas zu zeigen.
concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  beitrag:
    name: Karussell veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # Zum Schreiben des wurzellosen Zweiges `instagram-sperre`.
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Die Kacheln kommen aus dem letzten Bau, der auf dem Webspace liegt –
      # nicht aus diesem Lauf. Sie werden hier nur geholt, damit das Skript
      # ihre Anzahl kennt und die Beschriftung lesen kann.
      - name: Kacheln und Beschriftung von der Website holen
        id: holen
        run: |
          basis="${NEXT_PUBLIC_SITE_URL:-https://iminvests.de}"
          basis="${basis%/}"
          mkdir -p out/instagram

          # Wie viele Kacheln gibt es? Gezählt wird, bis eine fehlt – die
          # Anzahl haengt an der Ausgabe des Tages und ist nicht fest.
          n=1
          gefunden=0
          while [ "$n" -le 10 ]; do
            code=$(curl -s -o "out/instagram/$n.jpg" -w '%{http_code}' "$basis/instagram/$n.jpg")
            if [ "$code" != "200" ]; then
              rm -f "out/instagram/$n.jpg"
              break
            fi
            gefunden=$n
            n=$((n + 1))
          done

          if [ "$gefunden" -lt 2 ]; then
            echo "::error::Unter $basis/instagram/ liegen nur $gefunden Kachel(n)."
            echo "  Ein Karussell braucht mindestens zwei. Steht der letzte Bau?"
            exit 1
          fi

          code=$(curl -s -o out/instagram/beschriftung.txt -w '%{http_code}' \
            "$basis/instagram/beschriftung.txt")
          [ "$code" = "200" ] || rm -f out/instagram/beschriftung.txt

          echo "$gefunden Kacheln geholt."
          echo "kacheln=$gefunden" >> "$GITHUB_OUTPUT"
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      # Solange die beiden Zugangsdaten fehlen, kann dieser Lauf nichts tun.
      # Das ist kein Fehlschlag, sondern der Zustand vor der Einrichtung –
      # aber es gehoert sichtbar gemacht, sonst sieht ein uebersprungener
      # Beitrag genauso aus wie ein gelungener.
      - name: Zugangsdaten prüfen
        id: zugang
        run: |
          if [ -n "${{ secrets.IG_ACCESS_TOKEN }}" ] && [ -n "${{ secrets.IG_USER_ID }}" ]; then
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
            echo "Eigenes Token – der Beitrag geht direkt an die Graph-Schnittstelle."
          elif [ -n "${{ secrets.MAKE_WEBHOOK_URL }}" ]; then
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
            echo "Kein eigenes Token, aber ein Haken beim Dienst – der Beitrag geht dort hinaus."
            echo "::notice::Der Doppelriegel liegt in diesem Fall im Szenario beim Dienst."
          else
            echo "vorhanden=nein" >> "$GITHUB_OUTPUT"
            echo "::warning::Weder IG_ACCESS_TOKEN/IG_USER_ID noch MAKE_WEBHOOK_URL – es geht nichts hinaus."
            echo "  Der eine Weg steht in EINRICHTUNG.md 3.4 und 3.5, der andere in 3.11."
          fi

      # Wann wird wirklich veroeffentlicht?
      #
      #   workflow_dispatch  nur mit gesetztem Haken – von Hand wird geprueft,
      #                      nicht gepostet, solange niemand es ausdruecklich will
      #   schedule           ja; der Rueckfalltermin ist der Ernstfall
      #   Anstoss aus dem Paketbau  ja, per `-f veroeffentlichen=true`
      #
      # Ohne Zugangsdaten bleibt es beim Trockenlauf – das Skript zaehlt dann
      # die Kacheln auf und hoert vor dem ersten Behaelter auf.
      # Die Marke des Tages, falls es eine gibt. Gefragt wird der Zweig von
      # **jetzt**, nicht der Checkout: Der ist eine Momentaufnahme vom
      # Auslösen, und zwischen Auslösen und Laufen kann genau der Lauf
      # gescheitert sein, dessen Marke hier zählt.
      - name: Sperre des Tages holen
        run: |
          mkdir -p out/instagram
          if git fetch --depth 1 origin instagram-sperre 2>/dev/null; then
            git show FETCH_HEAD:sperre.txt > out/instagram/sperre.txt 2>/dev/null || true
            echo "Marke vom Zweig:"
            sed 's/^/  /' out/instagram/sperre.txt 2>/dev/null || echo "  (keine)"
          else
            echo "Kein Zweig instagram-sperre – nichts gesperrt."
          fi

      - name: Veröffentlichen
        run: npm run instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          VEROEFFENTLICHEN: >-
            ${{ (steps.zugang.outputs.vorhanden == 'ja'
                 && (github.event_name == 'schedule' || inputs.veroeffentlichen))
                && 'ja' || 'nein' }}

      # Hat der Lauf eben eine Sperre gesetzt, kommt sie auf den Zweig – sonst
      # wüsste der nächste Lauf nichts davon. `if: always()`, weil der Schritt
      # davor in genau diesem Fall rot geworden ist.
      #
      # Der Zweig ist wurzellos und hat immer genau einen Commit: Es gibt
      # nichts zu sammeln, die Marke gilt einen Tag.
      - name: Sperre auf den Zweig legen
        if: always()
        run: |
          # Nur schreiben, wenn dieser Lauf sie eben gesetzt hat. Das Skript
          # legt sie dafür in eine **eigene** Datei; `sperre.txt` ist die vom
          # Zweig geholte, und die wieder hinaufzuschieben wäre eine Schleife
          # ohne Zweck.
          #
          # Der erste Anlauf fragte `sperre.txt` ab und traf damit auch die
          # geholte Marke: Am 20.09.2026 um 16:05 hielt der Riegel, der Lauf
          # schickte nichts – und schob die Marke trotzdem noch einmal hoch.
          [ -f out/instagram/sperre-neu.txt ] || {
            echo "Keine neue Sperre aus diesem Lauf – nichts zu schreiben."
            exit 0
          }

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          inhalt=$(mktemp)
          cp out/instagram/sperre-neu.txt "$inhalt"

          git checkout --orphan instagram-sperre
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp "$inhalt" sperre.txt

          git add sperre.txt
          git commit -m "Instagram für $(date -u +%F) gesperrt – Warteschlange voll"
          git push --force origin instagram-sperre

          echo "::notice::Instagram ist für heute gesperrt. Warteschlange bei Make leeren."

      - name: Was hinausgegangen wäre
        if: always()
        run: |
          {
            echo "### Instagram-Beitrag"
            echo ""
            echo "Kacheln: ${{ steps.holen.outputs.kacheln }}"
            echo ""
            if [ "${{ steps.zugang.outputs.vorhanden }}" != "ja" ]; then
              echo "**Keine Zugangsdaten** – weder IG_ACCESS_TOKEN/IG_USER_ID noch MAKE_WEBHOOK_URL."
              echo "Es ist nichts hinausgegangen. Der eine Weg steht in EINRICHTUNG.md 3.4"
              echo "und 3.5, der andere in 3.11."
            elif [ "${{ github.event_name }}" = "schedule" ] \
              || [ "${{ inputs.veroeffentlichen }}" = "true" ]; then
              echo "Scharf gestellt. Ob der Beitrag hinausging, sagt das Protokoll"
              echo "des Schrittes Veroeffentlichen - die beiden Riegel dort koennen"
              echo "ihn zurueckgehalten haben: Website noch von gestern, oder der"
              echo "Beitrag von heute steht schon im Kanal."
            else
              echo "**Trockenlauf** – es ist nichts hinausgegangen."
              echo "Zum Veröffentlichen den Haken setzen."
            fi
            echo ""
            echo '```'
            cat out/instagram/beschriftung.txt 2>/dev/null || echo '(keine Beschriftung)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
