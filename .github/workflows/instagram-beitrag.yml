name: Instagram-Beitrag

# Veröffentlicht das Karussell der Tagesausgabe bei @im_invests.
#
# ## Wo er in der Kette hängt – und warum nicht früher
#
# Angestoßen vom **letzten Schritt in `paket-bauen.yml`**, nachdem das Paket
# übertragen und von außen nachgeprüft wurde.
#
# Der Kopf dieser Datei nannte bis zum 29. August 2026 `nachrichten.yml` als
# Ziel – dorthin, wo auch der Podcast hängt. Das wäre zu früh gewesen, und
# zwar auf die unangenehme Art:
#
# Meta holt die Bilder **selbst** von `iminvests.de/instagram/1.jpg`. Diese
# Adresse antwortet jeden Tag, auch bevor der neue Stand übertragen ist – dann
# eben mit der Kachel von gestern. `nachrichten.yml` endet, während der
# Paketbau noch läuft. Ein Anstoß von dort hätte an vielen Tagen die
# Schlagzeilen von gestern gepostet, ohne dass ein Lauf rot geworden wäre.
#
# Der Podcast darf früher hängen, weil er die Ausgabe aus dem Repository liest.
# Dieser Lauf liest sie vom Webspace. Das ist der ganze Unterschied.
#
# **Kein eigener Cron als Regelweg:** Geplante Läufe werden hier regelmäßig
# verworfen. Der Rückfalltermin unten ist genau das – ein Rückfall –, und beide
# Wege dürfen sich überschneiden, dafür gibt es die Riegel.
#
# ## Vier Riegel – drei im Skript, einer hier
#
# Der vierte steht weiter unten in diesem Workflow: **die Freigabe des
# Tages.** Der Tagesbeitrag „Top-News des Tages" ist seit dem Abend des
# 11. Oktober 2026 dauerhaft freigegeben und geht seit dem 17.10. täglich von selbst hinaus;
# jeder andere Beitrag braucht die Freigabe für genau seinen Tag.
#
# ## Zwei Riegel im Skript, keiner davon in diesem Workflow
#
# `scripts/instagram-veroeffentlichen.ts` prüft vor dem ersten Behälter:
#
#   1. Trägt die Beschriftung auf der Website den heutigen Tag? Wenn nicht,
#      ist die Übertragung noch nicht durch – Ende, ohne roten Lauf.
#   2. Steht im Kanal schon ein Beitrag von heute? Gefragt wird **Instagram
#      selbst**, nicht eine Datei im Repository. Ein Riegel ist so gut wie die
#      Quelle, die er fragt.
#
# Beide enden mit Code 0. Ein Beitrag, der ausbleibt, weil er schon draußen
# ist, ist kein Fehlschlag – und eine Mail an jedem richtigen Tag liest nach
# zwei Wochen niemand mehr.
#
# ## Der dritte Riegel: die Sperre des Tages
#
# Am 20. September 2026 lief dieser Workflow fünfmal – 00:58, 04:52, 07:55,
# 08:55, 09:42 – und bekam jedes Mal `400: Queue is full`. Im Protokoll stand
# jedes Mal der Satz „Nicht noch einmal anstoßen: Jeder Anstoß legt einen
# weiteren Eintrag in dieselbe volle Warteschlange." Er stand da und band
# niemanden, weil er an einen Menschen gerichtet war.
#
# Ein Satz im Protokoll ist keine Regel. Deshalb hinterlässt ein Lauf, dem der
# Dienst die volle Warteschlange meldet, jetzt eine Marke auf dem wurzellosen
# Zweig `instagram-sperre`, und jeder weitere Lauf desselben Tages sieht sie
# und schickt nichts. Am nächsten Tag läuft es ohne Zutun wieder an.
#
# **Nur diese eine Sorte Fehler sperrt.** Alles andere trägt der nächste Lauf
# nach; das ist die Regel des Hauses. Die volle Warteschlange ist die
# Ausnahme, weil der nächste Versuch dort nicht folgenlos ist, sondern
# schadet. Die Entscheidung selbst liegt in `lib/instagram-sperre.ts`, damit
# sie ohne Netz und ohne Dienst prüfbar ist.

on:
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: 'Wirklich veröffentlichen? (leer = nur Trockenlauf)'
        type: boolean
        default: false
      nochmal:
        description: 'Heute schon einmal veröffentlicht und vom Betreiber gelöscht – trotzdem neu hochladen (nur nach seinem OK)'
        type: boolean
        default: false
      abgenommen:
        description: 'Der Betreiber hat die Kacheln gesehen und freigegeben – sein Urteil gilt statt der Sichtprüfung (die gerechnete Prüfung bleibt)'
        type: boolean
        default: false

  # Der Rückfall, falls der Anstoß aus dem Paketbau ausbleibt: 04:52 deutscher
  # Zeit. Krumme Minute, weil runde am dichtesten belegt sind.
  #
  # Spät genug, dass die Übertragung durch ist (der Paketbau der Nacht endet
  # gegen 03:30 UTC), früh genug für den Morgen. Greift der Anstoß wie
  # vorgesehen, findet dieser Lauf den Beitrag von heute bereits im Kanal und
  # hört nach ein paar Sekunden auf.
  schedule:
    - cron: '52 2 * * *'

# Anstoß und Rückfalltermin können sich am selben Tag treffen. Der laufende
# wird **nicht** abgebrochen: Er ist womöglich schon beim Hochladen, und ein
# halb angelegtes Karussell kostet Kontingent, ohne etwas zu zeigen.
concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  beitrag:
    name: Karussell veröffentlichen
    runs-on: ubuntu-latest
    # 15 für den Beitrag, dazu bis zu 8 für die Sichtprüfung.
    timeout-minutes: 25

    permissions:
      # Zum Schreiben des wurzellosen Zweiges `instagram-sperre`.
      contents: write
      # Für die Sichtprüfung: `claude-code-action` holt sich ihren Zugang
      # über OIDC (siehe nachrichten-agent.yml).
      id-token: write
      # Für die Selbstreparatur: `gh workflow run instagram-bilder.yml`.
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Die Kacheln kommen aus dem letzten Bau, der auf dem Webspace liegt –
      # nicht aus diesem Lauf. Sie werden hier nur geholt, damit das Skript
      # ihre Anzahl kennt und die Beschriftung lesen kann.
      - name: Kacheln und Beschriftung von der Website holen
        id: holen
        run: |
          basis="${NEXT_PUBLIC_SITE_URL:-https://iminvests.de}"
          basis="${basis%/}"
          mkdir -p out/instagram

          # Zuerst: Gibt es heute überhaupt einen Beitrag? An Tagen ohne gültigen
          # Plan steht unter /instagram/ nur das Deckblatt.
          # Das ist kein Fehler – das Skript sagt danach, warum nichts hinausgeht.
          code=$(curl -s -o out/instagram/stand.txt -w '%{http_code}' "$basis/instagram/stand.txt")
          [ "$code" = "200" ] || rm -f out/instagram/stand.txt
          echo "Stand:"; sed 's/^/  /' out/instagram/stand.txt 2>/dev/null || echo "  (keiner)"
          if [ "$(sed -n 2p out/instagram/stand.txt 2>/dev/null)" != "tagesnews" ]; then
            curl -s -o out/instagram/1.jpg "$basis/instagram/1.jpg" || true
            echo "kacheln=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Wie viele Kacheln gibt es? Gezählt wird, bis eine fehlt – die
          # Anzahl haengt an der Ausgabe des Tages und ist nicht fest.
          n=1
          gefunden=0
          while [ "$n" -le 10 ]; do
            code=$(curl -s -o "out/instagram/$n.jpg" -w '%{http_code}' "$basis/instagram/$n.jpg")
            if [ "$code" != "200" ]; then
              rm -f "out/instagram/$n.jpg"
              break
            fi
            gefunden=$n
            n=$((n + 1))
          done

          if [ "$gefunden" -lt 2 ]; then
            echo "::error::Unter $basis/instagram/ liegen nur $gefunden Kachel(n)."
            echo "  Ein Karussell braucht mindestens zwei. Steht der letzte Bau?"
            exit 1
          fi

          code=$(curl -s -o out/instagram/beschriftung.txt -w '%{http_code}' \
            "$basis/instagram/beschriftung.txt")
          [ "$code" = "200" ] || rm -f out/instagram/beschriftung.txt

          echo "$gefunden Kacheln geholt."
          echo "kacheln=$gefunden" >> "$GITHUB_OUTPUT"
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      # Solange die beiden Zugangsdaten fehlen, kann dieser Lauf nichts tun.
      # Das ist kein Fehlschlag, sondern der Zustand vor der Einrichtung –
      # aber es gehoert sichtbar gemacht, sonst sieht ein uebersprungener
      # Beitrag genauso aus wie ein gelungener.
      - name: Zugangsdaten prüfen
        id: zugang
        run: |
          if [ -n "${{ secrets.IG_ACCESS_TOKEN }}" ] && [ -n "${{ secrets.IG_USER_ID }}" ]; then
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
            echo "Eigenes Token – der Beitrag geht direkt an die Graph-Schnittstelle."
          elif [ -n "${{ secrets.MAKE_WEBHOOK_URL }}" ]; then
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
            echo "Kein eigenes Token, aber ein Haken beim Dienst – der Beitrag geht dort hinaus."
            echo "::notice::Der Doppelriegel liegt in diesem Fall im Szenario beim Dienst."
          else
            echo "vorhanden=nein" >> "$GITHUB_OUTPUT"
            echo "::warning::Weder IG_ACCESS_TOKEN/IG_USER_ID noch MAKE_WEBHOOK_URL – es geht nichts hinaus."
            echo "  Der eine Weg steht in EINRICHTUNG.md 3.4 und 3.5, der andere in 3.11."
          fi

      # Der vierte Riegel: die Freigabe des Tages.
      #
      # Zwei Anordnungen des Betreibers, beide vom 11. Oktober 2026:
      #
      #   1. Nachmittags, als der direkte Weg zu Meta zum ersten Mal stand:
      #      nichts geht hinaus, was er nicht vorher gesehen hat.
      #   2. Abends, nachdem „Top-News des Tages" nach dem Muster der 54
      #      bisherigen Tagesbeiträge nachgebaut war: „Sobald die Daily News
      #      nachts gemacht werden … soll bei Instagram die Daily News nun
      #      vollautomatisch erscheinen."
      #
      # Daraus folgt: **Der Tagesbeitrag ist freigegeben, jeden Tag, ohne
      # Zutun.** Ob es heute einen gibt, sagt /instagram/stand.txt – „tagesnews"
      # (seit dem 17.10.2026 täglich, davor montags bis freitags) nur mit einem Plan, der die Prüfung in
      # lib/instagram-plan.ts bestanden hat. Alles andere – ein Erklärbeitrag,
      # eine Zahlenkarte, sobald es dafür einen Erzeuger gibt – braucht weiter
      # die Freigabe für genau diesen Tag:
      #
      #     gh variable set INSTAGRAM_FREIGABE --body 2026-10-12
      #
      # Ein Datum statt eines Schalters, weil ein true stehen bleibt und die
      # Automatik unbemerkt auf alles ausdehnt. Begründung in ENTSCHEIDUNGEN.md
      # unter „Der vierte Riegel ist ein Datum, kein Schalter".
      - name: Freigabe des Tages prüfen
        id: freigabe
        run: |
          heute=$(date -u +%F)
          frei="${{ vars.INSTAGRAM_FREIGABE }}"
          art=$(sed -n 2p out/instagram/stand.txt 2>/dev/null)

          if [ "$art" = "tagesnews" ]; then
            echo "heute=ja" >> "$GITHUB_OUTPUT"
            echo "Tagesbeitrag – freigegeben ohne Zutun (Anordnung vom 11.10.2026)."
          elif [ "$frei" = "$heute" ]; then
            echo "heute=ja" >> "$GITHUB_OUTPUT"
            echo "Freigegeben für $heute."
          else
            echo "heute=nein" >> "$GITHUB_OUTPUT"
            echo "Kein Tagesbeitrag und keine Freigabe für $heute (INSTAGRAM_FREIGABE: ${frei:-nicht gesetzt})."
            echo "Dieser Lauf zeigt nur, was hinausginge."
          fi

      # Wann wird wirklich veroeffentlicht?
      #
      #   workflow_dispatch  nur mit gesetztem Haken – von Hand wird geprueft,
      #                      nicht gepostet, solange niemand es ausdruecklich will
      #   schedule           ja; der Rueckfalltermin ist der Ernstfall
      #   Anstoss aus dem Paketbau  ja, per `-f veroeffentlichen=true`
      #
      # **Und in allen drei Faellen zusaetzlich: nur mit der Freigabe** – für
      # den Tagesbeitrag gilt sie von selbst, für alles andere je Tag.
      #
      # Ohne Zugangsdaten bleibt es beim Trockenlauf – das Skript zaehlt dann
      # die Kacheln auf und hoert vor dem ersten Behaelter auf.
      # Die Marke des Tages, falls es eine gibt. Gefragt wird der Zweig von
      # **jetzt**, nicht der Checkout: Der ist eine Momentaufnahme vom
      # Auslösen, und zwischen Auslösen und Laufen kann genau der Lauf
      # gescheitert sein, dessen Marke hier zählt.
      - name: Sperre des Tages holen
        run: |
          mkdir -p out/instagram
          if git fetch --depth 1 origin instagram-sperre 2>/dev/null; then
            git show FETCH_HEAD:sperre.txt > out/instagram/sperre.txt 2>/dev/null || true
            echo "Marke vom Zweig:"
            sed 's/^/  /' out/instagram/sperre.txt 2>/dev/null || echo "  (keine)"
          else
            echo "Kein Zweig instagram-sperre – nichts gesperrt."
          fi

      # Wurde heute schon einmal veröffentlicht? Dann hat der Betreiber den
      # Beitrag gelöscht, wenn der Kanal leer ist – und er kommt nicht von
      # selbst wieder (26.10.2026: ein Bau nach einem Merge lud die gelöschte
      # Fassung um 07:04 erneut hoch). Gründe in scripts/instagram-veroeffentlichen.ts.
      - name: Schon veröffentlicht?
        id: gepostet
        run: |
          mkdir -p out/instagram
          if git fetch --depth 1 origin instagram-gepostet 2>/dev/null; then
            git show FETCH_HEAD:gepostet.txt > out/instagram/gepostet.txt 2>/dev/null || true
            # Das Gedächtnis der Bildprüfung: die Abdrücke der Kacheln, die
            # schon draußen waren (`lib/instagram-bildpruefung.ts`).
            git show FETCH_HEAD:bilder.txt > out/instagram/bilder-frueher.txt 2>/dev/null || true
          fi
          touch out/instagram/gepostet.txt out/instagram/bilder-frueher.txt
          tail -3 out/instagram/gepostet.txt
          tag=$(sed -n 1p out/instagram/stand.txt 2>/dev/null)
          if [ -n "$tag" ] && grep -qx "$tag" out/instagram/gepostet.txt && [ "$NOCHMAL" != "ja" ]; then
            echo "schon=ja" >> "$GITHUB_OUTPUT"
          else
            echo "schon=nein" >> "$GITHUB_OUTPUT"
          fi
        env:
          NOCHMAL: ${{ inputs.nochmal && 'ja' || 'nein' }}

      # Die doppelte Prüfung, bevor etwas hinausgeht – Betreiber, 26.10.2026:
      # „morgens eine doppelte Prüfung … nicht von mir, sondern von dir".
      #
      # Erst sieht ein Modell jede Kachel an (das Auge), dann rechnet ein
      # Skript (die Waage). Das Auge findet, was keine Rechnung findet –
      # Wasserbüffel für die Bank of England, Gebärdensprache für Alphabet.
      # Die Waage findet, was ein Auge übersieht – dasselbe Foto unter zwei
      # Überschriften, ein Bild von vorgestern. Anlass und Grenzen in
      # `lib/instagram-bildpruefung.ts`.
      #
      # Nur, wenn heute noch nichts draußen ist: Die meisten Läufe des Tages
      # hören am Riegel „schon veröffentlicht" auf, und das Auge kostet
      # Kontingent des Abonnements.
      - name: Anmeldung der Sichtprüfung
        id: anmeldung
        if: steps.holen.outputs.kacheln != '0' && steps.gepostet.outputs.schon == 'nein'
        run: |
          # Genau eine Anmeldung, nie beide – Begründung in nachrichten-agent.yml.
          if [ -n "$OAUTH" ]; then echo "art=abo" >> "$GITHUB_OUTPUT"
          elif [ -n "$SCHLUESSEL" ]; then echo "art=schluessel" >> "$GITHUB_OUTPUT"
          else echo "art=keine" >> "$GITHUB_OUTPUT"; echo "::warning::Keine Anmeldung – die Sichtprüfung fällt aus."
          fi
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCHLUESSEL: ${{ secrets.ANTHROPIC_API_KEY }}

      # Fällt das Auge aus (Kontingent, Netz), bricht dieser Schritt nicht ab –
      # aber seit dem 28.10.2026 geht dann auch nichts hinaus: Die Bildprüfung
      # verlangt ein Urteil zu jeder Kachel. Qualität vor Pünktlichkeit
      # (Betreiber: „nachgeprüft wird, bis die Bilder passen").
      - name: Sichtprüfung
        if: steps.anmeldung.outputs.art == 'abo' || steps.anmeldung.outputs.art == 'schluessel'
        continue-on-error: true
        timeout-minutes: 8
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.anmeldung.outputs.art == 'abo' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ steps.anmeldung.outputs.art == 'schluessel' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: 'github-actions'
          claude_args: |
            --model claude-sonnet-5
            --max-turns 20
            --allowedTools Read,Write
          prompt: |
            Du prüfst die Kacheln eines Instagram-Beitrags von IM Invests, bevor
            er hinausgeht. Niemand sieht sie danach noch an: Was du durchlässt,
            sehen tausende Menschen.

            Die Kacheln liegen als `out/instagram/2.jpg`, `3.jpg`, … (so viele,
            wie es gibt; `1.jpg` ist das Deckblatt und wird nicht geprüft).
            Sieh **jede** einzeln an (Read). Jede Kachel hat oben eine
            Überschrift, in der Mitte ein Bild (Foto, Logo oder Kursverlauf),
            unten einen kurzen Text.

            Eine Kachel **passt nicht**, wenn
            - das Bild etwas anderes zeigt, als die Meldung meint: ein anderes
              Unternehmen, ein anderes Land, eine andere Notenbank, Sport,
              Tiere, Gebärdensprache, ein beliebiges Gebäude, das niemand
              erkennt;
            - es für eine Notenbank nicht deren Chef/Chefin oder Gebäude zeigt,
              für ein Unternehmen nicht Marke, Logo, Werk, Produkt oder
              Kursverlauf;
            - ein Kursverlauf eine Achse vermissen lässt oder in die andere
              Richtung zeigt als die Überschrift sagt;
            - zwei Kacheln dasselbe oder fast dasselbe Bild zeigen (dann beide);
            - eine Kachel gar kein Bild hat.

            Eine Kachel **passt**, wenn das Bild zeigt: die Firma (Logo,
            Schild, Werk, Produkt), ihren Chef oder ihre Chefin, das Logo der
            Mutter, wenn der Text die Firma als deren Tochter nennt, den
            Kursverlauf, oder bei Rohstoffen und Energie eine Anlage, die
            diesen Rohstoff zeigt (Raffinerie, Kraftwerk, Förderturm).

            Im Zweifel: passt nicht. Ein verschobener Beitrag kostet weniger
            als ein falscher.

            Schreibe das Ergebnis als `out/instagram/sichtpruefung.json`,
            nur dieses JSON, für **jede** geprüfte Kachel einen Eintrag:

                {"kacheln": [{"stelle": 2, "passt": true, "grund": "Kursverlauf Alphabet, Achsen da"},
                             {"stelle": 3, "passt": false, "grund": "Foto zeigt das Audi-Werk, Meldung ist der Ifo-Index"}]}

            `grund` immer ausfüllen, ein Satz, auf Deutsch.

      # `abgenommen`: Am 27.10.2026 sah der Betreiber die Kacheln und gab sie
      # frei („Die News des Tages passen so auch … Jetzt sofort hochladen"),
      # die Sichtprüfung lehnte sie trotzdem ab – den Chef von Anthropic, das
      # Logo der Mutter Deutsche Bank bei der DWS, Kühltürme beim Gaspreis,
      # die zwei Stunden vorher noch durchgegangen waren. Ein Mensch, der
      # hingesehen hat, schlägt das Modell; doppelte und leere Bilder findet
      # die Rechnung trotzdem.
      - name: Bildprüfung
        id: bildpruefung
        if: steps.holen.outputs.kacheln != '0' && steps.gepostet.outputs.schon == 'nein'
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/alias-hook.mjs scripts/instagram-bildpruefung.ts
        env:
          ABGENOMMEN: ${{ inputs.abgenommen && 'ja' || 'nein' }}

      # Die Selbstreparatur (28.10.2026). Am 27. und 28.10. hielt die Prüfung
      # zu Recht falsche Bilder auf – und nichts tauschte sie aus: Jeder
      # weitere Lauf scheiterte am selben Bild, die News gingen nicht hinaus,
      # bis jemand von Hand austauschte. Jetzt sucht `instagram-bilder.yml`
      # genau die abgelehnten Stellen neu (bereits verwendete Bilder sind
      # ausgeschlossen), stößt den Bau an, und der Bau diesen Beitrag.
      #
      # Jede Runde prüft der neue Beitragslauf wieder vollständig – Waage und
      # Auge. Hinaus geht erst, was beide bestehen. Höchstens acht Runden am
      # Tag, gezählt an den Commits „Instagram: Tagesbilder für <Tag>" auf
      # `main` (der erste ist die Suche selbst) – sonst liefe eine Kachel ohne
      # passendes Bild im Kreis. Dann bleibt es rot, und der Betreiber
      # tauscht von Hand. Der Lauf bleibt immer rot: Er hat nicht veröffentlicht.
      - name: Abgelehnte Bilder neu suchen
        if: failure() && steps.bildpruefung.outcome == 'failure' && hashFiles('out/instagram/abgelehnt.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(head -1 out/instagram/stand.txt | tr -d '[:space:]')
          nur=$(tr -d '[:space:]' < out/instagram/abgelehnt.txt)
          [ -n "$nur" ] || { echo "::warning::Keine Stelle zum Austauschen benannt."; exit 0; }
          suchen=$(gh api "repos/${{ github.repository }}/commits?sha=main&since=${tag}T00:00:00Z&per_page=100" \
            --jq "[.[] | select(.commit.message | startswith(\"Instagram: Tagesbilder für ${tag}\"))] | length")
          if [ "${suchen:-0}" -ge 9 ]; then
            echo "::error::Schon $((suchen - 1)) Reparaturen für ${tag} – Kachel(n) ${nur} von Hand austauschen (instagram-bilder-auswahl.yml)."
            exit 1
          fi
          echo "::warning::Kachel(n) ${nur} abgelehnt – suche neu (Reparatur $suchen von 8)."
          gh workflow run instagram-bilder.yml --repo "${{ github.repository }}" --ref main \
            -f datum="$tag" -f neu=true -f nur="$nur" -f anstossen=true

      - name: Veröffentlichen
        run: npm run instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NOCHMAL: ${{ inputs.nochmal && 'ja' || 'nein' }}
          VEROEFFENTLICHEN: >-
            ${{ (steps.zugang.outputs.vorhanden == 'ja'
                 && steps.freigabe.outputs.heute == 'ja'
                 && (github.event_name == 'schedule' || inputs.veroeffentlichen))
                && 'ja' || 'nein' }}

      # Hat der Lauf eben eine Sperre gesetzt, kommt sie auf den Zweig – sonst
      # wüsste der nächste Lauf nichts davon. `if: always()`, weil der Schritt
      # davor in genau diesem Fall rot geworden ist.
      #
      # Der Zweig ist wurzellos und hat immer genau einen Commit: Es gibt
      # nichts zu sammeln, die Marke gilt einen Tag.
      - name: Veröffentlichung vermerken
        run: |
          [ -f out/instagram/gepostet-neu.txt ] || { echo "Nichts veröffentlicht – nichts zu vermerken."; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          inhalt=$(mktemp)
          cat out/instagram/gepostet.txt out/instagram/gepostet-neu.txt | sort -u | tail -60 > "$inhalt"
          bilder=$(mktemp)
          cat out/instagram/bilder-frueher.txt out/instagram/bilder-heute.txt 2>/dev/null | sort -u | tail -200 > "$bilder"
          git checkout --orphan instagram-gepostet
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp "$inhalt" gepostet.txt
          cp "$bilder" bilder.txt
          git add gepostet.txt bilder.txt
          git commit -m "Instagram veröffentlicht am $(date -u +%F)"
          for versuch in 1 2 3; do git push --force origin instagram-gepostet && exit 0; sleep $((versuch * 5)); done
          echo "::error::Die Veröffentlichung ließ sich nicht vermerken – ein gelöschter Beitrag käme sonst zurück."
          exit 1

      - name: Sperre auf den Zweig legen
        if: always()
        run: |
          # Nur schreiben, wenn dieser Lauf sie eben gesetzt hat. Das Skript
          # legt sie dafür in eine **eigene** Datei; `sperre.txt` ist die vom
          # Zweig geholte, und die wieder hinaufzuschieben wäre eine Schleife
          # ohne Zweck.
          #
          # Der erste Anlauf fragte `sperre.txt` ab und traf damit auch die
          # geholte Marke: Am 20.09.2026 um 16:05 hielt der Riegel, der Lauf
          # schickte nichts – und schob die Marke trotzdem noch einmal hoch.
          [ -f out/instagram/sperre-neu.txt ] || {
            echo "Keine neue Sperre aus diesem Lauf – nichts zu schreiben."
            exit 0
          }

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          inhalt=$(mktemp)
          cp out/instagram/sperre-neu.txt "$inhalt"

          git checkout --orphan instagram-sperre
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp "$inhalt" sperre.txt

          git add sperre.txt
          git commit -m "Instagram für $(date -u +%F) gesperrt – Warteschlange voll"
          git push --force origin instagram-sperre

          echo "::notice::Instagram ist für heute gesperrt. Warteschlange bei Make leeren."

      - name: Was hinausgegangen wäre
        if: always()
        run: |
          {
            echo "### Instagram-Beitrag"
            echo ""
            echo "Kacheln: ${{ steps.holen.outputs.kacheln }}"
            echo ""
            if [ "${{ steps.zugang.outputs.vorhanden }}" != "ja" ]; then
              echo "**Keine Zugangsdaten** – weder IG_ACCESS_TOKEN/IG_USER_ID noch MAKE_WEBHOOK_URL."
              echo "Es ist nichts hinausgegangen. Der eine Weg steht in EINRICHTUNG.md 3.4"
              echo "und 3.5, der andere in 3.11."
            elif [ "${{ steps.freigabe.outputs.heute }}" != "ja" ]; then
              echo "**Keine Freigabe für heute** – es ist nichts hinausgegangen."
              echo ""
              echo "Oben steht die Beschriftung, die hinausginge. Ist sie abgenommen:"
              echo ""
              echo '    gh variable set INSTAGRAM_FREIGABE --body '"$(date -u +%F)"
              echo ""
              echo "Danach diesen Workflow mit gesetztem Haken starten."
            elif [ "${{ github.event_name }}" = "schedule" ] \
              || [ "${{ inputs.veroeffentlichen }}" = "true" ]; then
              echo "Scharf gestellt. Ob der Beitrag hinausging, sagt das Protokoll"
              echo "des Schrittes Veroeffentlichen - die beiden Riegel dort koennen"
              echo "ihn zurueckgehalten haben: Website noch von gestern, oder der"
              echo "Beitrag von heute steht schon im Kanal."
            else
              echo "**Trockenlauf** – es ist nichts hinausgegangen."
              echo "Zum Veröffentlichen den Haken setzen."
            fi
            echo ""
            echo '```'
            cat out/instagram/beschriftung.txt 2>/dev/null || echo '(keine Beschriftung)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
