name: Quellen vorab prüfen

# Klopft vor einem Nachrichtenlauf ab, welche Quellen heute Text liefern.
#
# ## Warum es diesen Workflow gibt
#
# Weil eine Quelle auf drei Arten ausfallen kann und nur eine davon auffällt:
# Sie antwortet nicht (Statuscode – sieht jeder), sie antwortet mit 200 und
# liefert ein Gerüst aus Menü und Fußzeile (der Inhalt kommt per JavaScript
# nach), oder sie antwortet mit 200 und liefert etwas von vorgestern.
#
# Fall zwei und drei führen nicht zu einem Abbruch, sondern zu einer dünneren
# Ausgabe: sechs Artikel statt neun, alle aus den zwei Quellen, die noch gingen,
# und niemand merkt, dass drei ausgefallen sind. Diese Prüfung macht den
# Ausfall sichtbar, **bevor** jemand schreibt.
#
# ## Warum ein Läufer
#
# Aus derselben Not wie bei `quellen-holen.yml`: Die Entwicklungsumgebung
# erreicht nur GitHub und npm, jede andere Adresse endet am Egress-Proxy mit
# 403. Ein Läufer hat vollen Netzzugang.
#
# ## Was hier nicht passiert
#
# Es wird nichts ins Repository geschrieben und kein fremder Text ausgegeben.
# Gemessen werden Zeichen und Urteile; wer eine Quelle **lesen** will, nimmt
# danach `quellen-holen.yml` mit den Adressen, die dieser Lauf am Ende auflistet.
#
# ## Warum eine halbe Stunde vor der Nachrichten-Routine
#
# Damit das Ergebnis dasteht, wenn der Nachrichtenlauf beginnt. Ein rotes
# Ergebnis ist kein Grund, den Lauf abzusagen – es ist die Ansage, welche
# Rubrik heute eine Ausweichquelle braucht.
#
# Der Abstand ist das Einzige, was hier zählt: Verschiebt sich die Routine,
# verschiebt sich dieser Lauf mit. Beides zieht die Routine „Zeitumstellung“
# zweimal im Jahr gemeinsam nach.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stichtag JJJJ-MM-TT (leer = heute)'
        required: false
        type: string
  schedule:
    # 03:00 UTC – eine halbe Stunde vor der Nachrichten-Routine (03:30 UTC,
    # also 5:30 Uhr deutscher Sommerzeit), damit das Ergebnis fertig ist,
    # wenn sie anläuft. In der Winterzeit: 04:00 UTC.
    #
    # Bis zum 3. August 2026 stand hier 05:30 UTC. Das passte zur damaligen
    # Routine um 06:00 UTC; seit sie auf 5:30 Uhr deutscher Zeit vorgezogen
    # wurde, wäre die Probe zwei Stunden **nach** dem Lauf gekommen – also
    # genau dann, wenn ihr Ergebnis niemandem mehr nützt.
    - cron: '3 0 * * *'

concurrency:
  group: quellen-pruefen
  cancel-in-progress: false

jobs:
  pruefen:
    name: Quellen abklopfen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Zum Anstoßen von `quellen-sammeln.yml` im letzten Schritt.
      actions: write
    # Ein rotes Ergebnis ist eine Aussage über die Quellenlage, kein Defekt
    # dieses Workflows. Es soll im Protokoll stehen und den Lauf kennzeichnen,
    # aber niemanden daran hindern, die Ausgabe trotzdem zu schreiben.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Quellen abklopfen
        run: node --experimental-strip-types scripts/quellen-pruefen.ts ${{ inputs.tag }}

      # Der dritte Weg, den Sammellauf zu starten.
      #
      # `quellen-sammeln.yml` hat zwei eigene Termine (03:07 und 03:17). Am
      # 5. August 2026 hat sein einziger damaliger Termin nicht gefeuert, und
      # die Routine sah zwanzig Minuten später in eine Datei vom Vortag.
      #
      # Dieser Workflow läuft ohnehin um 03:03 – acht Zeilen später ist die
      # dritte Gelegenheit. Läuft der Sammler ohnehin, kostet der zusätzliche
      # Start zwanzig Sekunden; fiel er aus, rettet er den Tag.
      #
      # `if: always()` steht hier mit Absicht: Der Schritt darüber darf rot
      # werden – das ist eine Aussage über die Quellenlage, kein Grund, den
      # Sammler ausfallen zu lassen. Und ein Fehlschlag beim Anstoßen darf
      # diesen Workflow nicht zusätzlich rot färben, deshalb `|| true`.
      - name: Sammellauf sicherheitshalber anstoßen
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run quellen-sammeln.yml \
            --repo "${{ github.repository }}" --ref main \
            && echo "Sammellauf angefordert." \
            || echo "::warning::Sammellauf ließ sich nicht anstoßen – die eigenen Termine bleiben."
