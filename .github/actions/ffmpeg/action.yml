name: ffmpeg einrichten
description: >-
  Bringt ffmpeg und ffprobe auf den Läufer – über apt, mit Uhr, und wenn apt
  hängt oder scheitert, als statischen Bau.

# ## Warum es das gibt
#
# ffmpeg liegt seit dem 8. August 2026 nicht mehr auf dem Läufer-Abbild, und
# vier Workflows installierten es mit denselben vier Zeilen. Am 27.10.2026
# hing `apt-get` in der Hörprobe zweimal, bis der Lauf nach 30 Minuten
# abgebrochen wurde – dieselben Zeilen standen im Podcast-Lauf der Nacht.
#
# Jetzt an einer Stelle: `apt-get update` darf scheitern (fremde
# Paketquellen antworten mit 403, siehe podcast-erzeugen.yml), beide Schritte
# haben eine Uhr, und der Rückweg ist der statische Bau von johnvansickle.com,
# der ffmpeg **und** ffprobe enthält (der Podcast braucht beide).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
          echo "ffmpeg liegt schon bereit."
          ffmpeg -version | head -1
          exit 0
        fi
        timeout 120 sudo apt-get update -qq \
          || echo "::warning::apt-get update meldet Fehler oder hing – die Installation wird trotzdem versucht."
        if ! timeout 300 sudo apt-get install -y -qq ffmpeg; then
          echo "::warning::apt-get install ffmpeg scheiterte oder hing – ffmpeg kommt als statischer Bau."
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          sudo install -m 755 /tmp/ffmpeg/ffmpeg /tmp/ffmpeg/ffprobe /usr/local/bin/
        fi
        ffmpeg -version | head -1
        ffprobe -version | head -1
